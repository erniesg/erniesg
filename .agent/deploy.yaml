# Generated by rucksack. Names only; do not store secret values here.
version: 1
providers:
  - id: cloudflare
    kind: provider
    markers:
      - wrangler.jsonc
    tools:
      - wrangler
environments:
  preview:
    purpose: "ephemeral validation before merge or release"
    trusted_context_required: true
    approval_required: true
  production:
    purpose: "customer-facing production deploy"
    trusted_context_required: true
    approval_required: true
lanes:
  infra-plan:
    command: ""
    required: false
    human_gate: "review plan output before apply"
  vm-bootstrap:
    command: "APPLY=1 infra/vm/bootstrap.sh"
    required: false
    trusted_context_required: true
    human_gate: "approve VM target, SSH/Tailscale access, and rollback path before execution"
  preview:
    command: "npm run worker:deploy:preview"
    required: false
    human_gate: "approve provider/environment mapping before enabling"
  deploy:
    command: "npm run worker:deploy:production"
    required: false
    human_gate: "approve production deploy before execution"
  healthcheck:
    command: "npm run worker:verify -- --base https://ernie.sg --compare https://erniesg.pages.dev --expect workers"
    required: false
    human_gate: "confirm health check target before relying on it"
  rollback:
    command: "npm run worker:rollback"
    required: false
    human_gate: "approve rollback before execution"
required_secrets:
  cloudflare:
    - CLOUDFLARE_API_TOKEN
    - CLOUDFLARE_ACCOUNT_ID
human_gates:
  - "approve provider/environment mapping"
  - "approve secret names and storage locations"
  - "approve production deploy"
  - "approve rollback"
  - "confirm health check and rollback commands"
