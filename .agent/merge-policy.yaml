# Generated by rucksack. Secret values must stay in GitHub/VM secret stores, not this file.
schema_version: 2
mode: automatic
merge:
  method: squash
  close_linked_issues: true
eligible:
  base_branch_patterns:
    - main
    - staging
  head_branch_patterns:
    - "codex/*"
    - "claude/*"
    - "coordinator/*"
    - "fix/*"
    - "feat/*"
    - "chore/*"
    - "docs/*"
  automatic_path_patterns:
    - "docs/**"
    - "tests/**"
    - "*.md"
    - "README.md"
    - "src/research/**"
    - "src/components/research/**"
    - "src/pages/research/**"
    - "src/struct/**"
    - "skills/struct-typeset/**"
    - "tools/pdf-*"
    - "tools/srt/**"
    - "package.json"
risk:
  # The executor derives this verdict from trusted exact-head review evidence.
  # Existing workflow maintenance needs immutable proof; broad path approval is absent.
  automated_review_check: automated correctness review
human_opt_in:
  commands:
    - "/rucksack merge"
required:
  checks:
    - checks
    - evidence
    - secret-scan
    - automated correctness review
  # approved = GitHub approval only; reviewed = approved or trusted independent review evidence;
  # none = no review gate. Defaults stay conservative.
  review_state: none
  # Preserve the existing effective requirement explicitly. Current provider
  # protection with zero required approvals does not satisfy this gate.
  server_side_branch_protection: true
  linked_issue: true
  # Evidence is enforced via the required `evidence` CI check; no PR on this repo
  # receives the comment-based evidence manifest, so the comment gate stays off.
  evidence_manifest: false
  clean_evidence: false
  secret_scan: true
forbidden:
  labels:
    - do-not-merge
    - blocked
    - rucksack-blocked
    - rucksack-human-merge
  requested_changes: true
  merge_conflicts: true
  failing_checks: true
  unknown_check_state: true
  secret_scan_failure: true
  untrusted_branch_owner: true
  fork_branches: true
  dirty_evidence: true
  missing_issue_linkage: true
production_gates:
  # main is the merge target for every queue PR, so gating on the base branch
  # would force a human command on all of them; the deploy_paths list below is
  # the production boundary instead.
  branches:
    - master
    - production
    - "release/**"
  deploy_paths:
    - ".github/**"
    - "infra/**"
    - "deploy/**"
    - "migrations/**"
    - "billing/**"
    - "auth/**"
    - "**/auth/**"
    - ".agent/deploy.yaml"
    - ".agent/merge-policy.yaml"
    - ".agent/workflow-maintenance.json"
    - "scripts/agent-evidence"
    - "scripts/publish-agent-evidence"
  require_human_opt_in: true
notes:
  safety: "Unattended merging is limited to a complete existing-workflow-only diff proven by trusted comment-only analysis or an exact reviewed pair in immutable base policy. Ordinary docs, app, lockfile and mixed changes stay held with global auto_merge.enabled false. Clean exact-head correctness review, bound checks/evidence/secret-scan, issue linkage, dependency order, fresh base and verified provider protection remain required."
  approval_boundary: "The separate trusted-base existing_workflow_maintenance opt-in does not authorize policy/manifest adoption or remove sensitive, destructive, two-principal agent-review or three-principal trust-root gates. Resolving an owner ask is not an exact-head merge approval; provider and action-time validation remain mandatory."
