# Generated by rucksack. Secret values must stay in GitHub/VM secret stores, not this file.
schema_version: 2
auto_merge:
  # Ordinary unattended merging remains off. The separate schema-2 opt-in
  # applies only when every changed file is an existing workflow with trusted
  # immutable-base maintenance proof; mixed and ordinary changes stay held.
  enabled: false
  existing_workflow_maintenance: true
  method: squash
  require_linked_issue: true
  # Evidence runs through required CI checks; schema-2 correctness review is
  # independently derived by the trusted executor at the current head.
  # These legacy comment-manifest/review booleans do not disable that verdict.
  require_evidence_manifest: false
  require_secret_scan: true
  require_independent_review: false
  require_green_checks: true
dependencies:
  require_order: true
  require_stacked_merge: true
checks:
  required:
labels:
  required:
  disallowed:
    - do-not-merge
    - blocked
    - rucksack-blocked
review:
  codex_request_comment: "@codex review"
  independent_reviewers:
    - codex-code-review
    - human-maintainer
    - rucksack-erniesg
risk:
  low_risk_paths:
    - "docs/**"
    - "tests/**"
    - "*.md"
    - "README.md"
  app_code_paths:
    - "src/**"
    - "rucksack/**"
    - "app/**"
    - "apps/**"
  human_only_paths:
    - ".github/**"
    - ".agent/pr-policy.yaml"
    - ".agent/workflow-maintenance.json"
    - ".agent/policy.yaml"
    - ".agent/autopilot.yaml"
    - ".agent/deploy.yaml"
    - "scripts/agent-evidence"
    - "scripts/publish-agent-evidence"
    - "infra/**"
    - "deploy/**"
    - "migrations/**"
    - "billing/**"
    - "auth/**"
    - "**/auth/**"
    - "*secret*"
    - "**/*secret*"
    - "*credential*"
    - "**/*credential*"
    - "src/rucksack/autopilot.py"
    - "src/rucksack/ci_access.py"
    - "src/rucksack/ci_setup.py"
    - "src/rucksack/github_access.py"
    - "src/rucksack/repo_access.py"
    - "src/rucksack/scaffold.py"
    - "src/rucksack/vm_access.py"
    - "src/rucksack/vm_queue.py"
review_tiers:
  # The live floor may only strengthen these distinct trusted-principal counts.
  agent_review_min_approvals: 2
  trust_root_min_approvals: 3
human_only:
  escape_hatch_label: rucksack-human-merge
  note: "Apply this label to keep a PR human-merge-only even after checks and review pass."
security:
  merge_execution_authority: ".agent/merge-policy.yaml"
  require_match_head_commit: true
  never_bypass_branch_protection_from_vm: true
  fork_prs_may_not_read_write_tokens: true
