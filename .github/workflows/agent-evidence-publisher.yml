            assertExecutionBindings(stage);
            if (result.error) fail(`${stage}: trusted candidate runner failed to start: ${result.error.message}`);
            if (result.signal) fail(`${stage}: trusted candidate runner died from ${result.signal}`);
            // Exit 125 is reserved by evidence_candidate_runner_py for trust-boundary
            // refusal. Treat a candidate that deliberately returns it the same way: it
            // may deny its own run, but a producer can never ignore the refusal and
            // continue into trusted evidence handoff.
            if (result.status === 125) fail(`trusted candidate runner refused ${stage}`);
            return result;
          }

          function runGit(args, stage, binary = false) {
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            const result = spawnSync(candidateGit, args, {
              cwd: originalCandidateRoot,
              env: { ...commandEnvironment, GIT_OPTIONAL_LOCKS: "0" },
              ...(binary ? {} : { encoding: "utf8" }),
              maxBuffer: 64 * 1024 * 1024,
            });
            if (result.error) fail(`${stage}: git failed to start: ${result.error.message}`);
            if (result.signal || result.status !== 0) {
              fail(`${stage}: git failed with ${result.signal || `exit ${result.status}`}`);
            }
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            return result.stdout || (binary ? Buffer.alloc(0) : "");
          }

          function trackedPath(root, relative) {
            if (!Buffer.isBuffer(relative) || relative.length === 0 || relative[0] === 0x2f) {
              fail("tracked path is invalid");
            }
            const components = [];
            let offset = 0;
            while (offset <= relative.length) {
              const end = relative.indexOf(0x2f, offset);
              const limit = end < 0 ? relative.length : end;
              const component = relative.subarray(offset, limit);
              if (
                component.length === 0 ||
                (component.length === 1 && component[0] === 0x2e) ||
                (component.length === 2 && component[0] === 0x2e && component[1] === 0x2e) ||
                component.includes(0)
              ) {
                fail("tracked path contains an unsafe component");
              }
              components.push(component);
              if (end < 0) break;
              offset = end + 1;
            }
            return Buffer.concat([Buffer.from(root), Buffer.from("/"), ...components.flatMap(
              (component, index) => index === 0 ? [component] : [Buffer.from("/"), component],
            )]);
          }

          function gitPathString(target, stage) {
            const decoded = target.toString("utf8");
            if (!Buffer.from(decoded, "utf8").equals(target) || /[\u0000-\u001f\u007f]/.test(decoded)) {
              fail(`${stage}: Git path is not one safe UTF-8 path`);
            }
            return decoded;
          }

          function runGitAt(root, args, stage, binary = false) {
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            const result = spawnSync(candidateGit, ["-C", root, ...args], {
              env: { ...commandEnvironment, GIT_OPTIONAL_LOCKS: "0" },
              ...(binary ? {} : { encoding: "utf8" }),
              maxBuffer: 64 * 1024 * 1024,
            });
            if (result.error) fail(`${stage}: submodule Git failed to start: ${result.error.message}`);
            if (result.signal || result.status !== 0) {
              fail(`${stage}: submodule Git failed with ${result.signal || `exit ${result.status}`}`);
            }
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            return result.stdout || (binary ? Buffer.alloc(0) : "");
          }

          function runTrustedGit(args, stage) {
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            const trustedPath = String(commandEnvironment.RUCKSACK_CANDIDATE_TRUSTED_PATH || "");
            if (!trustedPath || trustedPath.includes("\0")) {
              fail(`${stage}: trusted Git PATH is unavailable`);
            }
            const result = spawnSync(candidateGit, args, {
              cwd: originalCandidateRoot,
              encoding: "utf8",
              env: {
                GIT_CONFIG_GLOBAL: "/dev/null",
                GIT_CONFIG_NOSYSTEM: "1",
                GIT_NO_REPLACE_OBJECTS: "1",
                GIT_OPTIONAL_LOCKS: "0",
                GIT_TERMINAL_PROMPT: "0",
                HOME: "/nonexistent",
                LANG: "C",
                LC_ALL: "C",
                PATH: trustedPath,
              },
              maxBuffer: 64 * 1024 * 1024,
            });
            if (result.error) fail(`${stage}: trusted Git failed to start: ${result.error.message}`);
            if (result.signal || result.status !== 0) {
              fail(`${stage}: trusted Git failed with ${result.signal || `exit ${result.status}`}: ${result.stderr}`);
            }
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            return result.stdout;
          }

          function directoryEntryPath(directory, name, stage) {
            if (
              !Buffer.isBuffer(name) ||
              name.length === 0 ||
              name.includes(0) ||
              name.includes(0x2f) ||
              name.equals(Buffer.from(".")) ||
              name.equals(Buffer.from(".."))
            ) {
              fail(`${stage}: submodule contains an unsafe path`);
            }
            return Buffer.concat([
              Buffer.isBuffer(directory) ? directory : Buffer.from(directory),
              Buffer.from("/"),
              name,
            ]);
          }

          function directoryTreeDigest(root, stage) {
            const hash = createHash("sha256");
            const budget = { remaining: 512 * 1024 * 1024 };
            function visit(directory, relative) {
              const names = fs.readdirSync(directory, { encoding: "buffer" }).sort(Buffer.compare);
              for (const name of names) {
                if (name.equals(Buffer.from(".git"))) continue;
                const source = directoryEntryPath(directory, name, stage);
                const childRelative = relative.length
                  ? Buffer.concat([relative, Buffer.from("/"), name])
                  : Buffer.from(name);
                const details = fs.lstatSync(source);
                hash.update(childRelative);
                hash.update(Buffer.from([0]));
                if (details.isDirectory() && !details.isSymbolicLink()) {
                  hash.update("directory\0");
                  visit(source, childRelative);
                  continue;
                }
                if (details.isSymbolicLink()) {
                  hash.update("symlink\0");
                  hash.update(fs.readlinkSync(source, { encoding: "buffer" }));
                  hash.update(Buffer.from([0]));
                  continue;
                }
                if (!details.isFile() || details.isSymbolicLink() || details.nlink !== 1) {
                  fail(`${stage}: submodule contains an unsupported or shared entry`);
                }
                if (details.size > budget.remaining) fail(`${stage}: submodule exceeds 512 MiB`);
                budget.remaining -= details.size;
                hash.update((details.mode & 0o111) !== 0 ? "file+x\0" : "file\0");
                const descriptor = fs.openSync(source, "r");
                try {
                  const chunk = Buffer.allocUnsafe(64 * 1024);
                  for (;;) {
                    const count = fs.readSync(descriptor, chunk, 0, chunk.length, null);
                    if (count === 0) break;
                    hash.update(chunk.subarray(0, count));
                  }
                } finally {
                  fs.closeSync(descriptor);
                }
                hash.update(Buffer.from([0]));
              }
            }
            visit(Buffer.from(root), Buffer.alloc(0));
            return hash.digest("hex");
          }

          function nestedGitlinkEntries(root, stage) {
            const listing = runGitAt(root, ["ls-files", "--stage", "-z"], stage, true);
            const gitlinks = [];
            let offset = 0;
            while (offset < listing.length) {
              const end = listing.indexOf(0, offset);
              if (end < 0) fail(`${stage}: nested tracked-file listing is not NUL terminated`);
              const record = listing.subarray(offset, end);
              const separator = record.indexOf(9);
              if (separator < 0) fail(`${stage}: nested tracked-file listing is malformed`);
              const fields = record.subarray(0, separator).toString("ascii").split(" ");
              if (fields.length !== 3 || fields[2] !== "0") {
                fail(`${stage}: nested tracked-file listing contains an unmerged entry`);
              }
              if (fields[0] === "160000") {
                const entry = {
                  mode: fields[0],
                  oid: fields[1],
                  path: Buffer.from(record.subarray(separator + 1)),
                  label: record.subarray(separator + 1).toString("hex"),
                };
                if (!/^[0-9a-f]{40}$/.test(entry.oid)) {
                  fail(`${stage}: nested tracked-file listing contains an invalid object id`);
                }
                gitlinks.push(entry);
              }
              offset = end + 1;
            }
            return gitlinks;
          }

          function captureGitlinkState(
            entry,
            stage,
            parentRoot = originalCandidateRoot,
            fullPath = entry.path,
            depth = 0,
          ) {
            if (depth > 32) fail(`${stage}: initialized gitlinks exceed 32 nested levels`);
            if (!/^[0-9a-f]{40}$/.test(entry.oid)) {
              fail(`${stage}: gitlink object id is invalid`);
            }
            const target = trackedPath(parentRoot, entry.path);
            let details;
            try {
              details = fs.lstatSync(target);
            } catch (error) {
              if (error.code === "ENOENT") {
                return {
                  initialized: false,
                  gitDir: "",
                  treeDigest: "",
                  descendants: [],
                  digest: `gitlink:${entry.oid}:absent`,
                };
              }
              fail(`${stage}: gitlink ${entry.label} is unavailable: ${error.message}`);
            }
            if (!details.isDirectory() || details.isSymbolicLink()) {
              fail(`${stage}: gitlink ${entry.label} is not a directory`);
            }
            const root = gitPathString(target, stage);
            if (!fs.existsSync(path.join(root, ".git"))) {
              const visible = fs.readdirSync(root);
              if (visible.length !== 0) {
                fail(`${stage}: uninitialized gitlink ${entry.label} contains files`);
              }
              return {
                initialized: false,
                gitDir: "",
                treeDigest: "",
                descendants: [],
                digest: `gitlink:${entry.oid}:uninitialized`,
              };
            }
            const gitDirInput = runGitAt(root, ["rev-parse", "--absolute-git-dir"], stage).trim();
            if (!gitDirInput.startsWith("/") || /[\u0000-\u001f\u007f]/.test(gitDirInput)) {
              fail(`${stage}: gitlink ${entry.label} Git directory is invalid`);
            }
            const gitDir = fs.realpathSync(gitDirInput);
            const gitDirStats = fs.lstatSync(gitDir);
            if (!gitDirStats.isDirectory() || gitDirStats.isSymbolicLink()) {
              fail(`${stage}: gitlink ${entry.label} Git directory is not one real directory`);
            }
            const head = runGitAt(root, ["rev-parse", "--verify", "HEAD^{commit}"], stage)
              .trim()
              .toLowerCase();
            if (head !== entry.oid) fail(`${stage}: gitlink ${entry.label} is at the wrong commit`);
            const changed = runGitAt(
              root,
              [
                "status",
                "--porcelain=v1",
                "--untracked-files=all",
                "--ignored=matching",
                "--ignore-submodules=none",
              ],
              stage,
            ).trim();
            if (changed) fail(`${stage}: gitlink ${entry.label} is not clean`);
            const treeDigest = directoryTreeDigest(root, stage);
            const descendants = [];
            for (const nestedEntry of nestedGitlinkEntries(root, stage)) {
              const nestedPath = Buffer.concat([fullPath, Buffer.from("/"), nestedEntry.path]);
              const nestedState = captureGitlinkState(
                nestedEntry,
                stage,
                root,
                nestedPath,
                depth + 1,
              );
              descendants.push(
                {
                  ...nestedEntry,
                  path: nestedPath,
                  label: nestedPath.toString("hex"),
                  gitlinkInitialized: nestedState.initialized,
                  gitlinkGitDir: nestedState.gitDir,
                  gitlinkTreeDigest: nestedState.treeDigest,
                  digest: nestedState.digest,
                },
                ...nestedState.descendants,
              );
            }
            if (descendants.length > 256) {
              fail(`${stage}: candidate checkout contains too many nested gitlinks`);
            }
            const descendantsDigest = createHash("sha256")
              .update(JSON.stringify(descendants.map((nested) => [
                nested.path.toString("hex"),
                nested.oid,
                nested.digest,
              ])))
              .digest("hex");
            return {
              initialized: true,
              gitDir,
              treeDigest,
              descendants,
              digest: `gitlink:${entry.oid}:initialized:${treeDigest}:nested:${descendantsDigest}`,
            };
          }

          function copyDirectoryTree(source, target, stage) {
            fs.mkdirSync(target, { recursive: true, mode: 0o700 });
            const names = fs.readdirSync(source, { encoding: "buffer" }).sort(Buffer.compare);
            for (const name of names) {
              if (name.equals(Buffer.from(".git"))) continue;
              const sourcePath = directoryEntryPath(source, name, stage);
              const targetPath = directoryEntryPath(target, name, stage);
              const details = fs.lstatSync(sourcePath);
              if (details.isDirectory() && !details.isSymbolicLink()) {
                copyDirectoryTree(sourcePath, targetPath, stage);
              } else if (details.isSymbolicLink()) {
                fs.symlinkSync(fs.readlinkSync(sourcePath, { encoding: "buffer" }), targetPath);
              } else if (details.isFile() && !details.isSymbolicLink() && details.nlink === 1) {
                fs.copyFileSync(sourcePath, targetPath, fs.constants.COPYFILE_EXCL);
                fs.chmodSync(targetPath, (details.mode & 0o111) !== 0 ? 0o700 : 0o600);
              } else {
                fail(`${stage}: submodule contains an unsupported or shared entry`);
              }
            }
          }

          function trackedDigest(entry, stage, root = originalCandidateRoot) {
            if (entry.mode === "160000") {
              if (root !== originalCandidateRoot) fail(`${stage}: gitlink digest requires the original checkout`);
              return captureGitlinkState(entry, stage).digest;
            }
            const target = trackedPath(root, entry.path);
            let stats;
            try {
              stats = fs.lstatSync(target);
            } catch (error) {
              fail(`${stage}: tracked path ${entry.label} is unavailable: ${error.message}`);
            }
            const hash = createHash("sha256");
            if (entry.mode === "120000") {
              if (!stats.isSymbolicLink()) fail(`${stage}: tracked path ${entry.label} changed type`);
              hash.update(fs.readlinkSync(target, { encoding: "buffer" }));
              return hash.digest("hex");
            }
            if (entry.mode !== "100644" && entry.mode !== "100755") {
              fail(`${stage}: tracked path ${entry.label} has unsupported mode ${entry.mode}`);
            }
            if (!stats.isFile() || stats.isSymbolicLink()) {
              fail(`${stage}: tracked path ${entry.label} changed type`);
            }
            const executable = (stats.mode & 0o111) !== 0;
            if (executable !== (entry.mode === "100755")) {
              fail(`${stage}: tracked path ${entry.label} changed executable mode`);
            }
            const descriptor = fs.openSync(target, "r");
            try {
              const chunk = Buffer.allocUnsafe(64 * 1024);
              for (;;) {
                const count = fs.readSync(descriptor, chunk, 0, chunk.length, null);
                if (count === 0) break;
                hash.update(chunk.subarray(0, count));
              }
            } finally {
              fs.closeSync(descriptor);
            }
            return hash.digest("hex");
          }

          function captureTrackedState(stage) {
            const listing = runGit(["ls-files", "--stage", "-z"], stage, true);
            const tracked = [];
            let offset = 0;
            while (offset < listing.length) {
              const end = listing.indexOf(0, offset);
              if (end < 0) fail(`${stage}: tracked-file listing is not NUL terminated`);
              const record = listing.subarray(offset, end);
              const separator = record.indexOf(9);
              if (separator < 0) fail(`${stage}: tracked-file listing is malformed`);
              const fields = record.subarray(0, separator).toString("ascii").split(" ");
              if (fields.length !== 3 || fields[2] !== "0") {
                fail(`${stage}: tracked-file listing contains an unmerged entry`);
              }
              const entry = {
                mode: fields[0],
                oid: fields[1],
                path: Buffer.from(record.subarray(separator + 1)),
                label: record.subarray(separator + 1).toString("hex"),
              };
              if (!/^[0-9a-f]{40}$/.test(entry.oid)) {
                fail(`${stage}: tracked-file listing contains an invalid object id`);
              }
              if (entry.mode === "160000") {
                const gitlink = captureGitlinkState(entry, stage);
                entry.gitlinkInitialized = gitlink.initialized;
                entry.gitlinkGitDir = gitlink.gitDir;
                entry.gitlinkTreeDigest = gitlink.treeDigest;
                entry.gitlinkDescendants = gitlink.descendants;
                entry.digest = gitlink.digest;
              } else {
                entry.digest = trackedDigest(entry, stage);
              }
              tracked.push(entry);
              offset = end + 1;
            }
            return tracked;
          }

          function initializedGitlinksFromTracked(tracked) {
            return tracked.flatMap((entry) => {
              if (entry.mode !== "160000" || !entry.gitlinkInitialized) return [];
              return [
                entry,
                ...(entry.gitlinkDescendants || []).filter(
                  (nested) => nested.mode === "160000" && nested.gitlinkInitialized,
                ),
              ];
            });
          }

          function assertTrackedState(tracked, stage) {
            for (const entry of tracked) {
              if (trackedDigest(entry, stage) !== entry.digest) {
                fail(`${stage}: tracked path ${entry.label} no longer matches the tested checkout`);
              }
            }
          }

          function workspaceParent(target) {
            const separator = target.lastIndexOf(0x2f);
            if (separator <= 0) fail("candidate workspace path has no parent");
            return target.subarray(0, separator);
          }

          function sealCandidateWritableDirectory(target, label) {
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", label);
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", label);
            const sealed = spawnSync(
              trustedSudo,
              [
                "-n",
                "--",
                candidateRunner,
                "--seal-workspace",
                target,
                String(process.getuid()),
                String(candidateUid),
                String(candidateGid),
              ],
              {
                encoding: "utf8",
                env: { HOME: "/root", LANG: "C", LC_ALL: "C", PATH: "/usr/bin:/bin" },
                maxBuffer: 1024 * 1024,
              },
            );
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", label);
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", label);
            if (sealed.error || sealed.signal || sealed.status !== 0) {
              fail(`${label} could not be sealed: ${sealed.error?.message || sealed.stderr || sealed.signal || `exit ${sealed.status}`}`);
            }
            const resolved = fs.realpathSync(target);
            const stats = fs.lstatSync(resolved);
            if (
              !stats.isDirectory() ||
              stats.isSymbolicLink() ||
              stats.uid !== process.getuid() ||
              stats.gid !== candidateGid ||
              (stats.mode & 0o7777) !== 0o1770
            ) {
              fail(`${label} has invalid ownership or mode after sealing`);
            }
            return resolved;
          }

          function prepareCandidateExecutionWorkspace(target) {
            const label = "candidate execution workspace";
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", label);
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", label);
            const prepared = spawnSync(
              trustedSudo,
              [
                "-n",
                "--",
                candidateRunner,
                "--prepare-workspace",
                target,
                String(process.getuid()),
                String(process.getgid()),
                String(candidateUid),
                String(candidateGid),
              ],
              {
                encoding: "utf8",
                env: { HOME: "/root", LANG: "C", LC_ALL: "C", PATH: "/usr/bin:/bin" },
                maxBuffer: 1024 * 1024,
              },
            );
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", label);
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", label);
            if (prepared.error || prepared.signal || prepared.status !== 0) {
              fail(`${label} could not be prepared: ${prepared.error?.message || prepared.stderr || prepared.signal || `exit ${prepared.status}`}`);
            }
            const resolved = fs.realpathSync(target);
            const stats = fs.lstatSync(resolved);
            if (
              !stats.isDirectory() ||
              stats.isSymbolicLink() ||
              stats.uid !== process.getuid() ||
              stats.gid !== candidateGid ||
              (stats.mode & 0o7777) !== 0o1770
            ) {
              fail(`${label} has invalid ownership or mode after preparation`);
            }
            return resolved;
          }

          function sealCandidateReadableTree(target, label) {
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", label);
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", label);
            const sealed = spawnSync(
              trustedSudo,
              [
                "-n",
                "--",
                candidateRunner,
                "--seal-readable-tree",
                target,
                String(process.getuid()),
                String(candidateGid),
              ],
              {
                encoding: "utf8",
                env: { HOME: "/root", LANG: "C", LC_ALL: "C", PATH: "/usr/bin:/bin" },
                maxBuffer: 1024 * 1024,
              },
            );
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", label);
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", label);
            if (sealed.error || sealed.signal || sealed.status !== 0) {
              fail(`${label} could not be sealed: ${sealed.error?.message || sealed.stderr || sealed.signal || `exit ${sealed.status}`}`);
            }
            const resolved = fs.realpathSync(target);
            const stats = fs.lstatSync(resolved);
            if (
              !stats.isDirectory() ||
              stats.isSymbolicLink() ||
              stats.uid !== process.getuid() ||
              stats.gid !== candidateGid ||
              (stats.mode & 0o7777) !== 0o550
            ) {
              fail(`${label} has invalid ownership or mode after sealing`);
            }
            assertCandidateCannotWriteTree(resolved, label);
            return resolved;
          }

          function anchorCandidateControlDirectory(target, label) {
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", label);
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", label);
            const anchored = spawnSync(
              trustedSudo,
              [
                "-n",
                "--",
                candidateRunner,
                "--anchor-control-directory",
                target,
                String(process.getuid()),
                String(candidateUid),
                String(candidateGid),
              ],
              {
                encoding: "utf8",
                env: { HOME: "/root", LANG: "C", LC_ALL: "C", PATH: "/usr/bin:/bin" },
                maxBuffer: 1024 * 1024,
              },
            );
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", label);
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", label);
            if (anchored.error || anchored.signal || anchored.status !== 0) {
              fail(`${label} could not be anchored: ${anchored.error?.message || anchored.stderr || anchored.signal || `exit ${anchored.status}`}`);
            }
            const resolved = fs.realpathSync(target);
            const stats = fs.lstatSync(resolved);
            if (
              !stats.isDirectory() ||
              stats.isSymbolicLink() ||
              stats.uid !== process.getuid() ||
              stats.gid !== candidateGid ||
              (stats.mode & 0o7777) !== 0o1770
            ) {
              fail(`${label} has invalid ownership or mode after anchoring`);
            }
            return resolved;
          }

          function sealCandidateControlFile(target, label) {
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", label);
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", label);
            const sealed = spawnSync(
              trustedSudo,
              [
                "-n",
                "--",
                candidateRunner,
                "--seal-control-file",
                target,
                String(process.getuid()),
                String(candidateGid),
              ],
              {
                encoding: "utf8",
                env: { HOME: "/root", LANG: "C", LC_ALL: "C", PATH: "/usr/bin:/bin" },
                maxBuffer: 1024 * 1024,
              },
            );
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", label);
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", label);
            if (sealed.error || sealed.signal || sealed.status !== 0) {
              fail(`${label} could not be sealed: ${sealed.error?.message || sealed.stderr || sealed.signal || `exit ${sealed.status}`}`);
            }
            const pinned = pinnedRegularFile(target, label);
            if (
              pinned.uid !== process.getuid() ||
              pinned.gid !== candidateGid ||
              (pinned.mode & 0o7777) !== 0o440 ||
              candidateCanWrite(pinned)
            ) {
              fail(`${label} has invalid ownership or mode after sealing`);
            }
            return pinned;
          }

          function createSealedExecutionWorkspace(tracked) {
            const executionRoot = path.join(candidateDependencyRoot, "source");
            if (fs.existsSync(executionRoot)) fail("candidate execution workspace already exists");
            fs.mkdirSync(executionRoot, { mode: 0o700 });
            for (const entry of tracked) {
              const source = trackedPath(originalCandidateRoot, entry.path);
              const target = trackedPath(executionRoot, entry.path);
              fs.mkdirSync(workspaceParent(target), { recursive: true, mode: 0o700 });
              if (entry.mode === "160000") {
                fs.mkdirSync(target, { mode: 0o700 });
                if (entry.gitlinkInitialized) {
                  copyDirectoryTree(
                    gitPathString(source, "copy checked-out gitlink"),
                    gitPathString(target, "copy checked-out gitlink"),
                    "copy checked-out gitlink",
                  );
                  const copiedDigest = directoryTreeDigest(
                    gitPathString(target, "verify copied gitlink"),
                    "verify copied gitlink",
                  );
                  if (copiedDigest !== entry.gitlinkTreeDigest) {
                    fail("copied gitlink no longer matches the exact checked-out commit");
                  }
                }
                if (trackedDigest(entry, "after copying gitlink") !== entry.digest) {
                  fail("gitlink source changed while creating the candidate workspace");
                }
                continue;
              }
              if (entry.mode === "120000") {
                fs.symlinkSync(fs.readlinkSync(source, { encoding: "buffer" }), target);
                continue;
              }
              fs.copyFileSync(source, target, fs.constants.COPYFILE_EXCL);
              fs.chmodSync(target, entry.mode === "100755" ? 0o700 : 0o600);
            }
            const initializedGitlinks = initializedGitlinksFromTracked(tracked);
            if (initializedGitlinks.length > 256) {
              fail("candidate execution workspace contains too many initialized gitlinks");
            }
            if (initializedGitlinks.length !== 0) {
              const bindingsRoot = path.join(candidateDependencyRoot, "git-bindings");
              if (fs.existsSync(bindingsRoot)) fail("candidate gitlink bindings already exist");
              fs.mkdirSync(bindingsRoot, { mode: 0o700 });
              for (const entry of initializedGitlinks) {
                const identifier = createHash("sha256").update(entry.path).digest("hex");
                const repository = path.join(bindingsRoot, identifier);
                const gitlinkRoot = gitPathString(
                  trackedPath(executionRoot, entry.path),
                  "create copied gitlink binding",
                );
                runTrustedGit(["init", "--bare", repository], "initialize candidate gitlink binding");
                runTrustedGit(
                  [
                    "--git-dir",
                    repository,
                    "-c",
                    "protocol.file.allow=always",
                    "fetch",
                    "--depth=1",
                    "--no-tags",
                    entry.gitlinkGitDir,
                    entry.oid,
                  ],
                  "fetch exact candidate gitlink commit",
                );
                runTrustedGit(
                  ["--git-dir", repository, "update-ref", "refs/heads/rucksack-exact", entry.oid],
                  "bind exact candidate gitlink commit",
                );
                runTrustedGit(
                  ["--git-dir", repository, "symbolic-ref", "HEAD", "refs/heads/rucksack-exact"],
                  "bind candidate gitlink HEAD",
                );
                runTrustedGit(
                  ["--git-dir", repository, "config", "core.bare", "false"],
                  "configure candidate gitlink worktree",
                );
                runTrustedGit(
                  ["--git-dir", repository, "config", "core.worktree", gitlinkRoot],
                  "configure candidate gitlink worktree",
                );
                const boundHead = runTrustedGit(
                  ["--git-dir", repository, "rev-parse", "--verify", "HEAD^{commit}"],
                  "verify exact candidate gitlink commit",
                ).trim().toLowerCase();
                if (boundHead !== entry.oid) {
                  fail("candidate gitlink binding does not resolve the exact checked-out commit");
                }
                entry.gitlinkRepositoryPath = repository;
              }
              const sealedBindingsRoot = sealCandidateReadableTree(
                bindingsRoot,
                "candidate gitlink repositories",
              );
              for (const entry of initializedGitlinks) {
                const repository = fs.realpathSync(entry.gitlinkRepositoryPath);
                if (
                  repository === sealedBindingsRoot ||
                  !repository.startsWith(`${sealedBindingsRoot}${path.sep}`)
                ) {
                  fail("candidate gitlink repository escaped its sealed root");
                }
                entry.gitlinkRepositoryPath = repository;
                entry.gitlinkRepositoryDigest = directoryTreeDigest(
                  repository,
                  "capture sealed candidate gitlink repository",
                );
              }
            }
            const prepared = prepareCandidateExecutionWorkspace(executionRoot);
            for (const entry of initializedGitlinks) {
              const gitlinkRoot = gitPathString(trackedPath(prepared, entry.path), "bind copied gitlink");
              const anchored = [];
              let candidateDirectory = gitlinkRoot;
              while (candidateDirectory !== prepared) {
                if (!candidateDirectory.startsWith(`${prepared}${path.sep}`)) {
                  fail("candidate gitlink path escaped the execution workspace");
                }
                anchored.push(candidateDirectory);
                candidateDirectory = path.dirname(candidateDirectory);
              }
              anchored.reverse();
              entry.gitlinkAnchoredDirectories = anchored.map((directory) =>
                anchorCandidateControlDirectory(directory, "candidate gitlink control directory"),
              );
              const binding = path.join(gitlinkRoot, ".git");
              fs.writeFileSync(binding, `gitdir: ${entry.gitlinkRepositoryPath}\n`, {
                encoding: "utf8",
                flag: "wx",
                mode: 0o400,
              });
              entry.gitlinkBindingPath = binding;
              entry.gitlinkBinding = sealCandidateControlFile(binding, "candidate gitlink binding");
              const boundHead = spawnSync(
                candidateGit,
                [
                  "-c",
                  `safe.directory=${gitlinkRoot}`,
                  "-C",
                  gitlinkRoot,
                  "rev-parse",
                  "--verify",
                  "HEAD^{commit}",
                ],
                {
                  encoding: "utf8",
                  env: {
                    ...commandEnvironment,
                    GIT_CONFIG_COUNT: "1",
                    GIT_CONFIG_KEY_0: "safe.directory",
                    GIT_CONFIG_VALUE_0: gitlinkRoot,
                    GIT_OPTIONAL_LOCKS: "0",
                  },
                  maxBuffer: 1024 * 1024,
                },
              );
              if (
                boundHead.error ||
                boundHead.signal ||
                boundHead.status !== 0 ||
                boundHead.stdout.trim().toLowerCase() !== entry.oid
              ) {
                fail("candidate gitlink binding does not resolve the exact checked-out commit");
              }
            }
            return prepared;
          }

          function assertExecutionBindings(stage) {
            if (!immutableTrackedState) return;
            for (const entry of initializedGitlinksFromTracked(immutableTrackedState)) {
              if (!entry.gitlinkBindingPath || !entry.gitlinkBinding) {
                fail(`${stage}: candidate gitlink binding is missing`);
              }
              assertPinnedRegularFile(
                entry.gitlinkBindingPath,
                entry.gitlinkBinding,
                "candidate gitlink binding",
                stage,
              );
              for (const directory of entry.gitlinkAnchoredDirectories || []) {
                const stats = fs.lstatSync(directory);
                if (
                  !stats.isDirectory() ||
                  stats.isSymbolicLink() ||
                  stats.uid !== process.getuid() ||
                  stats.gid !== candidateGid ||
                  (stats.mode & 0o7777) !== 0o1770
                ) {
                  fail(`${stage}: candidate gitlink control directory changed`);
                }
              }
              if (
                !entry.gitlinkRepositoryPath ||
                !entry.gitlinkRepositoryDigest ||
                directoryTreeDigest(entry.gitlinkRepositoryPath, stage) !==
                  entry.gitlinkRepositoryDigest
              ) {
                fail(`${stage}: candidate gitlink repository changed`);
              }
              assertCandidateCannotWriteTree(entry.gitlinkRepositoryPath, stage);
            }
          }

          function assertInitialExecutionWorkspace(root, tracked, stage) {
            const expectedOwner = process.getuid();
            const expectedGroup = process.getgid();
            const rootBytes = Buffer.from(root);
            const directories = new Map([[rootBytes.toString("hex"), rootBytes]]);
            const anchoredDirectories = new Set(
              initializedGitlinksFromTracked(tracked).flatMap((entry) =>
                (entry.gitlinkAnchoredDirectories || []).map((directory) =>
                  Buffer.from(directory).toString("hex"),
                ),
              ),
            );
            for (const entry of tracked) {
              const target = trackedPath(root, entry.path);
              let parent = workspaceParent(target);
              while (parent.length >= Buffer.byteLength(root)) {
                directories.set(parent.toString("hex"), Buffer.from(parent));
                if (parent.length === Buffer.byteLength(root)) break;
                parent = workspaceParent(parent);
              }
              const stats = fs.lstatSync(target);
              const anchored = anchoredDirectories.has(target.toString("hex"));
              if (stats.gid !== (anchored ? candidateGid : expectedGroup)) {
                fail(`${stage}: sealed tracked path ownership changed`);
              }
              if (entry.mode === "160000") {
                if (!stats.isDirectory() || stats.isSymbolicLink()) {
                  fail(`${stage}: sealed gitlink changed type`);
                }
                if (
                  entry.gitlinkInitialized &&
                  (!anchored ||
                    stats.uid !== expectedOwner ||
                    (stats.mode & 0o7777) !== 0o1770)
                ) {
                  fail(`${stage}: sealed gitlink control directory changed`);
                }
                const targetString = gitPathString(target, stage);
                if (entry.gitlinkInitialized) {
                  if (directoryTreeDigest(targetString, stage) !== entry.gitlinkTreeDigest) {
                    fail(`${stage}: sealed gitlink content changed`);
                  }
                } else if (fs.readdirSync(targetString).length !== 0) {
                  fail(`${stage}: uninitialized sealed gitlink contains files`);
                }
              } else if (entry.mode === "120000") {
                if (
                  !stats.isSymbolicLink() ||
                  trackedDigest(entry, stage, root) !== entry.digest
                ) {
                  fail(`${stage}: sealed tracked symlink changed`);
                }
              } else {
                const expectedMode = entry.mode === "100755" ? 0o770 : 0o660;
                if (
                  !stats.isFile() ||
                  stats.isSymbolicLink() ||
                  stats.nlink !== 1 ||
                  (stats.mode & 0o7777) !== expectedMode ||
                  trackedDigest(entry, stage, root) !== entry.digest
                ) {
                  fail(`${stage}: sealed tracked file changed`);
                }
              }
            }
            for (const directory of directories.values()) {
              const stats = fs.lstatSync(directory);
              const isRoot = directory.equals(rootBytes);
              const anchored = anchoredDirectories.has(directory.toString("hex"));
              if (
                !stats.isDirectory() ||
                stats.isSymbolicLink() ||
                ((isRoot || anchored) && stats.uid !== expectedOwner) ||
                stats.gid !== (isRoot || anchored ? candidateGid : expectedGroup) ||
                (stats.mode & 0o7777) !== (isRoot || anchored ? 0o1770 : 0o770)
              ) {
                fail(`${stage}: sealed workspace directory changed`);
              }
            }
          }

          let immutableTrackedState;
          function assertCandidateState(stage) {
            const actualHead = runGit(["rev-parse", "--verify", "HEAD^{commit}"], stage).trim().toLowerCase();
            if (actualHead !== expectedHead) {
              fail(`${stage}: candidate HEAD no longer equals the immutable event head`);
            }
            const changed = runGit([
              "status", "--porcelain=v1", "--untracked-files=all", "--ignore-submodules=none", "--", ".",
              ":(exclude).agent/evidence", ":(exclude).agent/evidence/**",
            ], stage).trim();
            if (changed) fail(`${stage}: candidate checkout is no longer clean`);
            if (immutableTrackedState) assertTrackedState(immutableTrackedState, stage);
          }

          assertCandidateState("before dependency installation");
          assertCandidateCannotWriteTree(trustedProducerRoot, "trusted producer source");
          immutableTrackedState = captureTrackedState("before dependency installation");
          assertCandidateCannotWriteTree("..", "before dependency installation");
          assertCandidateCannotWriteTree(".", "before dependency installation");
          const candidateGitDir = runGit(
            ["rev-parse", "--absolute-git-dir"],
            "resolve candidate git directory",
          ).trim();
          if (!candidateGitDir.startsWith("/") || /[\u0000-\u001f\u007f]/.test(candidateGitDir)) {
            fail("candidate git directory is not one safe absolute path");
          }
          const executionRoot = createSealedExecutionWorkspace(immutableTrackedState);
          commandEnvironment.RUCKSACK_CANDIDATE_GIT_SAFE_DIRECTORIES = JSON.stringify(
            initializedGitlinksFromTracked(immutableTrackedState).map((entry) =>
              gitPathString(
                trackedPath(executionRoot, entry.path),
                "bind candidate Git safe directory",
              ),
            ),
          );
          candidateGitLink = path.join(executionRoot, ".git");
          fs.writeFileSync(candidateGitLink, `gitdir: ${candidateGitDir}\n`, {
            encoding: "utf8",
            flag: "wx",
            mode: 0o400,
          });
          pinnedCandidateGitLink = sealCandidateControlFile(candidateGitLink, "candidate Git link");
          process.chdir(executionRoot);
          if (!fs.existsSync(".agent")) {
            fs.mkdirSync(".agent", { mode: 0o700 });
            sealCandidateWritableDirectory(".agent", "candidate evidence parent directory");
          }
          assertInitialExecutionWorkspace(
            executionRoot,
            immutableTrackedState,
            "before dependency installation",
          );

          const installed = candidateSpawnSync(
            "/bin/bash",
            ["--noprofile", "--norc", "-e", "-o", "pipefail", "-c", installSource],
            { stdio: "inherit" },
            "dependency installation",
          );
          if (installed.error) fail(`dependency installation failed to start: ${installed.error.message}`);
          if (installed.signal || installed.status !== 0) {
            fail(`dependency installation failed with ${installed.signal || `exit ${installed.status}`}`);
          }
          assertCandidateState("after dependency installation");

          for (const candidate of [".agent", ".agent/evidence"]) {
            try {
              if (fs.lstatSync(candidate).isSymbolicLink()) fail(`${candidate} must not be a symlink`);
            } catch (error) {
              if (error.code !== "ENOENT") fail(`cannot inspect ${candidate}: ${error.message}`);
            }
          }
          fs.rmSync(".agent/evidence", { recursive: true, force: true });
          fs.mkdirSync(".agent/evidence", { recursive: true, mode: 0o700 });
          sealCandidateWritableDirectory(".agent/evidence", "candidate evidence directory");

          function isolatedProducerMain() {
            const fs = require("node:fs");
            const { createRequire } = require("node:module");
            const path = require("node:path");

            function refuse(message) {
              console.error(`isolated evidence producer refused: ${message}`);
              process.exit(125);
            }

            const trustedProducerPath = String(process.argv[1] || "");
            if (!trustedProducerPath.startsWith("/")) {
              refuse("trusted producer path must be absolute");
            }
            let source;
            try {
              source = fs.readFileSync(trustedProducerPath, "utf8").replace(/\n$/, "");
            } catch (error) {
              refuse(`trusted producer is unreadable: ${error.message}`);
            }
            const opener = "<<'NODE'\n";
            const openerIndex = source.indexOf(opener);
            const terminator = "\nNODE";
            if (openerIndex < 0 || !source.endsWith(terminator)) {
              refuse("producer must contain one terminal NODE heredoc");
            }
            const producerBody = source.slice(
              openerIndex + opener.length,
              source.length - terminator.length,
            );
            process.env.RUCKSACK_PRODUCER_NODE = process.execPath;
            process.argv = [process.execPath, "-"];
            try {
              const trustedProducerRoot = path.dirname(path.dirname(trustedProducerPath));
              const execute = new Function(
                "require",
                "process",
                "__filename",
                "__dirname",
                producerBody,
              );
              execute(
                createRequire(path.join(trustedProducerRoot, "rucksack-trusted-producer.cjs")),
                process,
                trustedProducerPath,
                trustedProducerRoot,
              );
            } catch (error) {
              refuse(`producer failed: ${error && error.stack ? error.stack : error}`);
            }
          }

          const isolatedProducerSource = `(${isolatedProducerMain.toString()})()`;
          const produced = candidateSpawnSync(
            producerNode,
            ["-e", isolatedProducerSource, trustedProducerPath],
            { stdio: "inherit", timeout: 900000 },
            "trusted evidence producer",
          );
          if (!Number.isInteger(produced.status) || produced.status < 0 || produced.status > 255) {
            fail("trusted evidence producer returned an invalid exit status");
          }
          const producerStatus = produced.status;
          assertCandidateState("after producer execution");

          function copyTrustedEvidence(source, target, budget = { remaining: 64 * 1024 * 1024 }) {
            const sourceStats = fs.lstatSync(source);
            if (sourceStats.isSymbolicLink()) fail("revalidation evidence must not contain symlinks");
            if (sourceStats.isDirectory()) {
              if (source !== ".agent/evidence") fs.mkdirSync(target, { mode: 0o700 });
              for (const leaf of fs.readdirSync(source)) {
                copyTrustedEvidence(`${source}/${leaf}`, `${target}/${leaf}`, budget);
              }
              return;
            }
            if (!sourceStats.isFile() || sourceStats.nlink !== 1) {
              fail("revalidation evidence must contain only unshared regular files");
            }
            if (sourceStats.size > budget.remaining) fail("revalidation evidence exceeds 64 MiB");
            budget.remaining -= sourceStats.size;
            fs.copyFileSync(source, target, fs.constants.COPYFILE_EXCL);
            fs.chmodSync(target, 0o600);
          }

          const evidenceRootStats = fs.lstatSync(trustedEvidenceRoot);
          if (
            !evidenceRootStats.isDirectory() ||
            evidenceRootStats.isSymbolicLink() ||
            evidenceRootStats.uid !== process.getuid() ||
            (evidenceRootStats.mode & 0o077) !== 0 ||
            fs.readdirSync(trustedEvidenceRoot).length !== 0
          ) {
            fail("trusted evidence root must be one empty owner-only directory");
          }
          const candidateRoot = fs.realpathSync(".");
          const evidenceRoot = fs.realpathSync(trustedEvidenceRoot);
          if (evidenceRoot === candidateRoot || evidenceRoot.startsWith(`${candidateRoot}/`)) {
            fail("trusted evidence root must stay outside the candidate checkout");
          }
          copyTrustedEvidence(".agent/evidence", trustedEvidenceRoot);
          process.exit(producerStatus);
          RUCKSACK_TRUSTED_LAUNCHER
          status=$?
          set -e
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload untrusted revalidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evidence-revalidation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rucksack-agent-evidence-trusted-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn

  validate:
    needs: revalidate
    if: >-
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    # Keep fixed validation off the candidate execution pool. Self-hosted-only
    # repositories must use the dedicated, ephemeral publisher runner pool.
    runs-on: ${{ fromJSON(vars.RUCKSACK_PUBLISHER_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Set up trusted validator runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download untrusted revalidation evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: agent-evidence-revalidation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rucksack-agent-evidence-input/.agent/evidence

      - name: Validate revalidation manifest
        id: evidence
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          GITHUB_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUCKSACK_EXPECTED_REPOSITORY: ${{ github.repository }}
          RUCKSACK_EXPECTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVIDENCE_STATUS: ${{ needs.revalidate.outputs.status || '1' }}
          RUCKSACK_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          status="$EVIDENCE_STATUS"
          input_root="$RUNNER_TEMP/rucksack-agent-evidence-input"
          mkdir -p -- "$input_root/.agent/evidence"
          manifest="$RUNNER_TEMP/rucksack-agent-evidence-manifest.json"
          candidate_list="$RUNNER_TEMP/rucksack-agent-evidence-candidates.bin"
          rm -f -- "$manifest" "$candidate_list"
          cd -- "$input_root"
          manifests=()
          if ! find .agent/evidence -name manifest.json -type f -print0 > "$candidate_list"; then
            status=1
          else
            while IFS= read -r -d '' candidate; do
              manifests+=("$candidate")
            done < "$candidate_list"
          fi
          rm -f -- "$candidate_list"
          validator_node="$(command -v node)"
          validator_node="$(realpath -e -- "$validator_node")"

          if [ "$RUCKSACK_DOWNLOAD_OUTCOME" != "success" ]; then
            echo "Evidence artifact download did not succeed." >&2
            status=1
          elif [ -L .agent/evidence ] || [ "${#manifests[@]}" -ne 1 ]; then
            echo "Expected exactly one regular evidence manifest; found ${#manifests[@]}." >&2
            status=1
          else
            candidate="${manifests[0]}"
            if [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
              status=1
            elif ! EXPECTED_HEAD_SHA="$GITHUB_HEAD_SHA" EXPECTED_REPOSITORY="$RUCKSACK_EXPECTED_REPOSITORY" EXPECTED_BRANCH="$RUCKSACK_EXPECTED_BRANCH" EVIDENCE_STATUS="$status" CANONICAL_MANIFEST="$manifest" "$validator_node" - "$candidate" <<'RUCKSACK_VALIDATE_MANIFEST'
          const fs = require("node:fs");
          const path = require("node:path");

          const manifestPath = process.argv[2];
          const expectedHead = String(process.env.EXPECTED_HEAD_SHA || "").trim().toLowerCase();
          const expectedRepository = String(process.env.EXPECTED_REPOSITORY || "").trim();
          const expectedBranch = String(process.env.EXPECTED_BRANCH || "").trim();
          const evidenceStatus = Number(process.env.EVIDENCE_STATUS);
          const canonicalPath = String(process.env.CANONICAL_MANIFEST || "");
          const controlCharacters = /[\u0000-\u001f\u007f\u2028\u2029]/;
          const rfc3339Timestamp = /^([1-9][0-9]{3})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\.[0-9]{1,3})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$/;
          const laneIdPattern = /^[a-z][a-z0-9]*(?:-[a-z0-9]+)*$/;
          // The documented exit taxonomy, rendered from rucksack.evidence_taxonomy so the
          // validator cannot drift from the script that produces the manifest.
          const blockedClassExitCodes = {"blocked-auth": 3, "blocked-decision": 4, "blocked-environment": 2};

          function fail(message) {
            console.error(`evidence manifest rejected: ${message}`);
            process.exit(1);
          }

          function isRecord(value) {
            return value !== null && typeof value === "object" && !Array.isArray(value);
          }

          function rejectControlCharacters(value, location) {
            if (typeof value === "string") {
              if (controlCharacters.test(value)) fail(`${location} contains a control character`);
              if (value.length > 8192) fail(`${location} is too long`);
              return;
            }
            if (Array.isArray(value)) {
              if (value.length > 200) fail(`${location} has too many items`);
              value.forEach((item, index) => rejectControlCharacters(item, `${location}[${index}]`));
              return;
            }
            if (isRecord(value)) {
              for (const [key, item] of Object.entries(value)) {
                rejectControlCharacters(key, `${location} key`);
                rejectControlCharacters(item, `${location}.${key}`);
              }
            }
          }

          function exactKeys(value, required, optional, location) {
            if (!isRecord(value)) fail(`${location} must be an object`);
            const allowed = new Set([...required, ...optional]);
            for (const key of required) {
              if (!Object.hasOwn(value, key)) fail(`${location}.${key} is required`);
            }
            for (const key of Object.keys(value)) {
              if (!allowed.has(key)) fail(`${location}.${key} is not allowed`);
            }
          }

          function stringValue(value, location, { allowEmpty = false } = {}) {
            if (typeof value !== "string") fail(`${location} must be a string`);
            if (!allowEmpty && !value) fail(`${location} must not be empty`);
            return value;
          }

          function nonNegativeInteger(value, location) {
            if (!Number.isInteger(value) || value < 0) fail(`${location} must be a non-negative integer`);
          }

          function nonNegativeSafeInteger(value, location) {
            if (!Number.isSafeInteger(value) || value < 0) fail(`${location} must be a non-negative safe integer`);
          }

          function timestampValue(value, location) {
            const candidate = stringValue(value, location);
            const match = candidate.match(rfc3339Timestamp);
            if (!match) fail(`${location} must match the RFC3339 timestamp subset`);
            const [year, month, day] = match.slice(1, 4).map(Number);
            const calendar = new Date(Date.UTC(year, month - 1, day));
            if (
              calendar.getUTCFullYear() !== year ||
              calendar.getUTCMonth() !== month - 1 ||
              calendar.getUTCDate() !== day
            ) {
              fail(`${location} must match the RFC3339 timestamp subset`);
            }
            return candidate;
          }

          function stringArray(value, location) {
            if (!Array.isArray(value)) fail(`${location} must be an array`);
            value.forEach((item, index) => stringValue(item, `${location}[${index}]`));
            if (new Set(value).size !== value.length) fail(`${location} must not contain duplicates`);
            return value;
          }

          function relativePath(value, location) {
            const candidate = stringValue(value, location);
            if (path.isAbsolute(candidate) || candidate.split(/[\\/]/).includes("..")) {
              fail(`${location} must stay inside the repository`);
            }
            return candidate;
          }

          if (!manifestPath) fail("manifest path is required");
          if (!canonicalPath || controlCharacters.test(canonicalPath)) fail("canonical manifest path is invalid");
          if (!/^[0-9a-f]{40}$/.test(expectedHead)) fail("expected event head must be a full commit SHA");
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(expectedRepository)) {
            fail("expected event repository must be OWNER/REPO");
          }
          if (!expectedBranch || expectedBranch.length > 255 || controlCharacters.test(expectedBranch)) {
            fail("expected event branch is invalid");
          }
          if (!Number.isInteger(evidenceStatus) || evidenceStatus < 0 || evidenceStatus > 255) {
            fail("evidence status must be an exit code");
          }

          let stats;
          try {
            stats = fs.lstatSync(manifestPath);
          } catch (error) {
            fail(`manifest is not readable: ${error.message}`);
          }
          if (!stats.isFile() || stats.isSymbolicLink()) fail("manifest must be one regular file");
          if (stats.size > 1024 * 1024) fail("manifest exceeds 1 MiB");

          let manifest;
          try {
            manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          } catch (error) {
            fail(`manifest is not valid JSON: ${error.message}`);
          }
          rejectControlCharacters(manifest, "manifest");
          exactKeys(
            manifest,
            [
              "schema_version", "run_id", "repo", "branch", "commit", "dirty",
              "started_at", "ended_at", "duration_ms", "agent_version", "invocation",
              "lanes_run", "runner", "lanes", "artifacts", "result", "required_failures",
            ],
            ["blocked_reason", "blocked_class", "caveats", "association_audit"],
            "manifest",
          );
          if (
            Object.hasOwn(manifest, "association_audit") &&
            manifest.association_audit !== null &&
            !isRecord(manifest.association_audit)
          ) {
            fail("manifest.association_audit must be an object or null");
          }

          if (manifest.schema_version !== "1") fail("manifest.schema_version must be 1");
          stringValue(manifest.run_id, "manifest.run_id");
          if (stringValue(manifest.repo, "manifest.repo") !== expectedRepository) {
            fail("manifest.repo must equal the immutable event repository");
          }
          if (stringValue(manifest.branch, "manifest.branch") !== expectedBranch) {
            fail("manifest.branch must equal the immutable event branch");
          }
          const commit = stringValue(manifest.commit, "manifest.commit").toLowerCase();
          if (!/^[0-9a-f]{40}$/.test(commit) || commit !== expectedHead) {
            fail("manifest.commit must equal the immutable event head");
          }
          if (typeof manifest.dirty !== "boolean") fail("manifest.dirty must be a boolean");
          for (const field of ["started_at", "ended_at"]) {
            timestampValue(manifest[field], `manifest.${field}`);
          }
          nonNegativeInteger(manifest.duration_ms, "manifest.duration_ms");
          if (!/^[0-9a-f]{64}$/i.test(stringValue(manifest.agent_version, "manifest.agent_version"))) {
            fail("manifest.agent_version must be a SHA-256 digest");
          }

          exactKeys(
            manifest.invocation,
            ["argv", "npm_config_e2e", "npm_config_only"],
            [],
            "manifest.invocation",
          );
          stringArray(manifest.invocation.argv, "manifest.invocation.argv");
          stringValue(manifest.invocation.npm_config_e2e, "manifest.invocation.npm_config_e2e", { allowEmpty: true });
          stringValue(manifest.invocation.npm_config_only, "manifest.invocation.npm_config_only", { allowEmpty: true });

          exactKeys(manifest.runner, ["provider", "os", "node"], [], "manifest.runner");
          stringValue(manifest.runner.provider, "manifest.runner.provider");
          stringValue(manifest.runner.os, "manifest.runner.os");
          stringValue(manifest.runner.node, "manifest.runner.node");

          const laneIds = [];
          if (!Array.isArray(manifest.lanes)) fail("manifest.lanes must be an array");
          manifest.lanes.forEach((lane, index) => {
            const location = `manifest.lanes[${index}]`;
            exactKeys(
              lane,
              ["id", "command", "required", "status", "exit_code", "duration_ms", "log_path"],
              [],
              location,
            );
            const laneId = stringValue(lane.id, `${location}.id`);
            if (laneId.length > 64 || !laneIdPattern.test(laneId)) {
              fail(`${location}.id must be one bounded kebab-case validation lane`);
            }
            laneIds.push(laneId);
            stringValue(lane.command, `${location}.command`);
            if (typeof lane.required !== "boolean") fail(`${location}.required must be a boolean`);
            if (!new Set(["passed", "failed"]).has(lane.status)) fail(`${location}.status is invalid`);
            nonNegativeInteger(lane.exit_code, `${location}.exit_code`);
            nonNegativeInteger(lane.duration_ms, `${location}.duration_ms`);
            relativePath(lane.log_path, `${location}.log_path`);
            if ((lane.status === "passed") !== (lane.exit_code === 0)) {
              fail(`${location}.status does not match its exit code`);
            }
          });
          if (new Set(laneIds).size !== laneIds.length) fail("manifest lane ids must be unique");

          const lanesRun = stringArray(manifest.lanes_run, "manifest.lanes_run");
          if (JSON.stringify(lanesRun) !== JSON.stringify(laneIds)) {
            fail("manifest.lanes_run must exactly match manifest.lanes");
          }
          const requiredFailures = stringArray(manifest.required_failures, "manifest.required_failures");
          const expectedFailures = manifest.lanes
            .filter((lane) => lane.required && lane.exit_code !== 0)
            .map((lane) => lane.id);
          if (JSON.stringify(requiredFailures) !== JSON.stringify(expectedFailures)) {
            fail("manifest.required_failures does not match failed required lanes");
          }

          if (!Array.isArray(manifest.artifacts)) fail("manifest.artifacts must be an array");
          let manifestArtifacts = 0;
          manifest.artifacts.forEach((artifact, index) => {
            const location = `manifest.artifacts[${index}]`;
            exactKeys(
              artifact,
              ["kind", "path"],
              ["sha256", "size_bytes", "repo_limit_mb", "storage"],
              location,
            );
            const kind = stringValue(artifact.kind, `${location}.kind`);
            const artifactPath = relativePath(artifact.path, `${location}.path`);
            if (Object.hasOwn(artifact, "sha256")) {
              const digest = stringValue(artifact.sha256, `${location}.sha256`);
              if (!/^[0-9a-f]{64}$/i.test(digest)) fail(`${location}.sha256 must be a SHA-256 digest`);
            }
            if (Object.hasOwn(artifact, "size_bytes")) nonNegativeSafeInteger(artifact.size_bytes, `${location}.size_bytes`);
            if (
              Object.hasOwn(artifact, "repo_limit_mb") &&
              (typeof artifact.repo_limit_mb !== "number" || !Number.isFinite(artifact.repo_limit_mb) || artifact.repo_limit_mb <= 0)
            ) {
              fail(`${location}.repo_limit_mb must be a positive number`);
            }
            if (Object.hasOwn(artifact, "storage")) stringValue(artifact.storage, `${location}.storage`);
            if (kind === "manifest") {
              manifestArtifacts += 1;
              if (path.normalize(artifactPath) !== path.normalize(manifestPath)) {
                fail(`${location}.path must identify the validated manifest`);
              }
            }
          });
          if (manifestArtifacts !== 1) fail("manifest.artifacts must identify exactly one manifest");

          if (Object.hasOwn(manifest, "caveats")) stringArray(manifest.caveats, "manifest.caveats");
          if (!new Set(["passed", "failed", "blocked"]).has(manifest.result)) {
            fail("manifest.result is invalid");
          }
          if (manifest.result === "passed") {
            if (manifest.lanes.length === 0 || requiredFailures.length !== 0 || evidenceStatus !== 0) {
              fail("passed manifest is inconsistent with lanes or exit status");
            }
            if (Object.hasOwn(manifest, "blocked_reason")) fail("passed manifest must not contain blocked_reason");
            if (Object.hasOwn(manifest, "blocked_class")) fail("passed manifest must not contain blocked_class");
          } else if (manifest.result === "failed") {
            if (requiredFailures.length === 0 || evidenceStatus !== 1) {
              fail("failed manifest is inconsistent with lanes or exit status");
            }
            if (Object.hasOwn(manifest, "blocked_reason")) fail("failed manifest must not contain blocked_reason");
            if (Object.hasOwn(manifest, "blocked_class")) fail("failed manifest must not contain blocked_class");
          } else {
            stringValue(manifest.blocked_reason, "manifest.blocked_reason");
            if (!new Set([2, 3, 4]).has(evidenceStatus)) {
              fail("blocked manifest is inconsistent with lanes or exit status");
            }
            // A blocked run either never selected a lane (nothing to fail) or ran lanes
            // whose required failures were classified as a fault of the machine. Both are
            // "blocked"; a blocked manifest that ran lanes and reports no required failure
            // would be claiming a block it cannot point at.
            if (manifest.lanes.length === 0) {
              if (requiredFailures.length !== 0) fail("blocked manifest without lanes must not report required failures");
              if (Object.hasOwn(manifest, "blocked_class")) fail("blocked manifest without lanes must not classify a lane");
            } else {
              if (requiredFailures.length === 0) fail("blocked manifest with lanes must record the required failures that blocked it");
              const blockedClass = stringValue(manifest.blocked_class, "manifest.blocked_class");
              // Object.hasOwn, not a bare lookup: "__proto__" and "constructor" are not classes.
              if (!Object.hasOwn(blockedClassExitCodes, blockedClass)) fail("manifest.blocked_class is not a documented class");
              if (blockedClassExitCodes[blockedClass] !== evidenceStatus) {
                fail("manifest.blocked_class does not match the evidence exit status");
              }
            }
          }

          try {
            fs.writeFileSync(canonicalPath, `${JSON.stringify(manifest, null, 2)}\n`, { flag: "wx", mode: 0o600 });
          } catch (error) {
            fail(`canonical manifest could not be written: ${error.message}`);
          }
          console.log("validated one evidence manifest for the immutable event head");
          RUCKSACK_VALIDATE_MANIFEST
            then
              status=1
              rm -f -- "$manifest"
            fi
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload trusted validation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evidence-manifest-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}-validated-by-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rucksack-agent-evidence-manifest.json
          if-no-files-found: ignore

      - name: Fail if trusted validation failed
        if: always()
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: exit "${{ steps.evidence.outputs.status || '1' }}"

  publish:
    needs: validate
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    # Hosted by default. A self-hosted-only private repository may set
    # RUCKSACK_PUBLISHER_RUNS_ON to a dedicated, ephemeral trusted label array.
    # It must not select the candidate runner pool configured by RUCKSACK_RUNS_ON.
    runs-on: ${{ fromJSON(vars.RUCKSACK_PUBLISHER_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out fixed publisher source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate and publish exact evidence receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/publish-agent-evidence
