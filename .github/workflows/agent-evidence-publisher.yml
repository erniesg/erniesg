# Generated by rucksack.
# This fixed workflow never executes pull-request code with its write token.
name: agent-evidence-publisher

on:
  workflow_run:
    workflows: ["agent-evidence"]
    types: [completed]

concurrency:
  group: agent-evidence-publisher-${{ github.repository_id }}-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  revalidate:
    # workflow_run.path may include an @ref suffix and is not unique by itself.
    # The fixed script resolves the canonical workflow ID before artifact reads.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    # This job executes candidate dependencies without a write token, so it may
    # follow the same private-repository fallback as the candidate evidence job.
    runs-on: ${{ fromJSON(vars.RUCKSACK_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    outputs:
      status: ${{ steps.produce.outputs.status }}
    steps:
      - name: Check out fixed trusted producer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted

      # A base-repository token cannot read a separate private fork directly.
      # GitHub exposes the fork head through this base-repository PR ref; the
      # following step rejects a raced or otherwise mismatched ref.
      - name: Check out candidate through base PR ref
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head
          persist-credentials: false
          path: candidate

      - name: Bind checked-out candidate to event head
        working-directory: candidate
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_CANDIDATE_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "$EXPECTED_CANDIDATE_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Event head is not one full commit SHA." >&2
            exit 1
          fi
          actual_head="$(git rev-parse --verify HEAD^{commit})"
          if [ "$actual_head" != "$EXPECTED_CANDIDATE_HEAD" ]; then
            echo "Base PR ref does not match the immutable event head." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Run trusted producer against candidate
        id: produce
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          GITHUB_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          GITHUB_REF_NAME: ""
          RUCKSACK_EXPECTED_REPOSITORY: ${{ github.repository }}
          RUCKSACK_EXPECTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUCKSACK_TRUSTED_EVIDENCE_ROOT: ${{ runner.temp }}/rucksack-agent-evidence-trusted-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          umask 077
          trusted_producer="$GITHUB_WORKSPACE/trusted/scripts/agent-evidence"
          if [ ! -f "$trusted_producer" ] || [ -L "$trusted_producer" ]; then
            echo "Trusted evidence producer must be one regular file." >&2
            exit 1
          fi
          producer_source="$(< "$trusted_producer")"
          if [ -z "$producer_source" ]; then
            echo "Trusted evidence producer source must not be empty." >&2
            exit 1
          fi
          readonly producer_source
          producer_node="$(command -v node)"
          producer_node="$(realpath -e -- "$producer_node")"
          workspace_real="$(realpath -e -- "$GITHUB_WORKSPACE")"
          case "$producer_node" in
            "$workspace_real"|"$workspace_real"/*)
              echo "Producer runtime resolves inside the candidate workspace." >&2
              exit 1
              ;;
          esac
          readonly producer_node
          producer_git="$(command -v git)"
          producer_git="$(realpath -e -- "$producer_git")"
          case "$producer_git" in
            "$workspace_real"|"$workspace_real"/*)
              echo "Trusted git executable resolves inside the candidate workspace." >&2
              exit 1
              ;;
          esac
          readonly producer_git
          export RUCKSACK_PRODUCER_GIT="$producer_git"
          if [ "$(uname -s)" != Linux ]; then
            echo "Trusted candidate isolation currently requires Linux." >&2
            exit 1
          fi
          for trusted_tool in sudo pkill pgrep useradd userdel id install rm; do
            trusted_path="$(command -v "$trusted_tool")"
            case "$trusted_path" in
              /*) ;;
              *)
                echo "Trusted isolation tool path is not absolute: $trusted_tool" >&2
                exit 1
                ;;
            esac
            trusted_real="$(realpath -e -- "$trusted_path")"
            case "$trusted_real" in
              "$workspace_real"|"$workspace_real"/*)
                echo "Trusted isolation tool resolves inside the workspace: $trusted_tool" >&2
                exit 1
                ;;
            esac
            printf -v "RUCKSACK_TRUSTED_${trusted_tool^^}" '%s' "$trusted_path"
            export "RUCKSACK_TRUSTED_${trusted_tool^^}"
          done
          if ! "$RUCKSACK_TRUSTED_SUDO" -n -- true; then
            echo "Trusted candidate isolation requires non-interactive sudo." >&2
            exit 1
          fi
          isolation_root="$(mktemp -d "$RUNNER_TEMP/rucksack-evidence-isolation.XXXXXX")"
          chmod 0711 "$isolation_root"
          readonly isolation_root
          candidate_user="rsk${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          candidate_created=0
          cleanup_candidate_isolation() {
            set +e
            if [ "$candidate_created" -eq 1 ]; then
              for ((cleanup_attempt = 0; cleanup_attempt < 64; cleanup_attempt++)); do
                "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_PKILL" -KILL -u "$RUCKSACK_CANDIDATE_UID" >/dev/null 2>&1 || true
                "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_PGREP" -u "$RUCKSACK_CANDIDATE_UID" >/dev/null 2>&1 || break
              done
              "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_USERDEL" "$candidate_user" >/dev/null 2>&1 || true
            fi
            "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_RM"               -rf -- "$isolation_root" >/dev/null 2>&1 || true
          }
          trap cleanup_candidate_isolation EXIT
          "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_USERADD"             --system --no-create-home --home-dir "$isolation_root/home"             --shell /usr/sbin/nologin "$candidate_user"
          candidate_created=1
          RUCKSACK_CANDIDATE_UID="$("$RUCKSACK_TRUSTED_ID" -u "$candidate_user")"
          RUCKSACK_CANDIDATE_GID="$("$RUCKSACK_TRUSTED_ID" -g "$candidate_user")"
          RUCKSACK_CANDIDATE_HOME="$isolation_root/home"
          RUCKSACK_CANDIDATE_DEPENDENCY_ROOT="$isolation_root/dependencies"
          export RUCKSACK_CANDIDATE_UID RUCKSACK_CANDIDATE_GID
          export RUCKSACK_CANDIDATE_HOME RUCKSACK_CANDIDATE_DEPENDENCY_ROOT
          "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_INSTALL"             -d -o "$RUCKSACK_CANDIDATE_UID" -g "$RUCKSACK_CANDIDATE_GID" -m 0700             "$RUCKSACK_CANDIDATE_HOME" "$RUCKSACK_CANDIDATE_HOME/tmp"             "$RUCKSACK_CANDIDATE_DEPENDENCY_ROOT"
          RUCKSACK_CANDIDATE_RUNNER="$isolation_root/run-candidate"
          export RUCKSACK_CANDIDATE_RUNNER
          cat > "$RUCKSACK_CANDIDATE_RUNNER" <<'RUCKSACK_CANDIDATE_RUNNER_PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import base64
          import ctypes
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          import tempfile
          import time


          MAX_CONFIG_BYTES = 8 * 1024 * 1024
          SECRET_ENVIRONMENT_NAME = re.compile(
              r"TOKEN|SECRET|KEY|PASSWORD|COOKIE|SESSION|AUTH|WEBHOOK|CREDENTIAL",
              re.IGNORECASE,
          )


          def refuse(message: str) -> "NoReturn":
              print(f"trusted candidate runner refused: {message}", file=sys.stderr)
              raise SystemExit(125)


          def required_path(name: str) -> str:
              value = os.environ.get(name, "")
              if not value.startswith("/") or "\x00" in value:
                  refuse(f"{name} must be one absolute path")
              return value


          def required_identity(name: str) -> int:
              value = os.environ.get(name, "")
              if not value.isascii() or not value.isdecimal():
                  refuse(f"{name} must be one numeric identity")
              identity = int(value)
              if identity <= 0:
                  refuse(f"{name} must be positive")
              return identity


          def validate_argv(decoded: object) -> list[str]:
              if (
                  not isinstance(decoded, list)
                  or not decoded
                  or len(decoded) > 256
                  or any(
                      not isinstance(item, str)
                      or not item
                      or "\x00" in item
                      or len(item) > 256 * 1024
                      for item in decoded
                  )
              ):
                  refuse("command payload must contain bounded non-empty strings")
              return decoded


          def decode_argv(value: str) -> list[str]:
              if not value or len(value) > 1024 * 1024:
                  refuse("command payload must be bounded")
              try:
                  padding = "=" * (-len(value) % 4)
                  raw = base64.urlsafe_b64decode((value + padding).encode("ascii"))
                  decoded = json.loads(raw.decode("utf-8"))
              except (UnicodeError, ValueError, json.JSONDecodeError) as error:
                  refuse(f"command payload is invalid: {error}")
              return validate_argv(decoded)


          def candidate_environment(home: str, dependency_root: str) -> dict[str, str]:
              environment = dict(os.environ)
              for name in tuple(environment):
                  if (
                      name.startswith("RUCKSACK_TRUSTED_")
                      or SECRET_ENVIRONMENT_NAME.search(name)
                      or name in {
                          "GITHUB_ENV",
                          "GITHUB_OUTPUT",
                          "GITHUB_PATH",
                          "GITHUB_STEP_SUMMARY",
                          "RUCKSACK_CANDIDATE_GID",
                          "RUCKSACK_CANDIDATE_HOME",
                          "RUCKSACK_CANDIDATE_DEPENDENCY_ROOT",
                          "RUCKSACK_CANDIDATE_RUNNER",
                          "RUCKSACK_CANDIDATE_TRUSTED_PATH",
                          "RUCKSACK_CANDIDATE_UID",
                          "RUCKSACK_PRODUCER_GIT",
                          "RUCKSACK_TRUSTED_EVIDENCE_ROOT",
                      }
                  ):
                      environment.pop(name, None)
              python_user = os.path.join(home, ".local")
              dependency_source = os.path.join(dependency_root, "source")
              candidate_root = os.getcwd()
              trusted_path = os.environ.get("RUCKSACK_CANDIDATE_TRUSTED_PATH", "")
              if not trusted_path:
                  refuse("trusted candidate PATH is missing")
              environment.update(
                  {
                      "HOME": home,
                      "LOGNAME": "rucksack-evidence",
                      "NODE_PATH": os.path.join(dependency_source, "node_modules"),
                      "npm_config_cache": os.path.join(home, ".npm"),
                      "PATH": os.pathsep.join(
                          (
                              trusted_path,
                              os.path.join(python_user, "bin"),
                              os.path.join(dependency_source, "node_modules", ".bin"),
                          )
                      ),
                      "PIP_CACHE_DIR": os.path.join(home, ".cache", "pip"),
                      "PYTHONPATH": os.pathsep.join(
                          (os.path.join(candidate_root, "src"), candidate_root)
                      ),
                      "PYTHONPYCACHEPREFIX": os.path.join(home, ".cache", "pycache"),
                      "RUCKSACK_CANDIDATE_DEPENDENCY_ROOT": dependency_root,
                      "TMP": os.path.join(home, "tmp"),
                      "TEMP": os.path.join(home, "tmp"),
                      "TMPDIR": os.path.join(home, "tmp"),
                      "USER": "rucksack-evidence",
                  }
              )
              return environment


          def become_child_subreaper() -> None:
              # PR_SET_CHILD_SUBREAPER makes daemonized grandchildren return here rather
              # than to a long-lived runner PID 1, so the trusted process can reap them.
              libc = ctypes.CDLL(None, use_errno=True)
              if libc.prctl(36, 1, 0, 0, 0) != 0:
                  refuse(f"cannot become a candidate child subreaper: errno {ctypes.get_errno()}")


          def fsync_directory(path: str) -> None:
              descriptor = os.open(path, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
              try:
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)


          def trusted_runtime_path(path: str, *, candidate_uid: int, label: str) -> str:
              resolved = os.path.realpath(path)
              if not os.path.isabs(resolved) or "\x00" in resolved:
                  refuse(f"{label} must resolve to one absolute path")
              try:
                  details = os.lstat(resolved)
              except OSError as error:
                  refuse(f"cannot inspect {label}: {error}")
              if (
                  not stat.S_ISREG(details.st_mode)
                  or details.st_nlink != 1
                  or details.st_uid == candidate_uid
                  or stat.S_IMODE(details.st_mode) & 0o022
              ):
                  refuse(f"{label} must be one candidate-immutable regular file")
              return resolved


          def write_command_config(
              *, argv: list[str], environment: dict[str, str], cwd: str, uid: int, gid: int
          ) -> str:
              runner = trusted_runtime_path(
                  __file__, candidate_uid=uid, label="trusted candidate runner"
              )
              directory = os.path.dirname(runner)
              payload = json.dumps(
                  {
                      "argv": argv,
                      "cwd": cwd,
                      "environment": environment,
                      "gid": gid,
                      "uid": uid,
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              ).encode("utf-8")
              if not payload or len(payload) > MAX_CONFIG_BYTES:
                  refuse("candidate command configuration must be bounded")
              descriptor, path = tempfile.mkstemp(prefix=".candidate-command-", dir=directory)
              try:
                  os.fchmod(descriptor, 0o600)
                  with os.fdopen(descriptor, "wb", closefd=False) as config:
                      config.write(payload)
                      config.flush()
                      os.fsync(config.fileno())
              finally:
                  os.close(descriptor)
              fsync_directory(directory)
              return path


          def read_command_config(path: str) -> tuple[list[str], dict[str, str], str, int, int]:
              if os.geteuid() != 0:
                  refuse("candidate child must start with root privileges")
              runner = os.path.realpath(__file__)
              directory = os.path.dirname(runner)
              if (
                  not os.path.isabs(path)
                  or "\x00" in path
                  or os.path.dirname(path) != directory
                  or not os.path.basename(path).startswith(".candidate-command-")
              ):
                  refuse("candidate command configuration path is not trusted")
              flags = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
              try:
                  descriptor = os.open(path, flags)
              except OSError as error:
                  refuse(f"cannot open candidate command configuration: {error}")
              try:
                  details = os.fstat(descriptor)
                  runner_details = os.stat(runner)
                  if (
                      not stat.S_ISREG(details.st_mode)
                      or details.st_nlink != 1
                      or details.st_uid != runner_details.st_uid
                      or stat.S_IMODE(details.st_mode) != 0o600
                      or details.st_size <= 0
                      or details.st_size > MAX_CONFIG_BYTES
                  ):
                      refuse("candidate command configuration is not one trusted regular file")
                  os.unlink(path)
                  fsync_directory(directory)
                  payload = bytearray()
                  while len(payload) <= MAX_CONFIG_BYTES:
                      block = os.read(
                          descriptor, min(65536, MAX_CONFIG_BYTES + 1 - len(payload))
                      )
                      if not block:
                          break
                      payload.extend(block)
                  if not payload or len(payload) > MAX_CONFIG_BYTES:
                      refuse("candidate command configuration must be bounded")
              finally:
                  os.close(descriptor)
              try:
                  decoded = json.loads(payload.decode("utf-8"))
              except (UnicodeError, ValueError, json.JSONDecodeError) as error:
                  refuse(f"candidate command configuration is invalid: {error}")
              if not isinstance(decoded, dict) or set(decoded) != {
                  "argv",
                  "cwd",
                  "environment",
                  "gid",
                  "uid",
              }:
                  refuse("candidate command configuration has an invalid shape")
              argv = validate_argv(decoded["argv"])
              environment = decoded["environment"]
              cwd = decoded["cwd"]
              uid = decoded["uid"]
              gid = decoded["gid"]
              if (
                  not isinstance(environment, dict)
                  or len(environment) > 4096
                  or any(
                      not isinstance(name, str)
                      or not name
                      or len(name) > 1024
                      or "=" in name
                      or "\x00" in name
                      or not isinstance(value, str)
                      or len(value) > 1024 * 1024
                      or "\x00" in value
                      for name, value in environment.items()
                  )
              ):
                  refuse("candidate command environment is invalid")
              if not isinstance(cwd, str) or not os.path.isabs(cwd) or "\x00" in cwd:
                  refuse("candidate command working directory is invalid")
              if (
                  not isinstance(uid, int)
                  or isinstance(uid, bool)
                  or uid <= 0
                  or not isinstance(gid, int)
                  or isinstance(gid, bool)
                  or gid <= 0
                  or details.st_uid == uid
              ):
                  refuse("candidate command identity is invalid")
              return argv, environment, cwd, uid, gid


          def run_candidate_child(path: str) -> "NoReturn":
              argv, environment, cwd, uid, gid = read_command_config(path)
              try:
                  os.chdir(cwd)
                  os.setgroups([])
                  os.setresgid(gid, gid, gid)
                  os.setresuid(uid, uid, uid)
              except OSError as error:
                  refuse(f"cannot drop candidate privileges: {error}")
              libc = ctypes.CDLL(None, use_errno=True)
              if libc.prctl(38, 1, 0, 0, 0) != 0:  # PR_SET_NO_NEW_PRIVS
                  refuse(f"cannot lock candidate privileges: errno {ctypes.get_errno()}")
              if (
                  os.getuid() != uid
                  or os.geteuid() != uid
                  or os.getgid() != gid
                  or os.getegid() != gid
              ):
                  refuse("candidate identity did not take effect")
              try:
                  os.execvpe(argv[0], argv, environment)
              except OSError as error:
                  refuse(f"cannot execute candidate command: {error}")


          def reap_orphans() -> None:
              while True:
                  try:
                      pid, _ = os.waitpid(-1, os.WNOHANG)
                  except ChildProcessError:
                      return
                  if pid == 0:
                      return


          def reap_identity(*, sudo: str, pkill: str, pgrep: str, uid: int) -> None:
              for _ in range(64):
                  subprocess.run(
                      [sudo, "-n", "--", pkill, "-KILL", "-u", str(uid)],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  time.sleep(0.01)
                  reap_orphans()
                  alive = subprocess.run(
                      [sudo, "-n", "--", pgrep, "-u", str(uid)],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if alive.returncode == 1:
                      return
                  if alive.returncode not in {0, 1}:
                      refuse("cannot inspect candidate descendants")
                  time.sleep(0.01)
              refuse("candidate descendants survived forced cleanup")


          def main() -> int:
              if len(sys.argv) == 3 and sys.argv[1] == "--child":
                  run_candidate_child(sys.argv[2])
              if len(sys.argv) != 2:
                  refuse("expected one encoded command payload")
              argv = decode_argv(sys.argv[1])
              uid = required_identity("RUCKSACK_CANDIDATE_UID")
              gid = required_identity("RUCKSACK_CANDIDATE_GID")
              home = required_path("RUCKSACK_CANDIDATE_HOME")
              dependency_root = required_path("RUCKSACK_CANDIDATE_DEPENDENCY_ROOT")
              sudo = required_path("RUCKSACK_TRUSTED_SUDO")
              pkill = required_path("RUCKSACK_TRUSTED_PKILL")
              pgrep = required_path("RUCKSACK_TRUSTED_PGREP")
              environment = candidate_environment(home, dependency_root)
              become_child_subreaper()
              runner = trusted_runtime_path(
                  __file__, candidate_uid=uid, label="trusted candidate runner"
              )
              python = trusted_runtime_path(
                  sys.executable, candidate_uid=uid, label="trusted Python runtime"
              )
              config = write_command_config(
                  argv=argv,
                  environment=environment,
                  cwd=os.getcwd(),
                  uid=uid,
                  gid=gid,
              )
              isolated = [
                  sudo,
                  "-n",
                  "--",
                  python,
                  runner,
                  "--child",
                  config,
              ]
              with tempfile.TemporaryFile() as stdout, tempfile.TemporaryFile() as stderr:
                  try:
                      completed = subprocess.run(
                          isolated,
                          check=False,
                          cwd=os.getcwd(),
                          env={
                              "HOME": "/root",
                              "LANG": "C",
                              "LC_ALL": "C",
                              "PATH": "/usr/bin:/bin",
                          },
                          stdin=subprocess.DEVNULL,
                          stdout=stdout,
                          stderr=stderr,
                      )
                  finally:
                      try:
                          os.unlink(config)
                          fsync_directory(os.path.dirname(config))
                      except FileNotFoundError:
                          pass
                      reap_identity(sudo=sudo, pkill=pkill, pgrep=pgrep, uid=uid)
                  stdout.seek(0)
                  stderr.seek(0)
                  sys.stdout.buffer.write(stdout.read())
                  sys.stderr.buffer.write(stderr.read())
              if completed.returncode < 0:
                  return min(255, 128 - completed.returncode)
              return min(255, completed.returncode)


          if __name__ == "__main__":
              raise SystemExit(main())
          RUCKSACK_CANDIDATE_RUNNER_PY
          chmod 0500 "$RUCKSACK_CANDIDATE_RUNNER"
          RUCKSACK_CANDIDATE_TRUSTED_PATH="$PATH"
          export RUCKSACK_CANDIDATE_TRUSTED_PATH
          if [ -e "$RUCKSACK_TRUSTED_EVIDENCE_ROOT" ]; then
            echo "Trusted evidence root already exists." >&2
            exit 1
          fi
          mkdir -m 0700 -- "$RUCKSACK_TRUSTED_EVIDENCE_ROOT"
          cd -- "$GITHUB_WORKSPACE/candidate"
          install_source="$(cat <<'RUCKSACK_INSTALL'
          python3 -m pip install --user --upgrade pip
          dependency_source="$RUCKSACK_CANDIDATE_DEPENDENCY_ROOT/source"
          for dependency_marker in pyproject.toml package-lock.json pnpm-lock.yaml yarn.lock requirements*.txt; do
            if [ -f "$dependency_marker" ]; then
              cp -R -- . "$dependency_source"
              break
            fi
          done
          if [ -f pyproject.toml ]; then
            python3 -m pip install --user "$dependency_source[dev]" ||               python3 -m pip install --user "$dependency_source"
          fi
          for requirements_file in requirements*.txt; do
            [ -f "$requirements_file" ] || continue
            python3 -m pip install --user -r "$dependency_source/$requirements_file"
          done
          if [ -f package-lock.json ]; then
            npm ci --prefix "$dependency_source"
          elif [ -f pnpm-lock.yaml ]; then
            pnpm --dir "$dependency_source" install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            yarn --cwd "$dependency_source" install --frozen-lockfile
          fi
          RUCKSACK_INSTALL
          )"
          readonly install_source

          set +e
          "$producer_node" 3<<<"$producer_source" 4<<<"$install_source" <<'RUCKSACK_TRUSTED_LAUNCHER'
          const fs = require("node:fs");
          const { spawnSync } = require("node:child_process");
          const { createHash } = require("node:crypto");

          function fail(message) {
            console.error(`trusted evidence launcher refused: ${message}`);
            process.exit(1);
          }

          const producerSource = fs.readFileSync(3, "utf8").replace(/\n$/, "");
          const installSource = fs.readFileSync(4, "utf8").replace(/\n$/, "");
          const commandEnvironment = { ...process.env };
          for (const name of ["GITHUB_OUTPUT", "GITHUB_ENV", "GITHUB_PATH", "GITHUB_STEP_SUMMARY"]) {
            delete commandEnvironment[name];
          }

          const candidateGit = String(process.env.RUCKSACK_PRODUCER_GIT || "");
          const candidateRunner = String(process.env.RUCKSACK_CANDIDATE_RUNNER || "");
          const trustedEvidenceRoot = String(process.env.RUCKSACK_TRUSTED_EVIDENCE_ROOT || "");
          const expectedHead = String(process.env.GITHUB_HEAD_SHA || "").trim().toLowerCase();
          const candidateUid = Number(process.env.RUCKSACK_CANDIDATE_UID);
          const candidateGid = Number(process.env.RUCKSACK_CANDIDATE_GID);
          if (!candidateGit.startsWith("/")) fail("trusted git executable must be one absolute path");
          if (!candidateRunner.startsWith("/")) fail("candidate runner must be one absolute path");
          if (!trustedEvidenceRoot.startsWith("/")) fail("trusted evidence root must be one absolute path");
          if (!/^[0-9a-f]{40}$/.test(expectedHead)) fail("event head must be one full commit SHA");
          if (!Number.isSafeInteger(candidateUid) || candidateUid <= 0) fail("candidate uid must be positive");
          if (!Number.isSafeInteger(candidateGid) || candidateGid <= 0) fail("candidate gid must be positive");

          function pinnedRegularFile(target, label) {
            let stats;
            try {
              stats = fs.lstatSync(target);
            } catch (error) {
              fail(`${label} is unavailable: ${error.message}`);
            }
            if (!stats.isFile() || stats.isSymbolicLink()) fail(`${label} must be one regular file`);
            return {
              dev: stats.dev.toString(),
              ino: stats.ino.toString(),
              mode: stats.mode,
              uid: stats.uid,
              gid: stats.gid,
              size: stats.size,
              digest: createHash("sha256").update(fs.readFileSync(target)).digest("hex"),
            };
          }

          const pinnedGit = pinnedRegularFile(candidateGit, "trusted git executable");
          const pinnedRunner = pinnedRegularFile(candidateRunner, "trusted candidate runner");

          function assertPinnedRegularFile(target, expected, label, stage) {
            const actual = pinnedRegularFile(target, label);
            for (const field of ["dev", "ino", "mode", "uid", "gid", "size", "digest"]) {
              if (actual[field] !== expected[field]) fail(`${stage}: ${label} changed`);
            }
          }

          function candidateCanWrite(stats) {
            const permissions = stats.mode & 0o777;
            return (
              (stats.uid === candidateUid && (permissions & 0o200) !== 0) ||
              (stats.gid === candidateGid && (permissions & 0o020) !== 0) ||
              (permissions & 0o002) !== 0
            );
          }

          if (candidateCanWrite(pinnedGit)) fail("candidate can write trusted git executable");
          if (candidateCanWrite(pinnedRunner)) fail("candidate can write trusted candidate runner");

          function assertCandidateCannotWriteTree(target, stage) {
            const stats = fs.lstatSync(target);
            if (stats.isSymbolicLink()) return;
            if (candidateCanWrite(stats)) fail(`${stage}: candidate can write ${Buffer.from(target).toString("hex")}`);
            if (!stats.isDirectory()) return;
            for (const leaf of fs.readdirSync(target, { encoding: "buffer" })) {
              const child = Buffer.concat([Buffer.from(target), Buffer.from("/"), leaf]);
              assertCandidateCannotWriteTree(child, stage);
            }
          }

          function normalizedCandidateArgv(command, argsOrOptions, maybeOptions) {
            const args = Array.isArray(argsOrOptions) ? argsOrOptions : [];
            const options = (Array.isArray(argsOrOptions) ? maybeOptions : argsOrOptions) || {};
            if (typeof command !== "string" || !command || command.includes("\0")) {
              fail("candidate command must be one non-empty string");
            }
            if (args.some((item) => typeof item !== "string" || !item || item.includes("\0"))) {
              fail("candidate arguments must be non-empty strings");
            }
            const allowed = new Set(["encoding", "maxBuffer", "shell", "stdio"]);
            for (const name of Object.keys(options)) {
              if (!allowed.has(name)) fail(`candidate command option ${name} is unsupported`);
            }
            let argv = [command, ...args];
            if (options.shell) {
              const shell = typeof options.shell === "string" ? options.shell : "/bin/sh";
              argv = [shell, "-c", command];
            }
            return { argv, options };
          }

          function candidateSpawnSync(command, argsOrOptions, maybeOptions, stage = "candidate command") {
            const { argv, options } = normalizedCandidateArgv(command, argsOrOptions, maybeOptions);
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", stage);
            const payload = Buffer.from(JSON.stringify(argv), "utf8").toString("base64url");
            const result = spawnSync(candidateRunner, [payload], {
              env: commandEnvironment,
              ...(options.encoding ? { encoding: options.encoding } : {}),
              ...(options.stdio ? { stdio: options.stdio } : {}),
              maxBuffer: Math.min(Number(options.maxBuffer) || 64 * 1024 * 1024, 64 * 1024 * 1024),
            });
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", stage);
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            return result;
          }

          function runGit(args, stage, binary = false) {
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            const result = spawnSync(candidateGit, args, {
              env: { ...commandEnvironment, GIT_OPTIONAL_LOCKS: "0" },
              ...(binary ? {} : { encoding: "utf8" }),
              maxBuffer: 64 * 1024 * 1024,
            });
            if (result.error) fail(`${stage}: git failed to start: ${result.error.message}`);
            if (result.signal || result.status !== 0) {
              fail(`${stage}: git failed with ${result.signal || `exit ${result.status}`}`);
            }
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            return result.stdout || (binary ? Buffer.alloc(0) : "");
          }

          function trackedDigest(entry, stage) {
            if (entry.mode === "160000") return "gitlink";
            let stats;
            try {
              stats = fs.lstatSync(entry.path);
            } catch (error) {
              fail(`${stage}: tracked path ${entry.label} is unavailable: ${error.message}`);
            }
            const hash = createHash("sha256");
            if (entry.mode === "120000") {
              if (!stats.isSymbolicLink()) fail(`${stage}: tracked path ${entry.label} changed type`);
              hash.update(fs.readlinkSync(entry.path, { encoding: "buffer" }));
              return hash.digest("hex");
            }
            if (entry.mode !== "100644" && entry.mode !== "100755") {
              fail(`${stage}: tracked path ${entry.label} has unsupported mode ${entry.mode}`);
            }
            if (!stats.isFile() || stats.isSymbolicLink()) {
              fail(`${stage}: tracked path ${entry.label} changed type`);
            }
            const executable = (stats.mode & 0o111) !== 0;
            if (executable !== (entry.mode === "100755")) {
              fail(`${stage}: tracked path ${entry.label} changed executable mode`);
            }
            const descriptor = fs.openSync(entry.path, "r");
            try {
              const chunk = Buffer.allocUnsafe(64 * 1024);
              for (;;) {
                const count = fs.readSync(descriptor, chunk, 0, chunk.length, null);
                if (count === 0) break;
                hash.update(chunk.subarray(0, count));
              }
            } finally {
              fs.closeSync(descriptor);
            }
            return hash.digest("hex");
          }

          function captureTrackedState(stage) {
            const listing = runGit(["ls-files", "--stage", "-z"], stage, true);
            const tracked = [];
            let offset = 0;
            while (offset < listing.length) {
              const end = listing.indexOf(0, offset);
              if (end < 0) fail(`${stage}: tracked-file listing is not NUL terminated`);
              const record = listing.subarray(offset, end);
              const separator = record.indexOf(9);
              if (separator < 0) fail(`${stage}: tracked-file listing is malformed`);
              const fields = record.subarray(0, separator).toString("ascii").split(" ");
              if (fields.length !== 3 || fields[2] !== "0") {
                fail(`${stage}: tracked-file listing contains an unmerged entry`);
              }
              const entry = {
                mode: fields[0],
                path: Buffer.from(record.subarray(separator + 1)),
                label: record.subarray(separator + 1).toString("hex"),
              };
              entry.digest = trackedDigest(entry, stage);
              tracked.push(entry);
              offset = end + 1;
            }
            return tracked;
          }

          function assertTrackedState(tracked, stage) {
            for (const entry of tracked) {
              if (trackedDigest(entry, stage) !== entry.digest) {
                fail(`${stage}: tracked path ${entry.label} no longer matches the tested checkout`);
              }
            }
          }

          let immutableTrackedState;
          function assertCandidateState(stage) {
            const actualHead = runGit(["rev-parse", "--verify", "HEAD^{commit}"], stage).trim().toLowerCase();
            if (actualHead !== expectedHead) {
              fail(`${stage}: candidate HEAD no longer equals the immutable event head`);
            }
            const changed = runGit([
              "status", "--porcelain=v1", "--untracked-files=all", "--ignore-submodules=none", "--", ".",
              ":(exclude).agent/evidence", ":(exclude).agent/evidence/**",
            ], stage).trim();
            if (changed) fail(`${stage}: candidate checkout is no longer clean`);
            if (immutableTrackedState) assertTrackedState(immutableTrackedState, stage);
          }

          assertCandidateState("before dependency installation");
          immutableTrackedState = captureTrackedState("before dependency installation");
          assertCandidateCannotWriteTree("..", "before dependency installation");
          assertCandidateCannotWriteTree(".", "before dependency installation");

          const installed = candidateSpawnSync(
            "/bin/bash",
            ["--noprofile", "--norc", "-e", "-o", "pipefail", "-c", installSource],
            { stdio: "inherit" },
            "dependency installation",
          );
          if (installed.error) fail(`dependency installation failed to start: ${installed.error.message}`);
          if (installed.signal || installed.status !== 0) {
            fail(`dependency installation failed with ${installed.signal || `exit ${installed.status}`}`);
          }
          assertCandidateState("after dependency installation");
          assertCandidateCannotWriteTree(".", "after dependency installation");

          for (const candidate of [".agent", ".agent/evidence"]) {
            try {
              if (fs.lstatSync(candidate).isSymbolicLink()) fail(`${candidate} must not be a symlink`);
            } catch (error) {
              if (error.code !== "ENOENT") fail(`cannot inspect ${candidate}: ${error.message}`);
            }
          }
          fs.rmSync(".agent/evidence", { recursive: true, force: true });
          fs.mkdirSync(".agent/evidence", { recursive: true, mode: 0o700 });
          assertCandidateCannotWriteTree(".agent/evidence", "before producer execution");

          const opener = "<<'NODE'\n";
          const openerIndex = producerSource.indexOf(opener);
          const terminator = "\nNODE";
          if (openerIndex < 0 || !producerSource.endsWith(terminator)) {
            fail("producer must contain one terminal NODE heredoc");
          }
          const producerBody = producerSource.slice(
            openerIndex + opener.length,
            producerSource.length - terminator.length,
          );
          for (const name of ["GITHUB_OUTPUT", "GITHUB_ENV", "GITHUB_PATH", "GITHUB_STEP_SUMMARY"]) {
            delete process.env[name];
          }
          process.env.RUCKSACK_PRODUCER_NODE = process.execPath;
          process.argv = [process.execPath, "-"];
          class ProducerExit {
            constructor(status) {
              this.status = status;
            }
          }
          const producerProcess = new Proxy(process, {
            get(target, property) {
              if (property === "exit") {
                return (status = 0) => {
                  throw new ProducerExit(Number.isInteger(status) ? status : 1);
                };
              }
              return Reflect.get(target, property, target);
            },
            set(target, property, value) {
              return Reflect.set(target, property, value, target);
            },
          });
          let producerStatus = 0;
          const trustedRequire = (specifier) => {
            if (specifier === "child_process" || specifier === "node:child_process") {
              return { ...require(specifier), spawnSync: candidateSpawnSync };
            }
            return require(specifier);
          };
          try {
            const execute = new Function(
              "require",
              "process",
              "__filename",
              "__dirname",
              producerBody,
            );
            execute(trustedRequire, producerProcess, "[rucksack-agent-evidence]", process.cwd());
          } catch (error) {
            if (error instanceof ProducerExit) producerStatus = error.status;
            else fail(`producer failed: ${error && error.stack ? error.stack : error}`);
          }
          assertCandidateState("after producer execution");
          assertCandidateCannotWriteTree(".", "after producer execution");

          function copyTrustedEvidence(source, target, budget = { remaining: 64 * 1024 * 1024 }) {
            const sourceStats = fs.lstatSync(source);
            if (sourceStats.isSymbolicLink()) fail("revalidation evidence must not contain symlinks");
            if (sourceStats.isDirectory()) {
              if (source !== ".agent/evidence") fs.mkdirSync(target, { mode: 0o700 });
              for (const leaf of fs.readdirSync(source)) {
                copyTrustedEvidence(`${source}/${leaf}`, `${target}/${leaf}`, budget);
              }
              return;
            }
            if (!sourceStats.isFile() || sourceStats.nlink !== 1) {
              fail("revalidation evidence must contain only unshared regular files");
            }
            if (sourceStats.size > budget.remaining) fail("revalidation evidence exceeds 64 MiB");
            budget.remaining -= sourceStats.size;
            fs.copyFileSync(source, target, fs.constants.COPYFILE_EXCL);
            fs.chmodSync(target, 0o600);
          }

          const evidenceRootStats = fs.lstatSync(trustedEvidenceRoot);
          if (
            !evidenceRootStats.isDirectory() ||
            evidenceRootStats.isSymbolicLink() ||
            evidenceRootStats.uid !== process.getuid() ||
            (evidenceRootStats.mode & 0o077) !== 0 ||
            fs.readdirSync(trustedEvidenceRoot).length !== 0
          ) {
            fail("trusted evidence root must be one empty owner-only directory");
          }
          const candidateRoot = fs.realpathSync(".");
          const evidenceRoot = fs.realpathSync(trustedEvidenceRoot);
          if (evidenceRoot === candidateRoot || evidenceRoot.startsWith(`${candidateRoot}/`)) {
            fail("trusted evidence root must stay outside the candidate checkout");
          }
          copyTrustedEvidence(".agent/evidence", trustedEvidenceRoot);
          process.exit(producerStatus);
          RUCKSACK_TRUSTED_LAUNCHER
          status=$?
          set -e
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload untrusted revalidation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evidence-revalidation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rucksack-agent-evidence-trusted-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          include-hidden-files: true
          if-no-files-found: warn

  validate:
    needs: revalidate
    if: >-
      always() &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    # Keep fixed validation off the candidate execution pool. Self-hosted-only
    # repositories must use the dedicated, ephemeral publisher runner pool.
    runs-on: ${{ fromJSON(vars.RUCKSACK_PUBLISHER_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Set up trusted validator runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download untrusted revalidation evidence
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: agent-evidence-revalidation-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rucksack-agent-evidence-input/.agent/evidence

      - name: Validate revalidation manifest
        id: evidence
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          GITHUB_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUCKSACK_EXPECTED_REPOSITORY: ${{ github.repository }}
          RUCKSACK_EXPECTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          EVIDENCE_STATUS: ${{ needs.revalidate.outputs.status || '1' }}
          RUCKSACK_DOWNLOAD_OUTCOME: ${{ steps.download.outcome }}
        run: |
          set -euo pipefail
          status="$EVIDENCE_STATUS"
          input_root="$RUNNER_TEMP/rucksack-agent-evidence-input"
          mkdir -p -- "$input_root/.agent/evidence"
          manifest="$RUNNER_TEMP/rucksack-agent-evidence-manifest.json"
          candidate_list="$RUNNER_TEMP/rucksack-agent-evidence-candidates.bin"
          rm -f -- "$manifest" "$candidate_list"
          cd -- "$input_root"
          manifests=()
          if ! find .agent/evidence -name manifest.json -type f -print0 > "$candidate_list"; then
            status=1
          else
            while IFS= read -r -d '' candidate; do
              manifests+=("$candidate")
            done < "$candidate_list"
          fi
          rm -f -- "$candidate_list"
          validator_node="$(command -v node)"
          validator_node="$(realpath -e -- "$validator_node")"

          if [ "$RUCKSACK_DOWNLOAD_OUTCOME" != "success" ]; then
            echo "Evidence artifact download did not succeed." >&2
            status=1
          elif [ -L .agent/evidence ] || [ "${#manifests[@]}" -ne 1 ]; then
            echo "Expected exactly one regular evidence manifest; found ${#manifests[@]}." >&2
            status=1
          else
            candidate="${manifests[0]}"
            if [ ! -f "$candidate" ] || [ -L "$candidate" ]; then
              status=1
            elif ! EXPECTED_HEAD_SHA="$GITHUB_HEAD_SHA" EXPECTED_REPOSITORY="$RUCKSACK_EXPECTED_REPOSITORY" EXPECTED_BRANCH="$RUCKSACK_EXPECTED_BRANCH" EVIDENCE_STATUS="$status" CANONICAL_MANIFEST="$manifest" "$validator_node" - "$candidate" <<'RUCKSACK_VALIDATE_MANIFEST'
          const fs = require("node:fs");
          const path = require("node:path");

          const manifestPath = process.argv[2];
          const expectedHead = String(process.env.EXPECTED_HEAD_SHA || "").trim().toLowerCase();
          const expectedRepository = String(process.env.EXPECTED_REPOSITORY || "").trim();
          const expectedBranch = String(process.env.EXPECTED_BRANCH || "").trim();
          const evidenceStatus = Number(process.env.EVIDENCE_STATUS);
          const canonicalPath = String(process.env.CANONICAL_MANIFEST || "");
          const controlCharacters = /[\u0000-\u001f\u007f\u2028\u2029]/;
          const rfc3339Timestamp = /^([1-9][0-9]{3})-(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])T(?:[01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9](?:\.[0-9]{1,3})?(?:Z|[+-](?:[01][0-9]|2[0-3]):[0-5][0-9])$/;
          const allowedLaneIds = new Set([
            "lint", "build", "type-check", "unit", "test", "e2e",
            "rust-check", "rust-test", "python-test",
          ]);
          // The documented exit taxonomy, rendered from rucksack.evidence_taxonomy so the
          // validator cannot drift from the script that produces the manifest.
          const blockedClassExitCodes = {"blocked-auth": 3, "blocked-decision": 4, "blocked-environment": 2};

          function fail(message) {
            console.error(`evidence manifest rejected: ${message}`);
            process.exit(1);
          }

          function isRecord(value) {
            return value !== null && typeof value === "object" && !Array.isArray(value);
          }

          function rejectControlCharacters(value, location) {
            if (typeof value === "string") {
              if (controlCharacters.test(value)) fail(`${location} contains a control character`);
              if (value.length > 8192) fail(`${location} is too long`);
              return;
            }
            if (Array.isArray(value)) {
              if (value.length > 200) fail(`${location} has too many items`);
              value.forEach((item, index) => rejectControlCharacters(item, `${location}[${index}]`));
              return;
            }
            if (isRecord(value)) {
              for (const [key, item] of Object.entries(value)) {
                rejectControlCharacters(key, `${location} key`);
                rejectControlCharacters(item, `${location}.${key}`);
              }
            }
          }

          function exactKeys(value, required, optional, location) {
            if (!isRecord(value)) fail(`${location} must be an object`);
            const allowed = new Set([...required, ...optional]);
            for (const key of required) {
              if (!Object.hasOwn(value, key)) fail(`${location}.${key} is required`);
            }
            for (const key of Object.keys(value)) {
              if (!allowed.has(key)) fail(`${location}.${key} is not allowed`);
            }
          }

          function stringValue(value, location, { allowEmpty = false } = {}) {
            if (typeof value !== "string") fail(`${location} must be a string`);
            if (!allowEmpty && !value) fail(`${location} must not be empty`);
            return value;
          }

          function nonNegativeInteger(value, location) {
            if (!Number.isInteger(value) || value < 0) fail(`${location} must be a non-negative integer`);
          }

          function nonNegativeSafeInteger(value, location) {
            if (!Number.isSafeInteger(value) || value < 0) fail(`${location} must be a non-negative safe integer`);
          }

          function timestampValue(value, location) {
            const candidate = stringValue(value, location);
            const match = candidate.match(rfc3339Timestamp);
            if (!match) fail(`${location} must match the RFC3339 timestamp subset`);
            const [year, month, day] = match.slice(1, 4).map(Number);
            const calendar = new Date(Date.UTC(year, month - 1, day));
            if (
              calendar.getUTCFullYear() !== year ||
              calendar.getUTCMonth() !== month - 1 ||
              calendar.getUTCDate() !== day
            ) {
              fail(`${location} must match the RFC3339 timestamp subset`);
            }
            return candidate;
          }

          function stringArray(value, location) {
            if (!Array.isArray(value)) fail(`${location} must be an array`);
            value.forEach((item, index) => stringValue(item, `${location}[${index}]`));
            if (new Set(value).size !== value.length) fail(`${location} must not contain duplicates`);
            return value;
          }

          function relativePath(value, location) {
            const candidate = stringValue(value, location);
            if (path.isAbsolute(candidate) || candidate.split(/[\\/]/).includes("..")) {
              fail(`${location} must stay inside the repository`);
            }
            return candidate;
          }

          if (!manifestPath) fail("manifest path is required");
          if (!canonicalPath || controlCharacters.test(canonicalPath)) fail("canonical manifest path is invalid");
          if (!/^[0-9a-f]{40}$/.test(expectedHead)) fail("expected event head must be a full commit SHA");
          if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(expectedRepository)) {
            fail("expected event repository must be OWNER/REPO");
          }
          if (!expectedBranch || expectedBranch.length > 255 || controlCharacters.test(expectedBranch)) {
            fail("expected event branch is invalid");
          }
          if (!Number.isInteger(evidenceStatus) || evidenceStatus < 0 || evidenceStatus > 255) {
            fail("evidence status must be an exit code");
          }

          let stats;
          try {
            stats = fs.lstatSync(manifestPath);
          } catch (error) {
            fail(`manifest is not readable: ${error.message}`);
          }
          if (!stats.isFile() || stats.isSymbolicLink()) fail("manifest must be one regular file");
          if (stats.size > 1024 * 1024) fail("manifest exceeds 1 MiB");

          let manifest;
          try {
            manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          } catch (error) {
            fail(`manifest is not valid JSON: ${error.message}`);
          }
          rejectControlCharacters(manifest, "manifest");
          exactKeys(
            manifest,
            [
              "schema_version", "run_id", "repo", "branch", "commit", "dirty",
              "started_at", "ended_at", "duration_ms", "agent_version", "invocation",
              "lanes_run", "runner", "lanes", "artifacts", "result", "required_failures",
            ],
            ["blocked_reason", "blocked_class", "caveats"],
            "manifest",
          );

          if (manifest.schema_version !== "1") fail("manifest.schema_version must be 1");
          stringValue(manifest.run_id, "manifest.run_id");
          if (stringValue(manifest.repo, "manifest.repo") !== expectedRepository) {
            fail("manifest.repo must equal the immutable event repository");
          }
          if (stringValue(manifest.branch, "manifest.branch") !== expectedBranch) {
            fail("manifest.branch must equal the immutable event branch");
          }
          const commit = stringValue(manifest.commit, "manifest.commit").toLowerCase();
          if (!/^[0-9a-f]{40}$/.test(commit) || commit !== expectedHead) {
            fail("manifest.commit must equal the immutable event head");
          }
          if (typeof manifest.dirty !== "boolean") fail("manifest.dirty must be a boolean");
          for (const field of ["started_at", "ended_at"]) {
            timestampValue(manifest[field], `manifest.${field}`);
          }
          nonNegativeInteger(manifest.duration_ms, "manifest.duration_ms");
          if (!/^[0-9a-f]{64}$/i.test(stringValue(manifest.agent_version, "manifest.agent_version"))) {
            fail("manifest.agent_version must be a SHA-256 digest");
          }

          exactKeys(
            manifest.invocation,
            ["argv", "npm_config_e2e", "npm_config_only"],
            [],
            "manifest.invocation",
          );
          stringArray(manifest.invocation.argv, "manifest.invocation.argv");
          stringValue(manifest.invocation.npm_config_e2e, "manifest.invocation.npm_config_e2e", { allowEmpty: true });
          stringValue(manifest.invocation.npm_config_only, "manifest.invocation.npm_config_only", { allowEmpty: true });

          exactKeys(manifest.runner, ["provider", "os", "node"], [], "manifest.runner");
          stringValue(manifest.runner.provider, "manifest.runner.provider");
          stringValue(manifest.runner.os, "manifest.runner.os");
          stringValue(manifest.runner.node, "manifest.runner.node");

          const laneIds = [];
          if (!Array.isArray(manifest.lanes)) fail("manifest.lanes must be an array");
          manifest.lanes.forEach((lane, index) => {
            const location = `manifest.lanes[${index}]`;
            exactKeys(
              lane,
              ["id", "command", "required", "status", "exit_code", "duration_ms", "log_path"],
              [],
              location,
            );
            const laneId = stringValue(lane.id, `${location}.id`);
            if (!allowedLaneIds.has(laneId)) fail(`${location}.id is not an allowed validation lane`);
            laneIds.push(laneId);
            stringValue(lane.command, `${location}.command`);
            if (typeof lane.required !== "boolean") fail(`${location}.required must be a boolean`);
            if (!new Set(["passed", "failed"]).has(lane.status)) fail(`${location}.status is invalid`);
            nonNegativeInteger(lane.exit_code, `${location}.exit_code`);
            nonNegativeInteger(lane.duration_ms, `${location}.duration_ms`);
            relativePath(lane.log_path, `${location}.log_path`);
            if ((lane.status === "passed") !== (lane.exit_code === 0)) {
              fail(`${location}.status does not match its exit code`);
            }
          });
          if (new Set(laneIds).size !== laneIds.length) fail("manifest lane ids must be unique");

          const lanesRun = stringArray(manifest.lanes_run, "manifest.lanes_run");
          if (JSON.stringify(lanesRun) !== JSON.stringify(laneIds)) {
            fail("manifest.lanes_run must exactly match manifest.lanes");
          }
          const requiredFailures = stringArray(manifest.required_failures, "manifest.required_failures");
          const expectedFailures = manifest.lanes
            .filter((lane) => lane.required && lane.exit_code !== 0)
            .map((lane) => lane.id);
          if (JSON.stringify(requiredFailures) !== JSON.stringify(expectedFailures)) {
            fail("manifest.required_failures does not match failed required lanes");
          }

          if (!Array.isArray(manifest.artifacts)) fail("manifest.artifacts must be an array");
          let manifestArtifacts = 0;
          manifest.artifacts.forEach((artifact, index) => {
            const location = `manifest.artifacts[${index}]`;
            exactKeys(
              artifact,
              ["kind", "path"],
              ["sha256", "size_bytes", "repo_limit_mb", "storage"],
              location,
            );
            const kind = stringValue(artifact.kind, `${location}.kind`);
            const artifactPath = relativePath(artifact.path, `${location}.path`);
            if (Object.hasOwn(artifact, "sha256")) {
              const digest = stringValue(artifact.sha256, `${location}.sha256`);
              if (!/^[0-9a-f]{64}$/i.test(digest)) fail(`${location}.sha256 must be a SHA-256 digest`);
            }
            if (Object.hasOwn(artifact, "size_bytes")) nonNegativeSafeInteger(artifact.size_bytes, `${location}.size_bytes`);
            if (
              Object.hasOwn(artifact, "repo_limit_mb") &&
              (typeof artifact.repo_limit_mb !== "number" || !Number.isFinite(artifact.repo_limit_mb) || artifact.repo_limit_mb <= 0)
            ) {
              fail(`${location}.repo_limit_mb must be a positive number`);
            }
            if (Object.hasOwn(artifact, "storage")) stringValue(artifact.storage, `${location}.storage`);
            if (kind === "manifest") {
              manifestArtifacts += 1;
              if (path.normalize(artifactPath) !== path.normalize(manifestPath)) {
                fail(`${location}.path must identify the validated manifest`);
              }
            }
          });
          if (manifestArtifacts !== 1) fail("manifest.artifacts must identify exactly one manifest");

          if (Object.hasOwn(manifest, "caveats")) stringArray(manifest.caveats, "manifest.caveats");
          if (!new Set(["passed", "failed", "blocked"]).has(manifest.result)) {
            fail("manifest.result is invalid");
          }
          if (manifest.result === "passed") {
            if (manifest.lanes.length === 0 || requiredFailures.length !== 0 || evidenceStatus !== 0) {
              fail("passed manifest is inconsistent with lanes or exit status");
            }
            if (Object.hasOwn(manifest, "blocked_reason")) fail("passed manifest must not contain blocked_reason");
            if (Object.hasOwn(manifest, "blocked_class")) fail("passed manifest must not contain blocked_class");
          } else if (manifest.result === "failed") {
            if (requiredFailures.length === 0 || evidenceStatus !== 1) {
              fail("failed manifest is inconsistent with lanes or exit status");
            }
            if (Object.hasOwn(manifest, "blocked_reason")) fail("failed manifest must not contain blocked_reason");
            if (Object.hasOwn(manifest, "blocked_class")) fail("failed manifest must not contain blocked_class");
          } else {
            stringValue(manifest.blocked_reason, "manifest.blocked_reason");
            if (!new Set([2, 3, 4]).has(evidenceStatus)) {
              fail("blocked manifest is inconsistent with lanes or exit status");
            }
            // A blocked run either never selected a lane (nothing to fail) or ran lanes
            // whose required failures were classified as a fault of the machine. Both are
            // "blocked"; a blocked manifest that ran lanes and reports no required failure
            // would be claiming a block it cannot point at.
            if (manifest.lanes.length === 0) {
              if (requiredFailures.length !== 0) fail("blocked manifest without lanes must not report required failures");
              if (Object.hasOwn(manifest, "blocked_class")) fail("blocked manifest without lanes must not classify a lane");
            } else {
              if (requiredFailures.length === 0) fail("blocked manifest with lanes must record the required failures that blocked it");
              const blockedClass = stringValue(manifest.blocked_class, "manifest.blocked_class");
              // Object.hasOwn, not a bare lookup: "__proto__" and "constructor" are not classes.
              if (!Object.hasOwn(blockedClassExitCodes, blockedClass)) fail("manifest.blocked_class is not a documented class");
              if (blockedClassExitCodes[blockedClass] !== evidenceStatus) {
                fail("manifest.blocked_class does not match the evidence exit status");
              }
            }
          }

          try {
            fs.writeFileSync(canonicalPath, `${JSON.stringify(manifest, null, 2)}\n`, { flag: "wx", mode: 0o600 });
          } catch (error) {
            fail(`canonical manifest could not be written: ${error.message}`);
          }
          console.log("validated one evidence manifest for the immutable event head");
          RUCKSACK_VALIDATE_MANIFEST
            then
              status=1
              rm -f -- "$manifest"
            fi
          fi
          printf 'status=%s\n' "$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload trusted validation manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evidence-manifest-${{ github.event.workflow_run.id }}-attempt-${{ github.event.workflow_run.run_attempt }}-validated-by-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rucksack-agent-evidence-manifest.json
          if-no-files-found: ignore

      - name: Fail if trusted validation failed
        if: always()
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        run: exit "${{ steps.evidence.outputs.status || '1' }}"

  publish:
    needs: validate
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    # Hosted by default. A self-hosted-only private repository may set
    # RUCKSACK_PUBLISHER_RUNS_ON to a dedicated, ephemeral trusted label array.
    # It must not select the candidate runner pool configured by RUCKSACK_RUNS_ON.
    runs-on: ${{ fromJSON(vars.RUCKSACK_PUBLISHER_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out fixed publisher source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate and publish exact evidence receipt
        env:
          GH_TOKEN: ${{ github.token }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 scripts/publish-agent-evidence
