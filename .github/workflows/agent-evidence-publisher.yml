          def become_child_subreaper() -> None:
              # PR_SET_CHILD_SUBREAPER makes daemonized grandchildren return here rather
              # than to a long-lived runner PID 1, so the trusted process can reap them.
              libc = ctypes.CDLL(None, use_errno=True)
              if libc.prctl(36, 1, 0, 0, 0) != 0:
                  refuse(f"cannot become a candidate child subreaper: errno {ctypes.get_errno()}")


          def fsync_directory(path: str) -> None:
              descriptor = os.open(path, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
              try:
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)


          def trusted_runtime_path(path: str, *, candidate_uid: int, label: str) -> str:
              resolved = os.path.realpath(path)
              if not os.path.isabs(resolved) or "\x00" in resolved:
                  refuse(f"{label} must resolve to one absolute path")
              try:
                  details = os.lstat(resolved)
              except OSError as error:
                  refuse(f"cannot inspect {label}: {error}")
              if (
                  not stat.S_ISREG(details.st_mode)
                  or details.st_nlink != 1
                  or details.st_uid == candidate_uid
                  or stat.S_IMODE(details.st_mode) & 0o022
              ):
                  refuse(f"{label} must be one candidate-immutable regular file")
              return resolved


          def trusted_runtime_directory(path: str, *, candidate_uid: int, label: str) -> str:
              resolved = os.path.realpath(path)
              if not os.path.isabs(resolved) or "\x00" in resolved or resolved != path:
                  refuse(f"{label} must resolve to one real absolute path")
              try:
                  details = os.lstat(resolved)
              except OSError as error:
                  refuse(f"cannot inspect {label}: {error}")
              if (
                  not stat.S_ISDIR(details.st_mode)
                  or stat.S_ISLNK(details.st_mode)
                  or details.st_uid == candidate_uid
                  or stat.S_IMODE(details.st_mode) & 0o022
              ):
                  refuse(f"{label} must be one candidate-immutable real directory")
              return resolved


          def seal_workspace(path: str, *, owner_uid: int, candidate_gid: int) -> None:
              if os.geteuid() != 0:
                  refuse("workspace sealing requires root privileges")
              runner_root = os.path.dirname(os.path.realpath(__file__))
              resolved = os.path.realpath(path)
              try:
                  if os.path.commonpath((runner_root, resolved)) != runner_root:
                      refuse("candidate workspace escapes the trusted isolation root")
              except ValueError:
                  refuse("candidate workspace is invalid")
              if resolved == runner_root or not os.path.isdir(resolved) or os.path.islink(resolved):
                  refuse("candidate workspace must be one descendant directory")

              entries: list[tuple[str, os.stat_result]] = []
              for directory, names, files in os.walk(resolved, topdown=True, followlinks=False):
                  details = os.lstat(directory)
                  if not stat.S_ISDIR(details.st_mode) or details.st_uid != owner_uid:
                      refuse("candidate workspace directories must be trusted-launcher owned")
                  entries.append((directory, details))
                  for name in (*names, *files):
                      target = os.path.join(directory, name)
                      target_details = os.lstat(target)
                      if stat.S_ISDIR(target_details.st_mode) and not stat.S_ISLNK(
                          target_details.st_mode
                      ):
                          continue
                      if target_details.st_uid != owner_uid:
                          refuse("candidate workspace entries must be trusted-launcher owned")
                      if stat.S_ISREG(target_details.st_mode) and target_details.st_nlink != 1:
                          refuse("candidate workspace files must be unshared")
                      if not (
                          stat.S_ISREG(target_details.st_mode)
                          or stat.S_ISLNK(target_details.st_mode)
                      ):
                          refuse("candidate workspace contains an unsupported entry")
                      entries.append((target, target_details))

              for target, details in entries:
                  os.chown(target, owner_uid, candidate_gid, follow_symlinks=False)
                  if stat.S_ISDIR(details.st_mode):
                      os.chmod(target, 0o1770, follow_symlinks=False)
                  elif stat.S_ISREG(details.st_mode):
                      executable = stat.S_IMODE(details.st_mode) & 0o111
                      os.chmod(target, 0o550 if executable else 0o440, follow_symlinks=False)


          def seal_readable_tree(path: str, *, owner_uid: int, candidate_gid: int) -> None:
              if os.geteuid() != 0:
                  refuse("readable-tree sealing requires root privileges")
              runner_root = os.path.dirname(os.path.realpath(__file__))
              resolved = os.path.realpath(path)
              try:
                  if os.path.commonpath((runner_root, resolved)) != runner_root:
                      refuse("readable tree escapes the trusted isolation root")
              except ValueError:
                  refuse("readable tree is invalid")
              if resolved == runner_root or not os.path.isdir(resolved) or os.path.islink(resolved):
                  refuse("readable tree must be one descendant directory")

              entries: list[tuple[str, os.stat_result]] = []
              for directory, names, files in os.walk(resolved, topdown=True, followlinks=False):
                  details = os.lstat(directory)
                  if (
                      not stat.S_ISDIR(details.st_mode)
                      or stat.S_ISLNK(details.st_mode)
                      or details.st_uid != owner_uid
                  ):
                      refuse("readable-tree directories must be trusted-launcher owned")
                  entries.append((directory, details))
                  for name in (*names, *files):
                      target = os.path.join(directory, name)
                      target_details = os.lstat(target)
                      if stat.S_ISDIR(target_details.st_mode) and not stat.S_ISLNK(
                          target_details.st_mode
                      ):
                          continue
                      if (
                          not stat.S_ISREG(target_details.st_mode)
                          or stat.S_ISLNK(target_details.st_mode)
                          or target_details.st_nlink != 1
                          or target_details.st_uid != owner_uid
                      ):
                          refuse("readable tree contains an unsupported or shared entry")
                      entries.append((target, target_details))

              for target, details in entries:
                  os.chown(target, owner_uid, candidate_gid, follow_symlinks=False)
                  os.chmod(
                      target,
                      0o550 if stat.S_ISDIR(details.st_mode) else 0o440,
                      follow_symlinks=False,
                  )


          def anchor_control_directory(
              path: str,
              *,
              owner_uid: int,
              candidate_uid: int,
              candidate_gid: int,
          ) -> None:
              if os.geteuid() != 0:
                  refuse("control-directory anchoring requires root privileges")
              runner_root = os.path.dirname(os.path.realpath(__file__))
              resolved = os.path.realpath(path)
              try:
                  if os.path.commonpath((runner_root, resolved)) != runner_root:
                      refuse("candidate control directory escapes the trusted isolation root")
              except ValueError:
                  refuse("candidate control directory is invalid")
              details = os.lstat(resolved)
              if (
                  resolved == runner_root
                  or not stat.S_ISDIR(details.st_mode)
                  or stat.S_ISLNK(details.st_mode)
              ):
                  refuse("candidate control directory must be one descendant directory")
              if (
                  details.st_uid == owner_uid
                  and details.st_gid == candidate_gid
                  and stat.S_IMODE(details.st_mode) == 0o1770
              ):
                  return
              if details.st_uid != candidate_uid:
                  refuse("candidate control directory must be candidate-owned before anchoring")
              os.chown(resolved, owner_uid, candidate_gid, follow_symlinks=False)
              os.chmod(resolved, 0o1770, follow_symlinks=False)


          def prepare_workspace(
              path: str,
              *,
              owner_uid: int,
              owner_gid: int,
              candidate_uid: int,
              candidate_gid: int,
          ) -> None:
              if os.geteuid() != 0:
                  refuse("workspace preparation requires root privileges")
              runner_root = os.path.dirname(os.path.realpath(__file__))
              resolved = os.path.realpath(path)
              try:
                  if os.path.commonpath((runner_root, resolved)) != runner_root:
                      refuse("candidate workspace escapes the trusted isolation root")
              except ValueError:
                  refuse("candidate workspace is invalid")
              if resolved == runner_root or not os.path.isdir(resolved) or os.path.islink(resolved):
                  refuse("candidate workspace must be one descendant directory")

              entries: list[tuple[str, os.stat_result]] = []
              for directory, names, files in os.walk(resolved, topdown=True, followlinks=False):
                  details = os.lstat(directory)
                  if not stat.S_ISDIR(details.st_mode) or details.st_uid != owner_uid:
                      refuse("candidate workspace directories must be trusted-launcher owned")
                  entries.append((directory, details))
                  for name in (*names, *files):
                      target = os.path.join(directory, name)
                      target_details = os.lstat(target)
                      if stat.S_ISDIR(target_details.st_mode) and not stat.S_ISLNK(
                          target_details.st_mode
                      ):
                          continue
                      if target_details.st_uid != owner_uid:
                          refuse("candidate workspace entries must be trusted-launcher owned")
                      if stat.S_ISREG(target_details.st_mode) and target_details.st_nlink != 1:
                          refuse("candidate workspace files must be unshared")
                      if not (
                          stat.S_ISREG(target_details.st_mode)
                          or stat.S_ISLNK(target_details.st_mode)
                      ):
                          refuse("candidate workspace contains an unsupported entry")
                      entries.append((target, target_details))

              for target, details in entries:
                  if target == resolved:
                      os.chown(target, owner_uid, candidate_gid, follow_symlinks=False)
                      os.chmod(target, 0o1770, follow_symlinks=False)
                      continue
                  os.chown(target, candidate_uid, owner_gid, follow_symlinks=False)
                  if stat.S_ISDIR(details.st_mode):
                      os.chmod(target, 0o770, follow_symlinks=False)
                  elif stat.S_ISREG(details.st_mode):
                      executable = stat.S_IMODE(details.st_mode) & 0o111
                      os.chmod(target, 0o770 if executable else 0o660, follow_symlinks=False)


          def seal_control_file(path: str, *, owner_uid: int, candidate_gid: int) -> None:
              if os.geteuid() != 0:
                  refuse("control-file sealing requires root privileges")
              runner_root = os.path.dirname(os.path.realpath(__file__))
              resolved = os.path.realpath(path)
              try:
                  if os.path.commonpath((runner_root, resolved)) != runner_root:
                      refuse("candidate control file escapes the trusted isolation root")
              except ValueError:
                  refuse("candidate control file is invalid")
              details = os.lstat(resolved)
              if (
                  not stat.S_ISREG(details.st_mode)
                  or stat.S_ISLNK(details.st_mode)
                  or details.st_nlink != 1
                  or details.st_uid != owner_uid
              ):
                  refuse("candidate control file must be one unshared launcher-owned file")
              os.chown(resolved, owner_uid, candidate_gid, follow_symlinks=False)
              os.chmod(resolved, 0o440, follow_symlinks=False)


          def trusted_control_directory(runner: str) -> str:
              runner_details = os.lstat(runner)
              directory = os.path.join(os.path.dirname(runner), "control")
              resolved = os.path.realpath(directory)
              try:
                  details = os.lstat(directory)
              except OSError as error:
                  refuse(f"cannot inspect trusted control directory: {error}")
              if (
                  resolved != directory
                  or not stat.S_ISDIR(details.st_mode)
                  or stat.S_ISLNK(details.st_mode)
                  or details.st_uid != runner_details.st_uid
                  or details.st_gid != runner_details.st_gid
                  or stat.S_IMODE(details.st_mode) != 0o700
              ):
                  refuse("trusted control directory has unsafe metadata")
              return directory


          def write_command_config(
              *, argv: list[str], environment: dict[str, str], cwd: str, uid: int, gid: int
          ) -> str:
              runner = trusted_runtime_path(
                  __file__, candidate_uid=uid, label="trusted candidate runner"
              )
              directory = trusted_control_directory(runner)
              payload = json.dumps(
                  {
                      "argv": argv,
                      "cwd": cwd,
                      "environment": environment,
                      "gid": gid,
                      "uid": uid,
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              ).encode("utf-8")
              if not payload or len(payload) > MAX_CONFIG_BYTES:
                  refuse("candidate command configuration must be bounded")
              descriptor, path = tempfile.mkstemp(prefix=".candidate-command-", dir=directory)
              try:
                  os.fchmod(descriptor, 0o600)
                  with os.fdopen(descriptor, "wb", closefd=False) as config:
                      config.write(payload)
                      config.flush()
                      os.fsync(config.fileno())
              finally:
                  os.close(descriptor)
              fsync_directory(directory)
              return path


          def read_command_config(path: str) -> tuple[list[str], dict[str, str], str, int, int]:
              if os.geteuid() != 0:
                  refuse("candidate child must start with root privileges")
              runner = os.path.realpath(__file__)
              directory = trusted_control_directory(runner)
              if (
                  not os.path.isabs(path)
                  or "\x00" in path
                  or os.path.dirname(path) != directory
                  or not os.path.basename(path).startswith(".candidate-command-")
              ):
                  refuse("candidate command configuration path is not trusted")
              flags = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
              try:
                  descriptor = os.open(path, flags)
              except OSError as error:
                  refuse(f"cannot open candidate command configuration: {error}")
              try:
                  details = os.fstat(descriptor)
                  runner_details = os.stat(runner)
                  if (
                      not stat.S_ISREG(details.st_mode)
                      or details.st_nlink != 1
                      or details.st_uid != runner_details.st_uid
                      or stat.S_IMODE(details.st_mode) != 0o600
                      or details.st_size <= 0
                      or details.st_size > MAX_CONFIG_BYTES
                  ):
                      refuse("candidate command configuration is not one trusted regular file")
                  os.unlink(path)
                  fsync_directory(directory)
                  payload = bytearray()
                  while len(payload) <= MAX_CONFIG_BYTES:
                      block = os.read(
                          descriptor, min(65536, MAX_CONFIG_BYTES + 1 - len(payload))
                      )
                      if not block:
                          break
                      payload.extend(block)
                  if not payload or len(payload) > MAX_CONFIG_BYTES:
                      refuse("candidate command configuration must be bounded")
              finally:
                  os.close(descriptor)
              try:
                  decoded = json.loads(payload.decode("utf-8"))
              except (UnicodeError, ValueError, json.JSONDecodeError) as error:
                  refuse(f"candidate command configuration is invalid: {error}")
              if not isinstance(decoded, dict) or set(decoded) != {
                  "argv",
                  "cwd",
                  "environment",
                  "gid",
                  "uid",
              }:
                  refuse("candidate command configuration has an invalid shape")
              argv = validate_argv(decoded["argv"])
              environment = decoded["environment"]
              cwd = decoded["cwd"]
              uid = decoded["uid"]
              gid = decoded["gid"]
              if (
                  not isinstance(environment, dict)
                  or len(environment) > 4096
                  or any(
                      not isinstance(name, str)
                      or not name
                      or len(name) > 1024
                      or "=" in name
                      or "\x00" in name
                      or not isinstance(value, str)
                      or len(value) > 1024 * 1024
                      or "\x00" in value
                      for name, value in environment.items()
                  )
              ):
                  refuse("candidate command environment is invalid")
              if not isinstance(cwd, str) or not os.path.isabs(cwd) or "\x00" in cwd:
                  refuse("candidate command working directory is invalid")
              if (
                  not isinstance(uid, int)
                  or isinstance(uid, bool)
                  or uid <= 0
                  or not isinstance(gid, int)
                  or isinstance(gid, bool)
                  or gid <= 0
                  or details.st_uid == uid
              ):
                  refuse("candidate command identity is invalid")
              return argv, environment, cwd, uid, gid


          def run_candidate_child(path: str) -> "NoReturn":
              global _child_status_descriptor
              exec_status_path = os.environ.get("RUCKSACK_EXEC_STATUS_PATH", "")
              if exec_status_path.startswith("/"):
                  try:
                      _child_status_descriptor = os.open(
                          exec_status_path,
                          os.O_WRONLY
                          | os.O_TRUNC
                          | getattr(os, "O_CLOEXEC", 0)
                          | getattr(os, "O_NOFOLLOW", 0),
                      )
                  except OSError:
                      _child_status_descriptor = None
              try:
                  argv, environment, cwd, uid, gid = read_command_config(path)
                  apply_child_limits()
                  os.chdir(cwd)
                  os.setgroups([])
                  os.setresgid(gid, gid, gid)
                  os.setresuid(uid, uid, uid)
              except OSError as error:
                  refuse(f"cannot drop candidate privileges: {error}")
              libc = ctypes.CDLL(None, use_errno=True)
              if libc.prctl(38, 1, 0, 0, 0) != 0:  # PR_SET_NO_NEW_PRIVS
                  refuse(f"cannot lock candidate privileges: errno {ctypes.get_errno()}")
              if (
                  os.getuid() != uid
                  or os.geteuid() != uid
                  or os.getgid() != gid
                  or os.getegid() != gid
              ):
                  refuse("candidate identity did not take effect")
              os.umask(0o022)
              try:
                  os.execvpe(argv[0], argv, environment)
              except OSError as error:
                  write_child_status(
                      {
                          "kind": "exec",
                          "code": getattr(error, "errno", None),
                          "message": bounded_message(error),
                      }
                  )
                  raise SystemExit(127)
              finally:
                  if _child_status_descriptor is not None:
                      try:
                          os.close(_child_status_descriptor)
                      except OSError:
                          pass
                      _child_status_descriptor = None


          def apply_child_limits() -> None:
              if not sys.platform.startswith("linux"):
                  return
              try:
                  requested = (
                      (resource.RLIMIT_NOFILE, 256),
                      (resource.RLIMIT_NPROC, 64),
                      (resource.RLIMIT_CORE, 0),
                      (resource.RLIMIT_FSIZE, 64 * 1024 * 1024),
                  )
                  for limit, value in requested:
                      current = resource.getrlimit(limit)
                      if current[1] != resource.RLIM_INFINITY and current[1] < value:
                          refuse("candidate resource limit is below the required bound")
                      resource.setrlimit(limit, (value, value))
                      if resource.getrlimit(limit) != (value, value):
                          refuse("candidate resource limit did not take effect")
              except (AttributeError, OSError, ValueError) as error:
                  refuse(f"cannot apply required candidate resource limits: {error}")


          def reap_orphans() -> None:
              while True:
                  try:
                      pid, _ = os.waitpid(-1, os.WNOHANG)
                  except ChildProcessError:
                      return
                  if pid == 0:
                      return


          def kill_isolated_group(
              *,
              sudo: str,
              pkill: str,
              process_group: int,
              signal_name: str,
              required: bool,
          ) -> None:
              if signal_name not in {"SIGTERM", "SIGKILL"}:
                  refuse("candidate process signal is unsupported")
              signal_flag = "-TERM" if signal_name == "SIGTERM" else "-KILL"
              killed = subprocess.run(
                  [sudo, "-n", "--", pkill, signal_flag, "-g", str(process_group)],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              if killed.returncode not in {0, 1}:
                  refuse("cannot terminate the privileged candidate process group")


          def reap_identity(
              *, sudo: str, pkill: str, pgrep: str, uid: int, deadline: float | None = None
          ) -> None:
              for _ in range(64):
                  if deadline is not None and time.monotonic() >= deadline:
                      refuse("candidate descendants survived forced cleanup")
                  subprocess.run(
                      [sudo, "-n", "--", pkill, "-KILL", "-u", str(uid)],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  time.sleep(0.01)
                  reap_orphans()
                  alive = subprocess.run(
                      [sudo, "-n", "--", pgrep, "-u", str(uid)],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if alive.returncode == 1:
                      return
                  if alive.returncode not in {0, 1}:
                      refuse("cannot inspect candidate descendants")
                  time.sleep(0.01)
              refuse("candidate descendants survived forced cleanup")


          def main() -> int:
              if len(sys.argv) == 5 and sys.argv[1] == "--seal-control-file":
                  identities = sys.argv[3:]
                  if not all(value.isascii() and value.isdecimal() for value in identities):
                      refuse("control-file identities must be decimal numbers")
                  owner_uid, candidate_gid = map(int, identities)
                  if owner_uid < 0 or candidate_gid <= 0:
                      refuse("control-file identities must be non-negative owner and positive candidate")
                  seal_control_file(
                      sys.argv[2], owner_uid=owner_uid, candidate_gid=candidate_gid
                  )
                  return 0
              if len(sys.argv) == 5 and sys.argv[1] == "--seal-readable-tree":
                  identities = sys.argv[3:]
                  if not all(value.isascii() and value.isdecimal() for value in identities):
                      refuse("readable-tree identities must be decimal numbers")
                  owner_uid, candidate_gid = map(int, identities)
                  if owner_uid < 0 or candidate_gid <= 0:
                      refuse("readable-tree identities must be non-negative owner and positive candidate")
                  seal_readable_tree(
                      sys.argv[2], owner_uid=owner_uid, candidate_gid=candidate_gid
                  )
                  return 0
              if len(sys.argv) == 6 and sys.argv[1] == "--anchor-control-directory":
                  identities = sys.argv[3:]
                  if not all(value.isascii() and value.isdecimal() for value in identities):
                      refuse("control-directory identities must be decimal numbers")
                  owner_uid, candidate_uid, candidate_gid = map(int, identities)
                  if owner_uid < 0 or candidate_uid <= 0 or candidate_gid <= 0:
                      refuse(
                          "control-directory identities must be non-negative owner and positive candidate"
                      )
                  if owner_uid == candidate_uid:
                      refuse("control-directory owner and candidate identities must differ")
                  anchor_control_directory(
                      sys.argv[2],
                      owner_uid=owner_uid,
                      candidate_uid=candidate_uid,
                      candidate_gid=candidate_gid,
                  )
                  return 0
              if len(sys.argv) == 7 and sys.argv[1] == "--prepare-workspace":
                  identities = sys.argv[3:]
                  if not all(value.isascii() and value.isdecimal() for value in identities):
                      refuse("workspace identities must be decimal numbers")
                  owner_uid, owner_gid, candidate_uid, candidate_gid = map(int, identities)
                  if owner_uid < 0 or owner_gid < 0 or candidate_uid <= 0 or candidate_gid <= 0:
                      refuse("workspace identities must be non-negative owner and positive candidate")
                  if owner_uid == candidate_uid:
                      refuse("workspace owner and candidate identities must differ")
                  prepare_workspace(
                      sys.argv[2],
                      owner_uid=owner_uid,
                      owner_gid=owner_gid,
                      candidate_uid=candidate_uid,
                      candidate_gid=candidate_gid,
                  )
                  return 0
              if len(sys.argv) == 6 and sys.argv[1] == "--seal-workspace":
                  owner_uid = int(sys.argv[3]) if sys.argv[3].isascii() and sys.argv[3].isdecimal() else 0
                  candidate_uid = int(sys.argv[4]) if sys.argv[4].isascii() and sys.argv[4].isdecimal() else 0
                  candidate_gid = int(sys.argv[5]) if sys.argv[5].isascii() and sys.argv[5].isdecimal() else 0
                  if owner_uid < 0 or candidate_uid <= 0 or candidate_gid <= 0:
                      refuse("workspace identities must be non-negative owner and positive candidate")
                  if owner_uid == candidate_uid:
                      refuse("workspace owner and candidate identities must differ")
                  seal_workspace(sys.argv[2], owner_uid=owner_uid, candidate_gid=candidate_gid)
                  return 0
              if len(sys.argv) == 3 and sys.argv[1] == "--child":
                  run_candidate_child(sys.argv[2])
              if len(sys.argv) != 2:
                  refuse("expected one encoded command payload")
              argv, timeout_ms, kill_signal, stdout_mode, stderr_mode = decode_request(sys.argv[1])
              uid = required_identity("RUCKSACK_CANDIDATE_UID")
              gid = required_identity("RUCKSACK_CANDIDATE_GID")
              home = required_path("RUCKSACK_CANDIDATE_HOME")
              dependency_root = required_path("RUCKSACK_CANDIDATE_DEPENDENCY_ROOT")
              sudo = required_path("RUCKSACK_TRUSTED_SUDO")
              trusted_env = required_path("RUCKSACK_TRUSTED_ENV")
              python_library_path = required_path(
                  "RUCKSACK_TRUSTED_PYTHON_LIBRARY_PATH"
              )
              pkill = required_path("RUCKSACK_TRUSTED_PKILL")
              pgrep = required_path("RUCKSACK_TRUSTED_PGREP")
              environment = candidate_environment(home, dependency_root)
              become_child_subreaper()
              runner = trusted_runtime_path(
                  __file__, candidate_uid=uid, label="trusted candidate runner"
              )
              configured_python = trusted_runtime_path(
                  required_path("RUCKSACK_CANDIDATE_PYTHON"),
                  candidate_uid=uid,
                  label="trusted Python runtime",
              )
              python = trusted_runtime_path(
                  sys.executable, candidate_uid=uid, label="trusted Python runtime"
              )
              if not os.path.samefile(configured_python, python):
                  refuse("trusted Python runtime does not match the pinned staged runtime")
              if sys.version_info < (3, 11):
                  refuse("trusted Python runtime must be Python 3.11 or newer")
              python = configured_python
              trusted_runtime_path(sudo, candidate_uid=uid, label="trusted sudo executable")
              trusted_env = trusted_runtime_path(
                  trusted_env, candidate_uid=uid, label="trusted env executable"
              )
              python_library_path = trusted_runtime_directory(
                  python_library_path,
                  candidate_uid=uid,
                  label="trusted Python library directory",
              )
              if python_library_path != os.path.join(
                  os.path.dirname(os.path.dirname(python)), "lib"
              ):
                  refuse("trusted Python library directory does not match the pinned runtime")
              trusted_runtime_path(pkill, candidate_uid=uid, label="trusted pkill executable")
              trusted_runtime_path(pgrep, candidate_uid=uid, label="trusted pgrep executable")
              config = write_command_config(
                  argv=argv,
                  environment=environment,
                  cwd=os.getcwd(),
                  uid=uid,
                  gid=gid,
              )
              status_descriptor, exec_status_path = tempfile.mkstemp(
                  prefix=".candidate-status-",
                  dir=os.path.dirname(config),
              )
              os.fchmod(status_descriptor, 0o600)
              os.close(status_descriptor)
              isolated = [
                  sudo,
                  "-n",
                  "--",
                  trusted_env,
                  f"RUCKSACK_EXEC_STATUS_PATH={exec_status_path}",
                  f"LD_LIBRARY_PATH={python_library_path}",
                  python,
                  "-I",
                  "-B",
                  runner,
                  "--child",
                  config,
              ]
              child = None
              selector = selectors.DefaultSelector()
              stdout_chunks: list[bytes] = []
              stderr_chunks: list[bytes] = []
              captured_bytes = 0
              timed_out = False
              output_limited = False
              termination_reason: str | None = None
              kill_sent = False
              cleanup_deadline: float | None = None
              returncode = 125
              exec_status = b""

              def begin_termination(reason: str) -> None:
                  nonlocal termination_reason, cleanup_deadline
                  if termination_reason is not None:
                      return
                  termination_reason = reason
                  kill_isolated_group(
                      sudo=sudo,
                      pkill=pkill,
                      process_group=child.pid,
                      signal_name=kill_signal,
                      required=True,
                  )
                  cleanup_deadline = time.monotonic() + TERM_GRACE_SECONDS

              try:
                  child_environment = {
                      "HOME": "/root",
                      "LANG": "C",
                      "LC_ALL": "C",
                      "PATH": "/usr/bin:/bin",
                      "RUCKSACK_EXEC_STATUS_PATH": exec_status_path,
                  }
                  child = subprocess.Popen(
                      isolated,
                      cwd=os.getcwd(),
                      env=child_environment,
                      stdin=subprocess.DEVNULL,
                      stdout=subprocess.PIPE,
                      stderr=subprocess.PIPE,
                      start_new_session=True,
                      close_fds=True,
                  )
                  assert child.stdout is not None and child.stderr is not None
                  for stream in (child.stdout, child.stderr):
                      os.set_blocking(stream.fileno(), False)
                      selector.register(stream, selectors.EVENT_READ)
                  deadline = (
                      None
                      if timeout_ms is None
                      else time.monotonic() + (timeout_ms / 1000)
                  )
                  while selector.get_map() or child.poll() is None:
                      now = time.monotonic()
                      if (
                          deadline is not None
                          and termination_reason is None
                          and now >= deadline
                      ):
                          timed_out = True
                          begin_termination("timeout")
                      if (
                          termination_reason is not None
                          and not kill_sent
                          and cleanup_deadline is not None
                          and now >= cleanup_deadline
                      ):
                          kill_isolated_group(
                              sudo=sudo,
                              pkill=pkill,
                              process_group=child.pid,
                              signal_name="SIGKILL",
                              required=True,
                          )
                          kill_sent = True
                          cleanup_deadline = now + CLEANUP_TIMEOUT_SECONDS
                      elif (
                          kill_sent
                          and cleanup_deadline is not None
                          and now >= cleanup_deadline
                          and (child.poll() is None or selector.get_map())
                      ):
                          refuse("privileged candidate process group survived forced cleanup")

                      if child.poll() is not None and termination_reason is None:
                          # A candidate command can leave descendants holding the
                          # pipes open.  Kill the complete group before waiting for EOF.
                          termination_reason = "completed"
                          kill_isolated_group(
                              sudo=sudo,
                              pkill=pkill,
                              process_group=child.pid,
                              signal_name="SIGKILL",
                              required=False,
                          )
                          kill_sent = True
                          cleanup_deadline = now + CLEANUP_TIMEOUT_SECONDS

                      wait_for = 0.05
                      if deadline is not None and termination_reason is None:
                          wait_for = max(0.0, min(wait_for, deadline - now))
                      if cleanup_deadline is not None:
                          wait_for = max(0.0, min(wait_for, cleanup_deadline - now))
                      events = selector.select(wait_for) if selector.get_map() else []
                      for key, _ in events:
                          stream = key.fileobj
                          try:
                              block = os.read(stream.fileno(), 65536)
                          except BlockingIOError:
                              continue
                          if not block:
                              selector.unregister(stream)
                              stream.close()
                              continue
                          remaining = MAX_OUTPUT_BYTES - captured_bytes
                          if remaining > 0 and not output_limited:
                              retained = block[:remaining]
                              if stream is child.stdout:
                                  stdout_chunks.append(retained)
                              else:
                                  stderr_chunks.append(retained)
                              captured_bytes += len(retained)
                          if len(block) > remaining:
                              if not output_limited:
                                  output_limited = True
                                  begin_termination("output")

                  returncode = child.wait(timeout=1)
              finally:
                  if child is not None:
                      try:
                          if child.poll() is None:
                              kill_isolated_group(
                                  sudo=sudo,
                                  pkill=pkill,
                                  process_group=child.pid,
                                  signal_name="SIGKILL",
                                  required=False,
                              )
                          child.wait(timeout=CLEANUP_TIMEOUT_SECONDS)
                      except subprocess.TimeoutExpired:
                          refuse("privileged candidate process group survived forced cleanup")
                      except OSError as error:
                          refuse(f"cannot reap privileged candidate process group: {error}")
                  for stream in tuple(selector.get_map().values()):
                      try:
                          selector.unregister(stream.fileobj)
                      except Exception:
                          pass
                      try:
                          stream.fileobj.close()
                      except OSError:
                          pass
                  selector.close()
                  try:
                      with open(exec_status_path, "rb") as status_stream:
                          exec_status = status_stream.read(4096)
                  except FileNotFoundError:
                      pass
                  try:
                      os.unlink(exec_status_path)
                  except FileNotFoundError:
                      pass
                  try:
                      os.unlink(config)
                  except FileNotFoundError:
                      pass
                  fsync_directory(os.path.dirname(config))
                  reap_orphans()
                  reap_identity(
                      sudo=sudo,
                      pkill=pkill,
                      pgrep=pgrep,
                      uid=uid,
                      deadline=time.monotonic() + CLEANUP_TIMEOUT_SECONDS,
                  )

              child_error = None
              if exec_status:
                  try:
                      parsed_status = json.loads(exec_status.decode("ascii"))
                  except (UnicodeError, ValueError, json.JSONDecodeError):
                      refuse("candidate exec status channel was malformed")
                  if not isinstance(parsed_status, dict) or parsed_status.get("kind") not in {
                      "exec",
                      "refusal",
                  }:
                      refuse("candidate exec status channel was invalid")
                  if parsed_status["kind"] == "refusal":
                      refuse(parsed_status.get("message", "candidate runner refused"))
                  child_error = {
                      "code": "CHILD_PROCESS",
                      "message": bounded_message(parsed_status.get("message", "candidate command failed to start")),
                  }

              status: int | None
              child_signal: str | None = None
              error: dict[str, str] | None = child_error
              if timed_out:
                  status = None
                  child_signal = kill_signal
                  error = {"code": "ETIMEDOUT", "message": "candidate command timed out"}
              elif output_limited:
                  status = None
                  child_signal = kill_signal
                  error = {"code": "E2BIG", "message": "candidate command output exceeded 64 MiB"}
              elif child_error is not None:
                  status = None
              elif returncode < 0:
                  status = None
                  try:
                      child_signal = signal.Signals(-returncode).name
                  except (ValueError, TypeError):
                      refuse("candidate process returned an unknown signal")
              else:
                  status = min(255, returncode)
              emit_frame(
                  {
                      "version": 1,
                      "kind": "result",
                      "status": status,
                      "signal": child_signal,
                      "error": error,
                      "timed_out": timed_out,
                      "output_limited": output_limited,
                  }
              )
              sys.stdout.buffer.write(b"".join(stdout_chunks))
              sys.stderr.buffer.write(b"".join(stderr_chunks))
              sys.stdout.buffer.flush()
              sys.stderr.buffer.flush()
              if os.environ.get("RUCKSACK_RUNNER_FRAME_FD") != "3":
                  if timed_out:
                      return 124
                  if output_limited:
                      return 125
              return status if status is not None else 0


          if __name__ == "__main__":
              try:
                  raise SystemExit(main())
              except SystemExit:
                  raise
              except BaseException as error:
                  refuse(f"runner internal failure: {error}")
          RUCKSACK_CANDIDATE_RUNNER_PY
          "$RUCKSACK_TRUSTED_CHMOD" 0500 -- "$candidate_runner_source"
          "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_INSTALL"             -o "$trusted_owner_uid" -g "$trusted_owner_gid" -m 0500 --             "$candidate_runner_source" "$RUCKSACK_CANDIDATE_RUNNER"
          "$RUCKSACK_TRUSTED_RM" -f -- "$candidate_runner_source"
          candidate_runner_source=""
          RUCKSACK_CANDIDATE_TRUSTED_PATH="$trusted_python_root/bin:$PATH"
          export RUCKSACK_CANDIDATE_TRUSTED_PATH
          if [ -e "$RUCKSACK_TRUSTED_EVIDENCE_ROOT" ]; then
            echo "Trusted evidence root already exists." >&2
            exit 1
          fi
          mkdir -m 0700 -- "$RUCKSACK_TRUSTED_EVIDENCE_ROOT"
          cd -- "$GITHUB_WORKSPACE/candidate"
          install_source="$(cat <<'RUCKSACK_INSTALL'
          set -e
          python_prefix="$PYTHONUSERBASE"
          if [ "$python_prefix" != "$HOME/.local" ]; then
