# Generated by rucksack.
# This fixed workflow never executes pull-request code with its write token.
name: agent-evidence-publisher

on:
  workflow_run:
    workflows: ["agent-evidence"]
    types: [completed]

concurrency:
  group: agent-evidence-publisher-${{ github.repository_id }}-${{ github.event.workflow_run.pull_requests[0].number }}-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions: {}

jobs:
  revalidate:
    # workflow_run.path may include an @ref suffix and is not unique by itself.
    # The fixed script resolves the canonical workflow ID before artifact reads.
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success'
    # This job executes candidate dependencies without a write token, so it may
    # follow the same private-repository fallback as the candidate evidence job.
    runs-on: ${{ fromJSON(vars.RUCKSACK_RUNS_ON || '["ubuntu-latest"]') }}
    permissions:
      contents: read
    outputs:
      status: ${{ steps.produce.outputs.status }}
    steps:
      - name: Check out fixed trusted producer
        uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
          path: trusted

      # A base-repository token cannot read a separate private fork directly.
      # GitHub exposes the fork head through this base-repository PR ref; the
      # following step rejects a raced or otherwise mismatched ref.
      - name: Check out candidate through base PR ref
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.workflow_run.pull_requests[0].number }}/head
          persist-credentials: false
          path: candidate

      - name: Bind checked-out candidate to event head
        working-directory: candidate
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          EXPECTED_CANDIDATE_HEAD: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ ! "$EXPECTED_CANDIDATE_HEAD" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "Event head is not one full commit SHA." >&2
            exit 1
          fi
          actual_head="$(git rev-parse --verify HEAD^{commit})"
          if [ "$actual_head" != "$EXPECTED_CANDIDATE_HEAD" ]; then
            echo "Base PR ref does not match the immutable event head." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Run trusted producer against candidate
        id: produce
        shell: /bin/bash --noprofile --norc -e -o pipefail {0}
        env:
          GITHUB_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_HEAD_REF: ${{ github.event.workflow_run.head_branch }}
          GITHUB_REF_NAME: ""
          RUCKSACK_EXPECTED_REPOSITORY: ${{ github.repository }}
          RUCKSACK_EXPECTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUCKSACK_TRUSTED_EVIDENCE_ROOT: ${{ runner.temp }}/rucksack-agent-evidence-trusted-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          umask 077
          trusted_producer="$GITHUB_WORKSPACE/trusted/scripts/agent-evidence"
          if [ ! -f "$trusted_producer" ] || [ -L "$trusted_producer" ]; then
            echo "Trusted evidence producer must be one regular file." >&2
            exit 1
          fi
          RUCKSACK_TRUSTED_PRODUCER_ROOT="$GITHUB_WORKSPACE/trusted"
          export RUCKSACK_TRUSTED_PRODUCER_ROOT
          producer_source="$(< "$trusted_producer")"
          if [ -z "$producer_source" ]; then
            echo "Trusted evidence producer source must not be empty." >&2
            exit 1
          fi
          readonly producer_source
          producer_node="$(command -v node)"
          producer_node="$(realpath -e -- "$producer_node")"
          workspace_real="$(realpath -e -- "$GITHUB_WORKSPACE")"
          case "$producer_node" in
            "$workspace_real"|"$workspace_real"/*)
              echo "Producer runtime resolves inside the candidate workspace." >&2
              exit 1
              ;;
          esac
          readonly producer_node
          producer_git="$(command -v git)"
          producer_git="$(realpath -e -- "$producer_git")"
          case "$producer_git" in
            "$workspace_real"|"$workspace_real"/*)
              echo "Trusted git executable resolves inside the candidate workspace." >&2
              exit 1
              ;;
          esac
          readonly producer_git
          export RUCKSACK_PRODUCER_GIT="$producer_git"
          if [ "$(uname -s)" != Linux ]; then
            echo "Trusted candidate isolation currently requires Linux." >&2
            exit 1
          fi
          for trusted_tool in sudo pkill pgrep useradd userdel id install rm; do
            trusted_path="$(command -v "$trusted_tool")"
            case "$trusted_path" in
              /*) ;;
              *)
                echo "Trusted isolation tool path is not absolute: $trusted_tool" >&2
                exit 1
                ;;
            esac
            trusted_real="$(realpath -e -- "$trusted_path")"
            case "$trusted_real" in
              "$workspace_real"|"$workspace_real"/*)
                echo "Trusted isolation tool resolves inside the workspace: $trusted_tool" >&2
                exit 1
                ;;
            esac
            printf -v "RUCKSACK_TRUSTED_${trusted_tool^^}" '%s' "$trusted_path"
            export "RUCKSACK_TRUSTED_${trusted_tool^^}"
          done
          if ! "$RUCKSACK_TRUSTED_SUDO" -n -- true; then
            echo "Trusted candidate isolation requires non-interactive sudo." >&2
            exit 1
          fi
          isolation_root="$(mktemp -d "$RUNNER_TEMP/rucksack-evidence-isolation.XXXXXX")"
          chmod 0711 "$isolation_root"
          readonly isolation_root
          candidate_user="rsk${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          candidate_created=0
          cleanup_candidate_isolation() {
            set +e
            if [ "$candidate_created" -eq 1 ]; then
              for ((cleanup_attempt = 0; cleanup_attempt < 64; cleanup_attempt++)); do
                "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_PKILL" -KILL -u "$RUCKSACK_CANDIDATE_UID" >/dev/null 2>&1 || true
                "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_PGREP" -u "$RUCKSACK_CANDIDATE_UID" >/dev/null 2>&1 || break
              done
              "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_USERDEL" "$candidate_user" >/dev/null 2>&1 || true
            fi
            "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_RM"               -rf -- "$isolation_root" >/dev/null 2>&1 || true
          }
          trap cleanup_candidate_isolation EXIT
          "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_USERADD"             --system --no-create-home --home-dir "$isolation_root/home"             --shell /usr/sbin/nologin "$candidate_user"
          candidate_created=1
          RUCKSACK_CANDIDATE_UID="$("$RUCKSACK_TRUSTED_ID" -u "$candidate_user")"
          RUCKSACK_CANDIDATE_GID="$("$RUCKSACK_TRUSTED_ID" -g "$candidate_user")"
          RUCKSACK_CANDIDATE_HOME="$isolation_root/home"
          RUCKSACK_CANDIDATE_DEPENDENCY_ROOT="$isolation_root/dependencies"
          export RUCKSACK_CANDIDATE_UID RUCKSACK_CANDIDATE_GID
          export RUCKSACK_CANDIDATE_HOME RUCKSACK_CANDIDATE_DEPENDENCY_ROOT
          "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_INSTALL"             -d -o "$RUCKSACK_CANDIDATE_UID" -g "$RUCKSACK_CANDIDATE_GID" -m 0700             "$RUCKSACK_CANDIDATE_HOME" "$RUCKSACK_CANDIDATE_HOME/tmp"
          trusted_owner_uid="$("$RUCKSACK_TRUSTED_ID" -u)"
          "$RUCKSACK_TRUSTED_SUDO" -n -- "$RUCKSACK_TRUSTED_INSTALL"             -d -o "$trusted_owner_uid" -g "$RUCKSACK_CANDIDATE_GID" -m 1770             "$RUCKSACK_CANDIDATE_DEPENDENCY_ROOT"
          RUCKSACK_CANDIDATE_RUNNER="$isolation_root/run-candidate"
          export RUCKSACK_CANDIDATE_RUNNER
          cat > "$RUCKSACK_CANDIDATE_RUNNER" <<'RUCKSACK_CANDIDATE_RUNNER_PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import base64
          import ctypes
          import json
          import os
          import re
          import stat
          import subprocess
          import sys
          import tempfile
          import time


          MAX_CONFIG_BYTES = 8 * 1024 * 1024
          MAX_TIMEOUT_MS = 900_000
          SECRET_ENVIRONMENT_NAME = re.compile(
              r"TOKEN|SECRET|KEY|PASSWORD|COOKIE|SESSION|AUTH|WEBHOOK|CREDENTIAL",
              re.IGNORECASE,
          )


          def refuse(message: str) -> "NoReturn":
              print(f"trusted candidate runner refused: {message}", file=sys.stderr)
              raise SystemExit(125)


          def required_path(name: str) -> str:
              value = os.environ.get(name, "")
              if not value.startswith("/") or "\x00" in value:
                  refuse(f"{name} must be one absolute path")
              return value


          def required_identity(name: str) -> int:
              value = os.environ.get(name, "")
              if not value.isascii() or not value.isdecimal():
                  refuse(f"{name} must be one numeric identity")
              identity = int(value)
              if identity <= 0:
                  refuse(f"{name} must be positive")
              return identity


          def validate_argv(decoded: object) -> list[str]:
              if (
                  not isinstance(decoded, list)
                  or not decoded
                  or len(decoded) > 256
                  or any(
                      not isinstance(item, str)
                      or not item
                      or "\x00" in item
                      or len(item) > 256 * 1024
                      for item in decoded
                  )
              ):
                  refuse("command payload must contain bounded non-empty strings")
              return decoded


          def decode_request(value: str) -> tuple[list[str], int | None]:
              if not value or len(value) > 1024 * 1024:
                  refuse("command payload must be bounded")
              try:
                  padding = "=" * (-len(value) % 4)
                  raw = base64.urlsafe_b64decode((value + padding).encode("ascii"))
                  decoded = json.loads(raw.decode("utf-8"))
              except (UnicodeError, ValueError, json.JSONDecodeError) as error:
                  refuse(f"command payload is invalid: {error}")
              if isinstance(decoded, list):
                  return validate_argv(decoded), None
              if not isinstance(decoded, dict) or set(decoded) != {"argv", "timeout_ms"}:
                  refuse("command payload has an invalid shape")
              timeout_ms = decoded["timeout_ms"]
              if timeout_ms is not None and (
                  isinstance(timeout_ms, bool)
                  or not isinstance(timeout_ms, int)
                  or timeout_ms <= 0
                  or timeout_ms > MAX_TIMEOUT_MS
              ):
                  refuse("command timeout must be between 1 and 900000 milliseconds")
              return validate_argv(decoded["argv"]), timeout_ms


          def candidate_environment(home: str, dependency_root: str) -> dict[str, str]:
              environment = dict(os.environ)
              safe_directories_payload = environment.pop(
                  "RUCKSACK_CANDIDATE_GIT_SAFE_DIRECTORIES", "[]"
              )
              for name in tuple(environment):
                  if (
                      name.startswith("RUCKSACK_TRUSTED_")
                      or SECRET_ENVIRONMENT_NAME.search(name)
                      or name in {
                          "GITHUB_ENV",
                          "GITHUB_OUTPUT",
                          "GITHUB_PATH",
                          "GITHUB_STEP_SUMMARY",
                          "RUCKSACK_CANDIDATE_GID",
                          "RUCKSACK_CANDIDATE_HOME",
                          "RUCKSACK_CANDIDATE_DEPENDENCY_ROOT",
                          "RUCKSACK_CANDIDATE_RUNNER",
                          "RUCKSACK_CANDIDATE_TRUSTED_PATH",
                          "RUCKSACK_CANDIDATE_UID",
                          "RUCKSACK_PRODUCER_GIT",
                          "RUCKSACK_TRUSTED_EVIDENCE_ROOT",
                      }
                  ):
                      environment.pop(name, None)
              python_user = os.path.join(home, ".local")
              dependency_source = os.path.join(dependency_root, "source")
              candidate_root = os.getcwd()
              try:
                  requested_safe_directories = json.loads(safe_directories_payload)
              except (TypeError, ValueError, json.JSONDecodeError) as error:
                  refuse(f"candidate Git safe-directory list is invalid: {error}")
              if (
                  not isinstance(requested_safe_directories, list)
                  or len(requested_safe_directories) > 256
                  or any(
                      not isinstance(directory, str)
                      or not directory.startswith("/")
                      or "\x00" in directory
                      or os.path.normpath(directory) != directory
                      for directory in requested_safe_directories
                  )
              ):
                  refuse("candidate Git safe-directory list is invalid")
              safe_directories: list[str] = []
              for directory in requested_safe_directories:
                  details = os.lstat(directory)
                  if not stat.S_ISDIR(details.st_mode) or stat.S_ISLNK(details.st_mode):
                      refuse("candidate Git safe directory must be one real directory")
                  resolved = os.path.realpath(directory)
                  try:
                      if os.path.commonpath((candidate_root, resolved)) != candidate_root:
                          refuse("candidate Git safe directory escapes the execution workspace")
                  except ValueError:
                      refuse("candidate Git safe directory is invalid")
                  details = os.lstat(resolved)
                  if not stat.S_ISDIR(details.st_mode) or stat.S_ISLNK(details.st_mode):
                      refuse("candidate Git safe directory must be one real directory")
                  if resolved not in safe_directories:
                      safe_directories.append(resolved)
              trusted_path = os.environ.get("RUCKSACK_CANDIDATE_TRUSTED_PATH", "")
              if not trusted_path:
                  refuse("trusted candidate PATH is missing")
              git_config = [
                  ("safe.directory", candidate_root),
                  *(("safe.directory", directory) for directory in safe_directories),
                  ("diff.ignoreSubmodules", "all"),
              ]
              environment.update(
                  {
                      "HOME": home,
                      "GIT_CONFIG_COUNT": str(len(git_config)),
                      "GIT_NO_REPLACE_OBJECTS": "1",
                      "GIT_OPTIONAL_LOCKS": "0",
                      "LOGNAME": "rucksack-evidence",
                      "NODE_PATH": os.path.join(dependency_source, "node_modules"),
                      "npm_config_cache": os.path.join(home, ".npm"),
                      "PATH": os.pathsep.join(
                          (
                              trusted_path,
                              os.path.join(python_user, "bin"),
                              os.path.join(dependency_source, "node_modules", ".bin"),
                          )
                      ),
                      "PIP_CACHE_DIR": os.path.join(home, ".cache", "pip"),
                      "PYTHONPATH": os.pathsep.join(
                          (os.path.join(candidate_root, "src"), candidate_root)
                      ),
                      "PYTHONPYCACHEPREFIX": os.path.join(home, ".cache", "pycache"),
                      "RUCKSACK_CANDIDATE_DEPENDENCY_ROOT": dependency_root,
                      "TMP": os.path.join(home, "tmp"),
                      "TEMP": os.path.join(home, "tmp"),
                      "TMPDIR": os.path.join(home, "tmp"),
                      "USER": "rucksack-evidence",
                  }
              )
              for index, (key, value) in enumerate(git_config):
                  environment[f"GIT_CONFIG_KEY_{index}"] = key
                  environment[f"GIT_CONFIG_VALUE_{index}"] = value
              return environment


          def become_child_subreaper() -> None:
              # PR_SET_CHILD_SUBREAPER makes daemonized grandchildren return here rather
              # than to a long-lived runner PID 1, so the trusted process can reap them.
              libc = ctypes.CDLL(None, use_errno=True)
              if libc.prctl(36, 1, 0, 0, 0) != 0:
                  refuse(f"cannot become a candidate child subreaper: errno {ctypes.get_errno()}")


          def fsync_directory(path: str) -> None:
              descriptor = os.open(path, os.O_RDONLY | getattr(os, "O_DIRECTORY", 0))
              try:
                  os.fsync(descriptor)
              finally:
                  os.close(descriptor)


          def trusted_runtime_path(path: str, *, candidate_uid: int, label: str) -> str:
              resolved = os.path.realpath(path)
              if not os.path.isabs(resolved) or "\x00" in resolved:
                  refuse(f"{label} must resolve to one absolute path")
              try:
                  details = os.lstat(resolved)
              except OSError as error:
                  refuse(f"cannot inspect {label}: {error}")
              if (
                  not stat.S_ISREG(details.st_mode)
                  or details.st_nlink != 1
                  or details.st_uid == candidate_uid
                  or stat.S_IMODE(details.st_mode) & 0o022
              ):
                  refuse(f"{label} must be one candidate-immutable regular file")
              return resolved


          def seal_workspace(path: str, *, owner_uid: int, candidate_gid: int) -> None:
              if os.geteuid() != 0:
                  refuse("workspace sealing requires root privileges")
              runner_root = os.path.dirname(os.path.realpath(__file__))
              resolved = os.path.realpath(path)
              try:
                  if os.path.commonpath((runner_root, resolved)) != runner_root:
                      refuse("candidate workspace escapes the trusted isolation root")
              except ValueError:
                  refuse("candidate workspace is invalid")
              if resolved == runner_root or not os.path.isdir(resolved) or os.path.islink(resolved):
                  refuse("candidate workspace must be one descendant directory")

              entries: list[tuple[str, os.stat_result]] = []
              for directory, names, files in os.walk(resolved, topdown=True, followlinks=False):
                  details = os.lstat(directory)
                  if not stat.S_ISDIR(details.st_mode) or details.st_uid != owner_uid:
                      refuse("candidate workspace directories must be trusted-launcher owned")
                  entries.append((directory, details))
                  for name in (*names, *files):
                      target = os.path.join(directory, name)
                      target_details = os.lstat(target)
                      if stat.S_ISDIR(target_details.st_mode) and not stat.S_ISLNK(
                          target_details.st_mode
                      ):
                          continue
                      if target_details.st_uid != owner_uid:
                          refuse("candidate workspace entries must be trusted-launcher owned")
                      if stat.S_ISREG(target_details.st_mode) and target_details.st_nlink != 1:
                          refuse("candidate workspace files must be unshared")
                      if not (
                          stat.S_ISREG(target_details.st_mode)
                          or stat.S_ISLNK(target_details.st_mode)
                      ):
                          refuse("candidate workspace contains an unsupported entry")
                      entries.append((target, target_details))

              for target, details in entries:
                  os.chown(target, owner_uid, candidate_gid, follow_symlinks=False)
                  if stat.S_ISDIR(details.st_mode):
                      os.chmod(target, 0o1770, follow_symlinks=False)
                  elif stat.S_ISREG(details.st_mode):
                      executable = stat.S_IMODE(details.st_mode) & 0o111
                      os.chmod(target, 0o550 if executable else 0o440, follow_symlinks=False)


          def seal_readable_tree(path: str, *, owner_uid: int, candidate_gid: int) -> None:
              if os.geteuid() != 0:
                  refuse("readable-tree sealing requires root privileges")
              runner_root = os.path.dirname(os.path.realpath(__file__))
              resolved = os.path.realpath(path)
              try:
                  if os.path.commonpath((runner_root, resolved)) != runner_root:
                      refuse("readable tree escapes the trusted isolation root")
              except ValueError:
                  refuse("readable tree is invalid")
              if resolved == runner_root or not os.path.isdir(resolved) or os.path.islink(resolved):
                  refuse("readable tree must be one descendant directory")

              entries: list[tuple[str, os.stat_result]] = []
              for directory, names, files in os.walk(resolved, topdown=True, followlinks=False):
                  details = os.lstat(directory)
                  if (
                      not stat.S_ISDIR(details.st_mode)
                      or stat.S_ISLNK(details.st_mode)
                      or details.st_uid != owner_uid
                  ):
                      refuse("readable-tree directories must be trusted-launcher owned")
                  entries.append((directory, details))
                  for name in (*names, *files):
                      target = os.path.join(directory, name)
                      target_details = os.lstat(target)
                      if stat.S_ISDIR(target_details.st_mode) and not stat.S_ISLNK(
                          target_details.st_mode
                      ):
                          continue
                      if (
                          not stat.S_ISREG(target_details.st_mode)
                          or stat.S_ISLNK(target_details.st_mode)
                          or target_details.st_nlink != 1
                          or target_details.st_uid != owner_uid
                      ):
                          refuse("readable tree contains an unsupported or shared entry")
                      entries.append((target, target_details))

              for target, details in entries:
                  os.chown(target, owner_uid, candidate_gid, follow_symlinks=False)
                  os.chmod(
                      target,
                      0o550 if stat.S_ISDIR(details.st_mode) else 0o440,
                      follow_symlinks=False,
                  )


          def anchor_control_directory(
              path: str,
              *,
              owner_uid: int,
              candidate_uid: int,
              candidate_gid: int,
          ) -> None:
              if os.geteuid() != 0:
                  refuse("control-directory anchoring requires root privileges")
              runner_root = os.path.dirname(os.path.realpath(__file__))
              resolved = os.path.realpath(path)
              try:
                  if os.path.commonpath((runner_root, resolved)) != runner_root:
                      refuse("candidate control directory escapes the trusted isolation root")
              except ValueError:
                  refuse("candidate control directory is invalid")
              details = os.lstat(resolved)
              if (
                  resolved == runner_root
                  or not stat.S_ISDIR(details.st_mode)
                  or stat.S_ISLNK(details.st_mode)
              ):
                  refuse("candidate control directory must be one descendant directory")
              if (
                  details.st_uid == owner_uid
                  and details.st_gid == candidate_gid
                  and stat.S_IMODE(details.st_mode) == 0o1770
              ):
                  return
              if details.st_uid != candidate_uid:
                  refuse("candidate control directory must be candidate-owned before anchoring")
              os.chown(resolved, owner_uid, candidate_gid, follow_symlinks=False)
              os.chmod(resolved, 0o1770, follow_symlinks=False)


          def prepare_workspace(
              path: str,
              *,
              owner_uid: int,
              owner_gid: int,
              candidate_uid: int,
              candidate_gid: int,
          ) -> None:
              if os.geteuid() != 0:
                  refuse("workspace preparation requires root privileges")
              runner_root = os.path.dirname(os.path.realpath(__file__))
              resolved = os.path.realpath(path)
              try:
                  if os.path.commonpath((runner_root, resolved)) != runner_root:
                      refuse("candidate workspace escapes the trusted isolation root")
              except ValueError:
                  refuse("candidate workspace is invalid")
              if resolved == runner_root or not os.path.isdir(resolved) or os.path.islink(resolved):
                  refuse("candidate workspace must be one descendant directory")

              entries: list[tuple[str, os.stat_result]] = []
              for directory, names, files in os.walk(resolved, topdown=True, followlinks=False):
                  details = os.lstat(directory)
                  if not stat.S_ISDIR(details.st_mode) or details.st_uid != owner_uid:
                      refuse("candidate workspace directories must be trusted-launcher owned")
                  entries.append((directory, details))
                  for name in (*names, *files):
                      target = os.path.join(directory, name)
                      target_details = os.lstat(target)
                      if stat.S_ISDIR(target_details.st_mode) and not stat.S_ISLNK(
                          target_details.st_mode
                      ):
                          continue
                      if target_details.st_uid != owner_uid:
                          refuse("candidate workspace entries must be trusted-launcher owned")
                      if stat.S_ISREG(target_details.st_mode) and target_details.st_nlink != 1:
                          refuse("candidate workspace files must be unshared")
                      if not (
                          stat.S_ISREG(target_details.st_mode)
                          or stat.S_ISLNK(target_details.st_mode)
                      ):
                          refuse("candidate workspace contains an unsupported entry")
                      entries.append((target, target_details))

              for target, details in entries:
                  if target == resolved:
                      os.chown(target, owner_uid, candidate_gid, follow_symlinks=False)
                      os.chmod(target, 0o1770, follow_symlinks=False)
                      continue
                  os.chown(target, candidate_uid, owner_gid, follow_symlinks=False)
                  if stat.S_ISDIR(details.st_mode):
                      os.chmod(target, 0o770, follow_symlinks=False)
                  elif stat.S_ISREG(details.st_mode):
                      executable = stat.S_IMODE(details.st_mode) & 0o111
                      os.chmod(target, 0o770 if executable else 0o660, follow_symlinks=False)


          def seal_control_file(path: str, *, owner_uid: int, candidate_gid: int) -> None:
              if os.geteuid() != 0:
                  refuse("control-file sealing requires root privileges")
              runner_root = os.path.dirname(os.path.realpath(__file__))
              resolved = os.path.realpath(path)
              try:
                  if os.path.commonpath((runner_root, resolved)) != runner_root:
                      refuse("candidate control file escapes the trusted isolation root")
              except ValueError:
                  refuse("candidate control file is invalid")
              details = os.lstat(resolved)
              if (
                  not stat.S_ISREG(details.st_mode)
                  or stat.S_ISLNK(details.st_mode)
                  or details.st_nlink != 1
                  or details.st_uid != owner_uid
              ):
                  refuse("candidate control file must be one unshared launcher-owned file")
              os.chown(resolved, owner_uid, candidate_gid, follow_symlinks=False)
              os.chmod(resolved, 0o440, follow_symlinks=False)


          def write_command_config(
              *, argv: list[str], environment: dict[str, str], cwd: str, uid: int, gid: int
          ) -> str:
              runner = trusted_runtime_path(
                  __file__, candidate_uid=uid, label="trusted candidate runner"
              )
              directory = os.path.dirname(runner)
              payload = json.dumps(
                  {
                      "argv": argv,
                      "cwd": cwd,
                      "environment": environment,
                      "gid": gid,
                      "uid": uid,
                  },
                  ensure_ascii=False,
                  separators=(",", ":"),
              ).encode("utf-8")
              if not payload or len(payload) > MAX_CONFIG_BYTES:
                  refuse("candidate command configuration must be bounded")
              descriptor, path = tempfile.mkstemp(prefix=".candidate-command-", dir=directory)
              try:
                  os.fchmod(descriptor, 0o600)
                  with os.fdopen(descriptor, "wb", closefd=False) as config:
                      config.write(payload)
                      config.flush()
                      os.fsync(config.fileno())
              finally:
                  os.close(descriptor)
              fsync_directory(directory)
              return path


          def read_command_config(path: str) -> tuple[list[str], dict[str, str], str, int, int]:
              if os.geteuid() != 0:
                  refuse("candidate child must start with root privileges")
              runner = os.path.realpath(__file__)
              directory = os.path.dirname(runner)
              if (
                  not os.path.isabs(path)
                  or "\x00" in path
                  or os.path.dirname(path) != directory
                  or not os.path.basename(path).startswith(".candidate-command-")
              ):
                  refuse("candidate command configuration path is not trusted")
              flags = os.O_RDONLY | getattr(os, "O_CLOEXEC", 0) | getattr(os, "O_NOFOLLOW", 0)
              try:
                  descriptor = os.open(path, flags)
              except OSError as error:
                  refuse(f"cannot open candidate command configuration: {error}")
              try:
                  details = os.fstat(descriptor)
                  runner_details = os.stat(runner)
                  if (
                      not stat.S_ISREG(details.st_mode)
                      or details.st_nlink != 1
                      or details.st_uid != runner_details.st_uid
                      or stat.S_IMODE(details.st_mode) != 0o600
                      or details.st_size <= 0
                      or details.st_size > MAX_CONFIG_BYTES
                  ):
                      refuse("candidate command configuration is not one trusted regular file")
                  os.unlink(path)
                  fsync_directory(directory)
                  payload = bytearray()
                  while len(payload) <= MAX_CONFIG_BYTES:
                      block = os.read(
                          descriptor, min(65536, MAX_CONFIG_BYTES + 1 - len(payload))
                      )
                      if not block:
                          break
                      payload.extend(block)
                  if not payload or len(payload) > MAX_CONFIG_BYTES:
                      refuse("candidate command configuration must be bounded")
              finally:
                  os.close(descriptor)
              try:
                  decoded = json.loads(payload.decode("utf-8"))
              except (UnicodeError, ValueError, json.JSONDecodeError) as error:
                  refuse(f"candidate command configuration is invalid: {error}")
              if not isinstance(decoded, dict) or set(decoded) != {
                  "argv",
                  "cwd",
                  "environment",
                  "gid",
                  "uid",
              }:
                  refuse("candidate command configuration has an invalid shape")
              argv = validate_argv(decoded["argv"])
              environment = decoded["environment"]
              cwd = decoded["cwd"]
              uid = decoded["uid"]
              gid = decoded["gid"]
              if (
                  not isinstance(environment, dict)
                  or len(environment) > 4096
                  or any(
                      not isinstance(name, str)
                      or not name
                      or len(name) > 1024
                      or "=" in name
                      or "\x00" in name
                      or not isinstance(value, str)
                      or len(value) > 1024 * 1024
                      or "\x00" in value
                      for name, value in environment.items()
                  )
              ):
                  refuse("candidate command environment is invalid")
              if not isinstance(cwd, str) or not os.path.isabs(cwd) or "\x00" in cwd:
                  refuse("candidate command working directory is invalid")
              if (
                  not isinstance(uid, int)
                  or isinstance(uid, bool)
                  or uid <= 0
                  or not isinstance(gid, int)
                  or isinstance(gid, bool)
                  or gid <= 0
                  or details.st_uid == uid
              ):
                  refuse("candidate command identity is invalid")
              return argv, environment, cwd, uid, gid


          def run_candidate_child(path: str) -> "NoReturn":
              argv, environment, cwd, uid, gid = read_command_config(path)
              try:
                  os.chdir(cwd)
                  os.setgroups([])
                  os.setresgid(gid, gid, gid)
                  os.setresuid(uid, uid, uid)
              except OSError as error:
                  refuse(f"cannot drop candidate privileges: {error}")
              libc = ctypes.CDLL(None, use_errno=True)
              if libc.prctl(38, 1, 0, 0, 0) != 0:  # PR_SET_NO_NEW_PRIVS
                  refuse(f"cannot lock candidate privileges: errno {ctypes.get_errno()}")
              if (
                  os.getuid() != uid
                  or os.geteuid() != uid
                  or os.getgid() != gid
                  or os.getegid() != gid
              ):
                  refuse("candidate identity did not take effect")
              os.umask(0o022)
              try:
                  os.execvpe(argv[0], argv, environment)
              except OSError as error:
                  refuse(f"cannot execute candidate command: {error}")


          def reap_orphans() -> None:
              while True:
                  try:
                      pid, _ = os.waitpid(-1, os.WNOHANG)
                  except ChildProcessError:
                      return
                  if pid == 0:
                      return


          def kill_isolated_group(
              *, sudo: str, pkill: str, process_group: int, required: bool
          ) -> None:
              killed = subprocess.run(
                  [sudo, "-n", "--", pkill, "-KILL", "-g", str(process_group)],
                  check=False,
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              )
              allowed = {0} if required else {0, 1}
              if killed.returncode not in allowed:
                  refuse("cannot terminate the privileged candidate process group")


          def reap_identity(*, sudo: str, pkill: str, pgrep: str, uid: int) -> None:
              for _ in range(64):
                  subprocess.run(
                      [sudo, "-n", "--", pkill, "-KILL", "-u", str(uid)],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  time.sleep(0.01)
                  reap_orphans()
                  alive = subprocess.run(
                      [sudo, "-n", "--", pgrep, "-u", str(uid)],
                      check=False,
                      stdout=subprocess.DEVNULL,
                      stderr=subprocess.DEVNULL,
                  )
                  if alive.returncode == 1:
                      return
                  if alive.returncode not in {0, 1}:
                      refuse("cannot inspect candidate descendants")
                  time.sleep(0.01)
              refuse("candidate descendants survived forced cleanup")


          def main() -> int:
              if len(sys.argv) == 5 and sys.argv[1] == "--seal-control-file":
                  identities = sys.argv[3:]
                  if not all(value.isascii() and value.isdecimal() for value in identities):
                      refuse("control-file identities must be decimal numbers")
                  owner_uid, candidate_gid = map(int, identities)
                  if owner_uid < 0 or candidate_gid <= 0:
                      refuse("control-file identities must be non-negative owner and positive candidate")
                  seal_control_file(
                      sys.argv[2], owner_uid=owner_uid, candidate_gid=candidate_gid
                  )
                  return 0
              if len(sys.argv) == 5 and sys.argv[1] == "--seal-readable-tree":
                  identities = sys.argv[3:]
                  if not all(value.isascii() and value.isdecimal() for value in identities):
                      refuse("readable-tree identities must be decimal numbers")
                  owner_uid, candidate_gid = map(int, identities)
                  if owner_uid < 0 or candidate_gid <= 0:
                      refuse("readable-tree identities must be non-negative owner and positive candidate")
                  seal_readable_tree(
                      sys.argv[2], owner_uid=owner_uid, candidate_gid=candidate_gid
                  )
                  return 0
              if len(sys.argv) == 6 and sys.argv[1] == "--anchor-control-directory":
                  identities = sys.argv[3:]
                  if not all(value.isascii() and value.isdecimal() for value in identities):
                      refuse("control-directory identities must be decimal numbers")
                  owner_uid, candidate_uid, candidate_gid = map(int, identities)
                  if owner_uid < 0 or candidate_uid <= 0 or candidate_gid <= 0:
                      refuse(
                          "control-directory identities must be non-negative owner and positive candidate"
                      )
                  if owner_uid == candidate_uid:
                      refuse("control-directory owner and candidate identities must differ")
                  anchor_control_directory(
                      sys.argv[2],
                      owner_uid=owner_uid,
                      candidate_uid=candidate_uid,
                      candidate_gid=candidate_gid,
                  )
                  return 0
              if len(sys.argv) == 7 and sys.argv[1] == "--prepare-workspace":
                  identities = sys.argv[3:]
                  if not all(value.isascii() and value.isdecimal() for value in identities):
                      refuse("workspace identities must be decimal numbers")
                  owner_uid, owner_gid, candidate_uid, candidate_gid = map(int, identities)
                  if owner_uid < 0 or owner_gid < 0 or candidate_uid <= 0 or candidate_gid <= 0:
                      refuse("workspace identities must be non-negative owner and positive candidate")
                  if owner_uid == candidate_uid:
                      refuse("workspace owner and candidate identities must differ")
                  prepare_workspace(
                      sys.argv[2],
                      owner_uid=owner_uid,
                      owner_gid=owner_gid,
                      candidate_uid=candidate_uid,
                      candidate_gid=candidate_gid,
                  )
                  return 0
              if len(sys.argv) == 6 and sys.argv[1] == "--seal-workspace":
                  owner_uid = int(sys.argv[3]) if sys.argv[3].isascii() and sys.argv[3].isdecimal() else 0
                  candidate_uid = int(sys.argv[4]) if sys.argv[4].isascii() and sys.argv[4].isdecimal() else 0
                  candidate_gid = int(sys.argv[5]) if sys.argv[5].isascii() and sys.argv[5].isdecimal() else 0
                  if owner_uid < 0 or candidate_uid <= 0 or candidate_gid <= 0:
                      refuse("workspace identities must be non-negative owner and positive candidate")
                  if owner_uid == candidate_uid:
                      refuse("workspace owner and candidate identities must differ")
                  seal_workspace(sys.argv[2], owner_uid=owner_uid, candidate_gid=candidate_gid)
