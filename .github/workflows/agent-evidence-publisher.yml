            "RUNNER_OUTPUT_LIMIT",
            "RUNNER_RESOURCE",
            "RUNNER_REAP",
            "RUNNER_INTERNAL",
            "RUNNER_EXEC",
          ]);

          function parseCandidateRunnerFrame(value) {
            if (!Buffer.isBuffer(value) || value.length === 0 || value.length > 16 * 1024) {
              fail("trusted candidate runner returned no bounded sideband frame");
            }
            if (!value.subarray(0, RUNNER_FRAME_MAGIC.length).equals(RUNNER_FRAME_MAGIC)) {
              fail("trusted candidate runner returned an invalid sideband magic");
            }
            const body = value.subarray(RUNNER_FRAME_MAGIC.length);
            if (body.length < 2 || body[body.length - 1] !== 0x0a || body.subarray(0, body.length - 1).includes(0x0a)) {
              fail("trusted candidate runner returned trailing or malformed sideband bytes");
            }
            let frame;
            try {
              frame = JSON.parse(body.subarray(0, body.length - 1).toString("utf8"));
            } catch (_error) {
              fail("trusted candidate runner returned malformed sideband JSON");
            }
            if (!frame || typeof frame !== "object" || Array.isArray(frame) || frame.version !== 1 || typeof frame.kind !== "string") {
              fail("trusted candidate runner returned an invalid sideband envelope");
            }
            if (frame.kind === "refusal") {
              if (
                Object.keys(frame).sort().join(",") !== "code,kind,message,version" ||
                !RUNNER_REFUSAL_CODES.has(frame.code) ||
                typeof frame.message !== "string" ||
                frame.message.length > 512
              ) {
                fail("trusted candidate runner returned an invalid refusal frame");
              }
              return frame;
            }
            if (frame.kind !== "result" || Object.keys(frame).sort().join(",") !== "error,kind,output_limited,signal,status,timed_out,version") {
              fail("trusted candidate runner returned an invalid result frame");
            }
            if (
              (frame.status !== null && (!Number.isInteger(frame.status) || frame.status < 0 || frame.status > 255)) ||
              (frame.signal !== null && (typeof frame.signal !== "string" || !/^SIG[A-Z0-9]+$/.test(frame.signal) || frame.signal.length > 32)) ||
              typeof frame.timed_out !== "boolean" ||
              typeof frame.output_limited !== "boolean"
            ) {
              fail("trusted candidate runner returned contradictory result fields");
            }
            if (frame.error !== null && (
              !frame.error || typeof frame.error !== "object" || Array.isArray(frame.error) ||
              Object.keys(frame.error).sort().join(",") !== "code,message" ||
              !["CHILD_PROCESS", "ETIMEDOUT", "E2BIG"].includes(frame.error.code) ||
              typeof frame.error.message !== "string" || frame.error.message.length > 512
            )) {
              fail("trusted candidate runner returned an invalid result error");
            }
            const errorCode = frame.error === null ? null : frame.error.code;
            if (frame.status !== null && (frame.signal !== null || frame.error !== null)) {
              fail("trusted candidate runner returned contradictory status fields");
            }
            const expectedTerminationError =
              (frame.timed_out && frame.signal === "SIGTERM" && errorCode === "ETIMEDOUT" && !frame.output_limited) ||
              (frame.output_limited && frame.signal === "SIGTERM" && errorCode === "E2BIG" && !frame.timed_out);
            if (frame.signal !== null && frame.error !== null && !expectedTerminationError) {
              fail("trusted candidate runner returned contradictory signal fields");
            }
            if (frame.status === null && frame.signal === null && frame.error === null) {
              fail("trusted candidate runner returned no child outcome");
            }
            if (frame.timed_out && (
              frame.status !== null || frame.signal !== "SIGTERM" || errorCode !== "ETIMEDOUT" || frame.output_limited
            )) {
              fail("trusted candidate runner returned a contradictory timeout result");
            }
            if (frame.output_limited && (
              frame.status !== null || frame.signal !== "SIGTERM" || errorCode !== "E2BIG" || frame.timed_out
            )) {
              fail("trusted candidate runner returned a contradictory output result");
            }
            if (!frame.timed_out && errorCode === "ETIMEDOUT") {
              fail("trusted candidate runner returned an unmarked timeout error");
            }
            if (!frame.output_limited && errorCode === "E2BIG") {
              fail("trusted candidate runner returned an unmarked output error");
            }
            // frame.status === 125 is ordinary candidate data, never a runner refusal.
            return frame;
          }

          function candidateSpawnSync(command, argsOrOptions, maybeOptions, stage = "candidate command") {
            const { argv, options, timeoutMs, killSignal, stdoutMode, stderrMode } = normalizedCandidateArgv(command, argsOrOptions, maybeOptions);
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", stage);
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", stage);
            assertPinnedPythonRuntime(stage);
            assertPinnedRegularFile(producerNode, pinnedProducerNode, "trusted producer runtime", stage);
            assertPinnedDirectory(
              producerNodeRoot,
              pinnedProducerNodeRoot,
              "trusted producer runtime directory",
              stage,
            );
            assertPinnedDirectory(
              producerNodeDistributionRoot,
              pinnedProducerNodeDistributionRoot,
              "trusted producer runtime distribution",
              stage,
            );
            assertPinnedDirectory(
              trustedProducerRoot,
              pinnedTrustedProducerRoot,
              "trusted producer root",
              stage,
            );
            assertPinnedDirectory(
              trustedProducerScripts,
              pinnedTrustedProducerScripts,
              "trusted producer scripts directory",
              stage,
            );
            assertPinnedRegularFile(
              trustedProducerPath,
              pinnedTrustedProducer,
              "trusted evidence producer",
              stage,
            );
            assertTrustedProducerClosure(`${stage}: before command`);
            if (!candidateGitLink || pinnedCandidateGitLink === null) {
              fail(`${stage}: candidate Git link is not initialized`);
            }
            assertPinnedRegularFile(
              candidateGitLink,
              pinnedCandidateGitLink,
              "candidate Git link",
              stage,
            );
            assertExecutionBindings(stage);
            const payload = Buffer.from(
              JSON.stringify({
                argv,
                timeout_ms: timeoutMs,
                kill_signal: killSignal,
                stdout_mode: stdoutMode,
                stderr_mode: stderrMode,
              }),
              "utf8",
            ).toString("base64url");
            const result = spawnSync(candidatePython, ["-I", "-B", candidateRunner, payload], {
              env: pythonHelperEnvironment({
                ...commandEnvironment,
                RUCKSACK_RUNNER_FRAME_FD: "3",
              }),
              stdio: ["ignore", "pipe", "pipe", "pipe"],
              encoding: "buffer",
              maxBuffer: 65 * 1024 * 1024 + 16 * 1024,
            });
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", stage);
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            assertPinnedRegularFile(trustedSudo, pinnedSudo, "trusted sudo executable", stage);
            assertPinnedPythonRuntime(stage);
            assertPinnedRegularFile(producerNode, pinnedProducerNode, "trusted producer runtime", stage);
            assertPinnedDirectory(
              producerNodeRoot,
              pinnedProducerNodeRoot,
              "trusted producer runtime directory",
              stage,
            );
            assertPinnedDirectory(
              producerNodeDistributionRoot,
              pinnedProducerNodeDistributionRoot,
              "trusted producer runtime distribution",
              stage,
            );
            assertPinnedDirectory(
              trustedProducerRoot,
              pinnedTrustedProducerRoot,
              "trusted producer root",
              stage,
            );
            assertPinnedDirectory(
              trustedProducerScripts,
              pinnedTrustedProducerScripts,
              "trusted producer scripts directory",
              stage,
            );
            assertPinnedRegularFile(
              trustedProducerPath,
              pinnedTrustedProducer,
              "trusted evidence producer",
              stage,
            );
            assertTrustedProducerClosure(`${stage}: after command`);
            assertPinnedRegularFile(
              candidateGitLink,
              pinnedCandidateGitLink,
              "candidate Git link",
              stage,
            );
            assertExecutionBindings(stage);
            if (result.error) fail(`${stage}: trusted candidate runner failed to start: ${result.error.message}`);
            if (result.signal) fail(`${stage}: trusted candidate runner died from ${result.signal}`);
            const frame = parseCandidateRunnerFrame(result.output && result.output[3]);
            if (frame.kind === "refusal") {
              fail(`${stage}: trusted candidate runner refused: ${frame.message}`);
            }
            const stdoutBytes = Buffer.isBuffer(result.stdout) ? result.stdout : Buffer.from(result.stdout || "");
            const stderrBytes = Buffer.isBuffer(result.stderr) ? result.stderr : Buffer.from(result.stderr || "");
            const output = (bytes, mode) => mode === "ignore"
              ? null
              : options.encoding === "utf8"
                ? bytes.toString("utf8")
                : bytes;
            return {
              status: frame.status,
              signal: frame.signal,
              stdout: output(stdoutBytes, stdoutMode),
              stderr: output(stderrBytes, stderrMode),
              error: frame.error,
            };
          }

          function runGit(args, stage, binary = false) {
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            const result = spawnSync(candidateGit, args, {
              cwd: originalCandidateRoot,
              env: { ...commandEnvironment, GIT_OPTIONAL_LOCKS: "0" },
              ...(binary ? {} : { encoding: "utf8" }),
              maxBuffer: 64 * 1024 * 1024,
            });
            if (result.error) fail(`${stage}: git failed to start: ${result.error.message}`);
            if (result.signal || result.status !== 0) {
              fail(`${stage}: git failed with ${result.signal || `exit ${result.status}`}`);
            }
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            return result.stdout || (binary ? Buffer.alloc(0) : "");
          }

          function trackedPath(root, relative) {
            if (!Buffer.isBuffer(relative) || relative.length === 0 || relative[0] === 0x2f) {
              fail("tracked path is invalid");
            }
            const components = [];
            let offset = 0;
            while (offset <= relative.length) {
              const end = relative.indexOf(0x2f, offset);
              const limit = end < 0 ? relative.length : end;
              const component = relative.subarray(offset, limit);
              if (
                component.length === 0 ||
                (component.length === 1 && component[0] === 0x2e) ||
                (component.length === 2 && component[0] === 0x2e && component[1] === 0x2e) ||
                component.includes(0)
              ) {
                fail("tracked path contains an unsafe component");
              }
              components.push(component);
              if (end < 0) break;
              offset = end + 1;
            }
            return Buffer.concat([Buffer.from(root), Buffer.from("/"), ...components.flatMap(
              (component, index) => index === 0 ? [component] : [Buffer.from("/"), component],
            )]);
          }

          function gitPathString(target, stage) {
            const decoded = target.toString("utf8");
            if (!Buffer.from(decoded, "utf8").equals(target) || /[\u0000-\u001f\u007f]/.test(decoded)) {
              fail(`${stage}: Git path is not one safe UTF-8 path`);
            }
            return decoded;
          }

          function runGitAt(root, args, stage, binary = false) {
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            const result = spawnSync(candidateGit, ["-C", root, ...args], {
              env: { ...commandEnvironment, GIT_OPTIONAL_LOCKS: "0" },
              ...(binary ? {} : { encoding: "utf8" }),
              maxBuffer: 64 * 1024 * 1024,
            });
            if (result.error) fail(`${stage}: submodule Git failed to start: ${result.error.message}`);
            if (result.signal || result.status !== 0) {
              fail(`${stage}: submodule Git failed with ${result.signal || `exit ${result.status}`}`);
            }
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            return result.stdout || (binary ? Buffer.alloc(0) : "");
          }

          function runTrustedGit(args, stage) {
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            const trustedPath = String(commandEnvironment.RUCKSACK_CANDIDATE_TRUSTED_PATH || "");
            if (!trustedPath || trustedPath.includes("\0")) {
              fail(`${stage}: trusted Git PATH is unavailable`);
            }
            const result = spawnSync(candidateGit, args, {
              cwd: originalCandidateRoot,
              encoding: "utf8",
              env: {
                GIT_CONFIG_GLOBAL: "/dev/null",
                GIT_CONFIG_NOSYSTEM: "1",
                GIT_NO_REPLACE_OBJECTS: "1",
                GIT_OPTIONAL_LOCKS: "0",
                GIT_TERMINAL_PROMPT: "0",
                HOME: "/nonexistent",
                LANG: "C",
                LC_ALL: "C",
                PATH: trustedPath,
              },
              maxBuffer: 64 * 1024 * 1024,
            });
            if (result.error) fail(`${stage}: trusted Git failed to start: ${result.error.message}`);
            if (result.signal || result.status !== 0) {
              fail(`${stage}: trusted Git failed with ${result.signal || `exit ${result.status}`}: ${result.stderr}`);
            }
            assertPinnedRegularFile(candidateGit, pinnedGit, "trusted git executable", stage);
            return result.stdout;
          }

          function directoryEntryPath(directory, name, stage) {
            if (
              !Buffer.isBuffer(name) ||
              name.length === 0 ||
              name.includes(0) ||
              name.includes(0x2f) ||
              name.equals(Buffer.from(".")) ||
              name.equals(Buffer.from(".."))
            ) {
              fail(`${stage}: submodule contains an unsafe path`);
            }
            return Buffer.concat([
              Buffer.isBuffer(directory) ? directory : Buffer.from(directory),
              Buffer.from("/"),
              name,
            ]);
          }

          function directoryTreeDigest(root, stage) {
            const hash = createHash("sha256");
            const budget = { remaining: 512 * 1024 * 1024 };
            function visit(directory, relative) {
              const names = fs.readdirSync(directory, { encoding: "buffer" }).sort(Buffer.compare);
              for (const name of names) {
                if (name.equals(Buffer.from(".git"))) continue;
                const source = directoryEntryPath(directory, name, stage);
                const childRelative = relative.length
                  ? Buffer.concat([relative, Buffer.from("/"), name])
                  : Buffer.from(name);
                const details = fs.lstatSync(source);
                hash.update(childRelative);
                hash.update(Buffer.from([0]));
                if (details.isDirectory() && !details.isSymbolicLink()) {
                  hash.update("directory\0");
                  visit(source, childRelative);
                  continue;
                }
                if (details.isSymbolicLink()) {
                  hash.update("symlink\0");
                  hash.update(fs.readlinkSync(source, { encoding: "buffer" }));
                  hash.update(Buffer.from([0]));
                  continue;
                }
                if (!details.isFile() || details.isSymbolicLink() || details.nlink !== 1) {
                  fail(`${stage}: submodule contains an unsupported or shared entry`);
                }
                if (details.size > budget.remaining) fail(`${stage}: submodule exceeds 512 MiB`);
                budget.remaining -= details.size;
                hash.update((details.mode & 0o111) !== 0 ? "file+x\0" : "file\0");
                const descriptor = fs.openSync(source, "r");
                try {
                  const chunk = Buffer.allocUnsafe(64 * 1024);
                  for (;;) {
                    const count = fs.readSync(descriptor, chunk, 0, chunk.length, null);
                    if (count === 0) break;
                    hash.update(chunk.subarray(0, count));
                  }
                } finally {
                  fs.closeSync(descriptor);
                }
                hash.update(Buffer.from([0]));
              }
            }
            visit(Buffer.from(root), Buffer.alloc(0));
            return hash.digest("hex");
          }

          function nestedGitlinkEntries(root, stage) {
            const listing = runGitAt(root, ["ls-files", "--stage", "-z"], stage, true);
            const gitlinks = [];
            let offset = 0;
            while (offset < listing.length) {
              const end = listing.indexOf(0, offset);
              if (end < 0) fail(`${stage}: nested tracked-file listing is not NUL terminated`);
              const record = listing.subarray(offset, end);
              const separator = record.indexOf(9);
              if (separator < 0) fail(`${stage}: nested tracked-file listing is malformed`);
              const fields = record.subarray(0, separator).toString("ascii").split(" ");
              if (fields.length !== 3 || fields[2] !== "0") {
                fail(`${stage}: nested tracked-file listing contains an unmerged entry`);
              }
              if (fields[0] === "160000") {
                const entry = {
                  mode: fields[0],
                  oid: fields[1],
                  path: Buffer.from(record.subarray(separator + 1)),
                  label: record.subarray(separator + 1).toString("hex"),
                };
                if (!/^[0-9a-f]{40}$/.test(entry.oid)) {
                  fail(`${stage}: nested tracked-file listing contains an invalid object id`);
                }
                gitlinks.push(entry);
              }
              offset = end + 1;
            }
            return gitlinks;
          }

          function captureGitlinkState(
            entry,
            stage,
            parentRoot = originalCandidateRoot,
            fullPath = entry.path,
            depth = 0,
          ) {
            if (depth > 32) fail(`${stage}: initialized gitlinks exceed 32 nested levels`);
            if (!/^[0-9a-f]{40}$/.test(entry.oid)) {
              fail(`${stage}: gitlink object id is invalid`);
            }
            const target = trackedPath(parentRoot, entry.path);
            let details;
            try {
              details = fs.lstatSync(target);
            } catch (error) {
              if (error.code === "ENOENT") {
                return {
                  initialized: false,
                  gitDir: "",
                  treeDigest: "",
                  descendants: [],
                  digest: `gitlink:${entry.oid}:absent`,
                };
              }
              fail(`${stage}: gitlink ${entry.label} is unavailable: ${error.message}`);
            }
            if (!details.isDirectory() || details.isSymbolicLink()) {
              fail(`${stage}: gitlink ${entry.label} is not a directory`);
            }
            const root = gitPathString(target, stage);
            if (!fs.existsSync(path.join(root, ".git"))) {
              const visible = fs.readdirSync(root);
              if (visible.length !== 0) {
                fail(`${stage}: uninitialized gitlink ${entry.label} contains files`);
              }
              return {
                initialized: false,
                gitDir: "",
                treeDigest: "",
                descendants: [],
                digest: `gitlink:${entry.oid}:uninitialized`,
              };
            }
            const gitDirInput = runGitAt(root, ["rev-parse", "--absolute-git-dir"], stage).trim();
            if (!gitDirInput.startsWith("/") || /[\u0000-\u001f\u007f]/.test(gitDirInput)) {
              fail(`${stage}: gitlink ${entry.label} Git directory is invalid`);
            }
            const gitDir = fs.realpathSync(gitDirInput);
            const gitDirStats = fs.lstatSync(gitDir);
            if (!gitDirStats.isDirectory() || gitDirStats.isSymbolicLink()) {
              fail(`${stage}: gitlink ${entry.label} Git directory is not one real directory`);
            }
            const head = runGitAt(root, ["rev-parse", "--verify", "HEAD^{commit}"], stage)
              .trim()
              .toLowerCase();
            if (head !== entry.oid) fail(`${stage}: gitlink ${entry.label} is at the wrong commit`);
            const changed = runGitAt(
              root,
              [
                "status",
                "--porcelain=v1",
                "--untracked-files=all",
                "--ignored=matching",
                "--ignore-submodules=none",
              ],
              stage,
            ).trim();
            if (changed) fail(`${stage}: gitlink ${entry.label} is not clean`);
            const treeDigest = directoryTreeDigest(root, stage);
            const descendants = [];
            for (const nestedEntry of nestedGitlinkEntries(root, stage)) {
              const nestedPath = Buffer.concat([fullPath, Buffer.from("/"), nestedEntry.path]);
              const nestedState = captureGitlinkState(
                nestedEntry,
                stage,
                root,
                nestedPath,
                depth + 1,
              );
              descendants.push(
                {
                  ...nestedEntry,
                  path: nestedPath,
                  label: nestedPath.toString("hex"),
                  gitlinkInitialized: nestedState.initialized,
                  gitlinkGitDir: nestedState.gitDir,
                  gitlinkTreeDigest: nestedState.treeDigest,
                  digest: nestedState.digest,
                },
                ...nestedState.descendants,
              );
            }
            if (descendants.length > 256) {
              fail(`${stage}: candidate checkout contains too many nested gitlinks`);
            }
            const descendantsDigest = createHash("sha256")
              .update(JSON.stringify(descendants.map((nested) => [
                nested.path.toString("hex"),
                nested.oid,
                nested.digest,
              ])))
              .digest("hex");
            return {
              initialized: true,
              gitDir,
              treeDigest,
              descendants,
              digest: `gitlink:${entry.oid}:initialized:${treeDigest}:nested:${descendantsDigest}`,
            };
          }

          function copyDirectoryTree(source, target, stage) {
            fs.mkdirSync(target, { recursive: true, mode: 0o700 });
            const names = fs.readdirSync(source, { encoding: "buffer" }).sort(Buffer.compare);
            for (const name of names) {
              if (name.equals(Buffer.from(".git"))) continue;
              const sourcePath = directoryEntryPath(source, name, stage);
              const targetPath = directoryEntryPath(target, name, stage);
              const details = fs.lstatSync(sourcePath);
              if (details.isDirectory() && !details.isSymbolicLink()) {
                copyDirectoryTree(sourcePath, targetPath, stage);
              } else if (details.isSymbolicLink()) {
                fs.symlinkSync(fs.readlinkSync(sourcePath, { encoding: "buffer" }), targetPath);
              } else if (details.isFile() && !details.isSymbolicLink() && details.nlink === 1) {
                fs.copyFileSync(sourcePath, targetPath, fs.constants.COPYFILE_EXCL);
                fs.chmodSync(targetPath, (details.mode & 0o111) !== 0 ? 0o700 : 0o600);
              } else {
                fail(`${stage}: submodule contains an unsupported or shared entry`);
              }
            }
          }

          function trackedDigest(entry, stage, root = originalCandidateRoot) {
            if (entry.mode === "160000") {
              if (root !== originalCandidateRoot) fail(`${stage}: gitlink digest requires the original checkout`);
              return captureGitlinkState(entry, stage).digest;
            }
            const target = trackedPath(root, entry.path);
            let stats;
            try {
              stats = fs.lstatSync(target);
            } catch (error) {
              fail(`${stage}: tracked path ${entry.label} is unavailable: ${error.message}`);
            }
            const hash = createHash("sha256");
            if (entry.mode === "120000") {
              if (!stats.isSymbolicLink()) fail(`${stage}: tracked path ${entry.label} changed type`);
              hash.update(fs.readlinkSync(target, { encoding: "buffer" }));
              return hash.digest("hex");
            }
            if (entry.mode !== "100644" && entry.mode !== "100755") {
              fail(`${stage}: tracked path ${entry.label} has unsupported mode ${entry.mode}`);
            }
            if (!stats.isFile() || stats.isSymbolicLink()) {
              fail(`${stage}: tracked path ${entry.label} changed type`);
            }
            const executable = (stats.mode & 0o111) !== 0;
            if (executable !== (entry.mode === "100755")) {
              fail(`${stage}: tracked path ${entry.label} changed executable mode`);
            }
            const descriptor = fs.openSync(target, "r");
            try {
              const chunk = Buffer.allocUnsafe(64 * 1024);
              for (;;) {
                const count = fs.readSync(descriptor, chunk, 0, chunk.length, null);
                if (count === 0) break;
                hash.update(chunk.subarray(0, count));
              }
            } finally {
              fs.closeSync(descriptor);
            }
            return hash.digest("hex");
          }

          function captureTrackedState(stage) {
            const listing = runGit(["ls-files", "--stage", "-z"], stage, true);
            const tracked = [];
            let offset = 0;
            while (offset < listing.length) {
              const end = listing.indexOf(0, offset);
              if (end < 0) fail(`${stage}: tracked-file listing is not NUL terminated`);
              const record = listing.subarray(offset, end);
              const separator = record.indexOf(9);
              if (separator < 0) fail(`${stage}: tracked-file listing is malformed`);
              const fields = record.subarray(0, separator).toString("ascii").split(" ");
              if (fields.length !== 3 || fields[2] !== "0") {
                fail(`${stage}: tracked-file listing contains an unmerged entry`);
              }
              const entry = {
                mode: fields[0],
                oid: fields[1],
                path: Buffer.from(record.subarray(separator + 1)),
                label: record.subarray(separator + 1).toString("hex"),
              };
              if (!/^[0-9a-f]{40}$/.test(entry.oid)) {
                fail(`${stage}: tracked-file listing contains an invalid object id`);
              }
              if (entry.mode === "160000") {
                const gitlink = captureGitlinkState(entry, stage);
                entry.gitlinkInitialized = gitlink.initialized;
                entry.gitlinkGitDir = gitlink.gitDir;
                entry.gitlinkTreeDigest = gitlink.treeDigest;
                entry.gitlinkDescendants = gitlink.descendants;
                entry.digest = gitlink.digest;
              } else {
                entry.digest = trackedDigest(entry, stage);
              }
              tracked.push(entry);
              offset = end + 1;
            }
            return tracked;
          }

          function initializedGitlinksFromTracked(tracked) {
            return tracked.flatMap((entry) => {
              if (entry.mode !== "160000" || !entry.gitlinkInitialized) return [];
              return [
                entry,
                ...(entry.gitlinkDescendants || []).filter(
                  (nested) => nested.mode === "160000" && nested.gitlinkInitialized,
                ),
              ];
            });
          }

          function assertTrackedState(tracked, stage) {
            for (const entry of tracked) {
              if (trackedDigest(entry, stage) !== entry.digest) {
                fail(`${stage}: tracked path ${entry.label} no longer matches the tested checkout`);
              }
            }
          }

          function workspaceParent(target) {
            const separator = target.lastIndexOf(0x2f);
            if (separator <= 0) fail("candidate workspace path has no parent");
            return target.subarray(0, separator);
          }

          function sealCandidateWritableDirectory(target, label) {
            assertPinnedRegularFile(candidateRunner, pinnedRunner, "trusted candidate runner", label);
