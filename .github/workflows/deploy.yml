# Generated by rucksack. Cloudflare Workers deploys run with GitHub Environment-scoped secrets.
name: Rucksack Workers Deploy

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: workers-deploy-${{ github.repository }}-${{ github.ref_name }}-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'push' }}
  cancel-in-progress: false

jobs:
  full-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Secret scan
        run: |
          set -eu
          token_marker='github''_pat_[A-Za-z0-9_]{20,}|gh''p_[A-Za-z0-9_]{20,}'
          private_key_marker='-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE[ ]KEY-----'
          ! git grep -n -E "($token_marker|$private_key_marker)" -- . ':!.git' ':!.agent/harness-backups' ':!.agent/harness-runs'
      - name: Repository checks
        run: |
          set -eu
          if [ -f package.json ]; then
            corepack enable || true
            if [ -f pnpm-lock.yaml ]; then
              pnpm install --frozen-lockfile
              runner=pnpm
            elif [ -f yarn.lock ]; then
              yarn install --frozen-lockfile
              runner=yarn
            elif [ -f package-lock.json ]; then
              npm ci
              runner=npm
            else
              npm install
              runner=npm
            fi
            if node -e "const s=require('./package.json').scripts||{}; process.exit(s.lint?0:1)"; then
              $runner run lint
            fi
            if node -e "const s=require('./package.json').scripts||{}; process.exit(s['type-check']?0:1)"; then
              $runner run type-check
            elif node -e "const s=require('./package.json').scripts||{}; process.exit(s.typecheck?0:1)"; then
              $runner run typecheck
            fi
            if node -e "const s=require('./package.json').scripts||{}; process.exit(s.test?0:1)"; then
              $runner run test
            fi
            if node -e "const s=require('./package.json').scripts||{}; process.exit(s['content:check']?0:1)"; then
              $runner run content:check
            fi
          fi
          if [ -f wrangler.toml ] || [ -f wrangler.json ] || [ -f wrangler.jsonc ]; then
            npx wrangler deploy --dry-run
          fi

  staging:
    if: ${{ vars.RUCKSACK_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref_name == 'staging') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'staging' && inputs.environment == 'staging')) }}
    needs: full-ci
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy staging Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npm ci
          npm run worker:deploy:preview

  production:
    if: ${{ vars.RUCKSACK_DEPLOY_ENABLED == 'true' && ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && github.ref_name == 'main' && inputs.environment == 'production')) }}
    needs: full-ci
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Deploy production Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -eu
          npm ci
          npm run worker:deploy:production
